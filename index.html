        this.ghost(c, type, gx, gy, r, chk.ok || chk.same, mode);
      }
      if (LP.n > 1) Tools.ghostCost = spent; else Tools.ghostCost = 0;
      Tools.ghostBad = bad;
    } else if (tm === 'paste' && Tools.bp) {
      const [ox, oy] = Tools.bpOrigin(); let spent = 0, bad = 0;
      for (const it of Tools.bp.items) {
        const chk = Build.check(it.t, ox + it.dx, oy + it.dy, it.r, spent);
        if (chk.ok) spent += chk.cost; else if (!chk.same) { bad++; Tools.ghostReason = chk.reason; }
        this.ghost(c, it.t, ox + it.dx, oy + it.dy, it.r, chk.ok || chk.same, it.cfg.m | 0);
      }
      Tools.ghostCost = spent; Tools.ghostBad = bad;
    } else if ((tm === 'demolish' || tm === 'copy')) {
      const d = Tools.drag || { sx: Input.tx, sy: Input.ty, cx: Input.tx, cy: Input.ty };
      const bx0 = Math.min(d.sx, d.cx), by0 = Math.min(d.sy, d.cy), bx1 = Math.max(d.sx, d.cx), by1 = Math.max(d.sy, d.cy);
      const col = tm === 'demolish' ? '238,93,93' : '79,176,216';
      if (Tools.drag) {
        const { set } = Tools.boxEnts(d, tm === 'copy');
        c.fillStyle = `rgba(${col},0.28)`;
        for (const e of set) c.fillRect(e.x * TILE, e.y * TILE, e.w * TILE, e.h * TILE);
      } else if (hov && tm === 'demolish') { c.fillStyle = `rgba(${col},0.3)`; c.fillRect(hov.x * TILE, hov.y * TILE, hov.w * TILE, hov.h * TILE); }
      c.fillStyle = `rgba(${col},0.08)`; c.fillRect(bx0 * TILE, by0 * TILE, (bx1 - bx0 + 1) * TILE, (by1 - by0 + 1) * TILE);
      c.strokeStyle = `rgba(${col},0.9)`; c.lineWidth = 2 * inv; c.setLineDash([6 * inv, 4 * inv]);
      c.strokeRect(bx0 * TILE, by0 * TILE, (bx1 - bx0 + 1) * TILE, (by1 - by0 + 1) * TILE); c.setLineDash([]);
    } else if (tm === 'select' && !hov && World.inb(Input.tx, Input.ty) && World.res[Input.ty * MAP_W + Input.tx] && this.ts >= 10) {
      c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 1.5 * inv; c.setLineDash([4 * inv, 3 * inv]);
      c.strokeRect(Input.tx * TILE + 2, Input.ty * TILE + 2, TILE - 4, TILE - 4); c.setLineDash([]);
    }
  },
  ghost(c, type, x, y, rot, ok, mode) {
    const def = BUILDINGS[type], S = def.size * TILE, img = Sprites.bodyFor(type, rot, mode);
    c.globalAlpha = 0.6; c.drawImage(img, x * TILE, y * TILE, S, S); c.globalAlpha = 1;
    c.fillStyle = ok ? 'rgba(87,207,121,0.22)' : 'rgba(238,93,93,0.35)'; c.fillRect(x * TILE, y * TILE, S, S);
    c.strokeStyle = ok ? 'rgba(87,207,121,0.9)' : 'rgba(238,93,93,0.95)'; c.lineWidth = 1.5 / Cam.zoom; c.strokeRect(x * TILE + 0.5, y * TILE + 0.5, S - 1, S - 1);
    if (DIRECTIONAL[def.kind] && def.kind !== 'belt') {
      const cx = (x + def.size / 2) * TILE, cy = (y + def.size / 2) * TILE;
      arrowHead(c, cx + DX[rot] * (S / 2 + 6), cy + DY[rot] * (S / 2 + 6), rot * Math.PI / 2, 7, ok ? '#bff5cc' : '#ffb3b3');
    }
    if (def.kind === 'miner' && ok) {
      let cnt = 0; for (let yy = y; yy < y + def.size; yy++) for (let xx = x; xx < x + def.size; xx++) { const r = World.res[yy * MAP_W + xx]; if (r && ((r === RES_OIL) === !!def.oil)) cnt++; }
      c.fillStyle = '#fff'; c.font = `bold ${Math.max(9, 11 / Cam.zoom)}px system-ui,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(`${cnt}/${def.size * def.size}`, (x + def.size / 2) * TILE, (y + def.size / 2) * TILE);
    }
  },
  drawLighting(c) {
    if (!Settings.daynight) return;
    const light = Sim.daylight, dark = clamp((0.62 - light) / 0.54, 0, 1);
    if (dark <= 0.01) return;
    c.globalCompositeOperation = 'multiply';
    c.fillStyle = `rgb(${Math.round(255 - dark * 105)},${Math.round(255 - dark * 90)},${Math.round(255 - dark * 45)})`;
    c.fillRect(0, 0, this.W, this.H);
    c.globalCompositeOperation = 'lighter';
    const z = Cam.zoom;
    c.globalAlpha = dark * 0.85;
    for (let i = 0; i < this.glowN; i++) {
      const img = this.glowK[i] === 1 ? Sprites.glowCool : Sprites.glow;
      const r = this.glowR[i] * z * (this.glowK[i] === 2 ? 1 : 1.2), sx = Cam.sx(this.glowX[i]), sy = Cam.sy(this.glowY[i]);
      c.drawImage(img, sx - r, sy - r, r * 2, r * 2);
    }
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  },

  floatText(wx, wy, txt, col) {
    let i = FT.n < FT.N ? FT.n++ : 0;
    if (FT.n >= FT.N) { let m = 0; for (let k = 1; k < FT.N; k++) if (FT.life[k] < FT.life[m]) m = k; i = m; }
    FT.x[i] = wx; FT.y[i] = wy; FT.life[i] = 1.4; FT.txt[i] = txt; FT.col[i] = col;
  },
  drawTexts(c, dt) {
    if (!FT.n) return;
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '700 14px system-ui,sans-serif';
    for (let i = 0; i < FT.n; i++) {
      FT.life[i] -= dt; FT.y[i] -= dt * 26 / Math.max(0.3, Cam.zoom);
      if (FT.life[i] <= 0) { const j = --FT.n; FT.x[i] = FT.x[j]; FT.y[i] = FT.y[j]; FT.life[i] = FT.life[j]; FT.txt[i] = FT.txt[j]; FT.col[i] = FT.col[j]; i--; continue; }
      const sx = Cam.sx(FT.x[i]), sy = Cam.sy(FT.y[i]);
      if (sx < -50 || sy < -50 || sx > this.W + 50 || sy > this.H + 50) continue;
      c.globalAlpha = Math.min(1, FT.life[i] * 1.5);
      c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.7)'; c.strokeText(FT.txt[i], sx, sy);
      c.fillStyle = FT.col[i]; c.fillText(FT.txt[i], sx, sy);
    }
    c.globalAlpha = 1;
  },
  burst(wx, wy, col, n) {
    if (!Settings.particles || Settings.quality === 'low') return;
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = 40 + Math.random() * 90; Particles.spawn(2, wx, wy, Math.cos(a) * s, Math.sin(a) * s - 40, 0.5 + Math.random() * 0.4, 1.5 + Math.random() * 2, 0, col); }
  },

  drawMinimap(dt) {
    if (!Settings.minimap) return;
    this.mmT -= dt;
    if (this.mmT > 0) return;
    this.mmT = 1 / 15;
    const mc = this.mmCtx;
    if (this.mmDirty || (this.mmAge = (this.mmAge || 0) + 1) > 15) {
      this.mmAge = 0; this.mmDirty = false;
      const bc = this.mmBuild.getContext('2d');
      bc.clearRect(0, 0, MAP_W, MAP_H); bc.drawImage(this.mmBase, 0, 0);
      for (const e of Sim.ents.values()) { bc.fillStyle = e.def.kind === 'belt' ? '#e8d9a8' : e.def.color; bc.fillRect(e.x, e.y, e.w, e.h); }
    }
    mc.imageSmoothingEnabled = false;
    mc.drawImage(this.mmBuild, 0, 0);
    const vx = Cam.wx(0) / TILE, vy = Cam.wy(0) / TILE, vw = this.W / Cam.zoom / TILE, vh = this.H / Cam.zoom / TILE;
    mc.strokeStyle = '#fff'; mc.lineWidth = 1.5; mc.strokeRect(vx, vy, vw, vh);
    mc.strokeStyle = 'rgba(0,0,0,0.5)'; mc.lineWidth = 1; mc.strokeRect(vx - 1, vy - 1, vw + 2, vh + 2);
  },

  // screen-space confetti for milestones
  celebrate(sx, sy) {
    if (!Settings.particles) return;
    const cols = ['#f0a53a', '#57cf79', '#4fb0d8', '#e0524f', '#c7b4ff', '#fff'];
    for (let i = 0; i < 70; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, s = 250 + Math.random() * 450; this.conf.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: Math.random() * 6, vr: (Math.random() - 0.5) * 12, l: 1.6 + Math.random(), c: cols[i % cols.length] }); }
  },
  drawFx(dt) {
    const c = this.fxc;
    if (!this.conf.length) { if (this.fxDirty) { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.fx.width, this.fx.height); this.fxDirty = false; } return; }
    this.fxDirty = true;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); c.clearRect(0, 0, this.W, this.H);
    for (let i = this.conf.length - 1; i >= 0; i--) {
      const p = this.conf[i]; p.l -= dt; if (p.l <= 0) { this.conf.splice(i, 1); continue; }
      p.vy += 700 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      c.save(); c.globalAlpha = Math.min(1, p.l); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-4, -2.5, 8, 5); c.restore();
    }
  },
};

/* =====================================================================
   7. UI — DOM panels, tooltips, modals, HUD (throttled to ~10 Hz)
   ===================================================================== */
const Settings = {
  KEYS: ['master', 'music', 'sfx', 'quality', 'particles', 'shadows', 'daynight', 'events', 'uiScale', 'colorblind', 'autosave', 'showFps', 'grid', 'minimap', 'tutorial'],
  master: 0.7, music: 0.35, sfx: 0.8, quality: 'high', particles: true, shadows: true, daynight: true, events: true,
  uiScale: 1, colorblind: false, autosave: 30, showFps: false, grid: true, minimap: true, tutorial: true,
  load() {
    try { const o = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); for (const k of this.KEYS) if (o[k] !== undefined && typeof o[k] === typeof this[k]) this[k] = o[k]; } catch (_) { /* defaults */ }
    if (window.matchMedia && matchMedia('(pointer:coarse)').matches && !localStorage.getItem(SETTINGS_KEY)) this.quality = 'medium';
    this.apply();
  },
  save() { try { const o = {}; for (const k of this.KEYS) o[k] = this[k]; localStorage.setItem(SETTINGS_KEY, JSON.stringify(o)); } catch (_) { /* storage full or blocked */ } this.apply(); },
  apply() {
    document.documentElement.style.setProperty('--ui', this.uiScale);
    $('minimap').style.display = this.minimap ? '' : 'none';
    $('mm-toggle').textContent = this.minimap ? '▾' : '▸';
    $('fps').style.display = this.showFps ? '' : 'none';
    Sfx.setVolumes();
  },
};

const UI = {
  cat: 'logistics', sel: null, modal: null, search: '', buildBtns: [], tipOwner: null, tipHtml: '', hudT: 0, modalT: 0,
  statSel: II.iron_plate, statTab: 'prod', lastSoldSfx: 0, confirmCb: null,

    });

    const bind = (id, fn) => { $(id).addEventListener('click', () => { Sfx.unlock(); fn(); }); };

    bind('btn-research', () => this.openModal('m-research'));

    bind('btn-goals', () => this.openModal('m-goals'));
    bind('btn-codex', () => this.openModal('m-codex'));

    mm.addEventListener('pointerdown', ev => { mmDrag = true; mm.setPointerCapture(ev.pointerId); mmJump(ev); Sfx.unlock(); });

    Bus.on('sold', (e, amt) => {

      const r = $('objective').getBoundingClientRect(); Render.celebrate(r.left + r.width / 2, r.bottom);

    Bus.on('research', t => {
      this.toast(`🔬 Researched <b>${esc(t.name)}</b>${t.levels > 1 ? ' Lv ' + Research.level(t.id) : ''}`, 'good');
      Sfx.play('research'); this.renderBuild(); Render.celebrate(this.W() / 2, this.H() / 3);

    Bus.on('event', (msg, type) => { this.toast(esc(msg), type || 'info', 5000); if (type === 'good') Sfx.play('achieve'); });
    Bus.on('placed', () => { Render.mmDirty = true; });

  },
  W() { return window.innerWidth; }, H() { return window.innerHeight; },
  onScreen(e) { const sx = Cam.sx((e.x + e.w / 2) * TILE), sy = Cam.sy((e.y + e.h / 2) * TILE); return sx > -80 && sy > -80 && sx < this.W() + 80 && sy < this.H() + 80; },

  toast(html, type = '', ms = 2600) {
    const box = $('toasts');
    while (box.children.length > 4) box.firstChild.remove();
    const d = document.createElement('div'); d.className = 'toast ' + type; d.innerHTML = html; box.appendChild(d);
    setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 320); }, ms);
  },
  showTip(html) { const t = $('tooltip'); if (this.tipHtml !== html) { t.innerHTML = html; this.tipHtml = html; } t.classList.add('show'); this.posTip(); },
  hideTip() { $('tooltip').classList.remove('show'); this.tipHtml = ''; },
  posTip() {
    const t = $('tooltip'); if (!t.classList.contains('show')) return;
    const w = t.offsetWidth, h = t.offsetHeight;
    let x = (this.px || 0) + 16, y = (this.py || 0) + 18;
    if (x + w > this.W() - 8) x = (this.px || 0) - w - 12;
    if (y + h > this.H() - 8) y = (this.py || 0) - h - 12;
    t.style.transform = `translate(${Math.max(4, x) | 0}px,${Math.max(4, y) | 0}px)`;
  },

  /* ---------- build bar ---------- */
  setCat(id) {
    this.cat = id;
    document.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b.dataset.cat === id && !this.search));
    this.renderBuild();
  },
  nextCat(d) { const i = BUILD_CATS.findIndex(c => c.id === this.cat); this.search = ''; $('build-search').value = ''; this.setCat(BUILD_CATS[(i + d + BUILD_CATS.length) % BUILD_CATS.length].id); },
  renderBuild() {
    const box = $('build-items'); box.innerHTML = '';
    document.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b.dataset.cat === this.cat && !this.search));
    const list = this.search ? BTYPES.filter(k => BUILDINGS[k].name.toLowerCase().includes(this.search) || BUILDINGS[k].cat.includes(this.search)) : BTYPES.filter(k => BUILDINGS[k].cat === this.cat);
    this.buildBtns = list.map((k, i) => {
      const def = BUILDINGS[k], b = document.createElement('button');
      b.className = 'bitem'; b.id = 'bi-' + k; b.setAttribute('aria-label', def.name);
      b.appendChild(Sprites.icon(k, 72));
      const c = document.createElement('span'); c.className = 'c'; b.appendChild(c);
      if (i < 9) { const h = document.createElement('span'); h.className = 'hk'; h.textContent = i + 1; b.appendChild(h); }
      const kit = document.createElement('span'); kit.className = 'kit hidden'; b.appendChild(kit);
      const lk = document.createElement('span'); lk.className = 'lk hidden'; lk.innerHTML = '<svg class="i"><use href="#i-lock"/></svg>'; b.appendChild(lk);
      b.addEventListener('click', () => { Sfx.unlock(); if (!Build.unlocked(k)) { this.toast(`🔒 Research <b>${esc(TECH[def.tech].name)}</b> to unlock ${esc(def.name)}`, 'bad'); Sfx.play('error'); return; } Tools.pick(k); });
      b.addEventListener('pointerenter', () => { this.tipOwner = b; this.showTip(this.buildTip(k)); });
      b.addEventListener('pointerleave', () => { if (this.tipOwner === b) { this.tipOwner = null; this.hideTip(); } });
      box.appendChild(b);
      return { k, b, c, kit, lk };
    });
    this.refreshBuild();
  },
  refreshBuild() {
    for (const it of this.buildBtns) {
      const def = BUILDINGS[it.k], un = Build.unlocked(it.k), kit = Build.kit[it.k] | 0;
      it.b.classList.toggle('locked', !un); it.lk.classList.toggle('hidden', un);
      it.b.classList.toggle('on', Tools.mode === 'build' && Tools.type === it.k);
      const txt = kit > 0 ? 'FREE' : fmtMoney(def.cost);
      if (it.c.textContent !== txt) it.c.textContent = txt;
      it.c.classList.toggle('no', kit <= 0 && Econ.cash < def.cost);
      it.kit.classList.toggle('hidden', kit <= 0); if (kit > 0) it.kit.textContent = '×' + kit;
    }
  },
  hotkey(n) { const it = this.buildBtns[n - 1]; if (it) it.b.click(); },
  buildTip(k) {
    const def = BUILDINGS[k], un = Build.unlocked(k), kit = Build.kit[k] | 0;
    const rows = [];
    rows.push(['Cost', kit > 0 ? `FREE (starter kit ×${kit})` : fmtMoney(def.cost)]);
    rows.push(['Size', `${def.size}×${def.size}`]);
    if (def.kind === 'belt') rows.push(['Throughput', fmtRate(def.speed / SP)], ['Speed', def.speed + ' tiles/s']);
    if (def.kind === 'miner') rows.push(['Output', `${fmtRate(def.rate * Upg.mining)} per ore tile`]);
    if (def.kind === 'machine') rows.push(['Speed', `×${(def.speed * Upg.speed).toFixed(2)}`], ['Crafts', CRAFT_NAMES[def.craft]]);
    if (def.power) rows.push(['Power', fmtPower(def.power)]);
    if (def.out) rows.push(['Generates', fmtPower(def.out)]);
    if (def.cap && def.kind === 'battery') rows.push(['Capacity', fmt(def.cap / 1000) + ' MJ']);
    if (def.cap && def.kind === 'storage') rows.push(['Capacity', fmt(def.cap * Upg.storage) + ' items']);
    const kv = rows.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('');
    const i = this.buildBtns.findIndex(b => b.k === k);
    return `<h4>${esc(def.name)}${i >= 0 && i < 9 ? ` <kbd>${i + 1}</kbd>` : ''}</h4><div class="d">${esc(def.desc)}</div><div class="kv">${kv}</div>` +
      (un ? '' : `<div class="bad" style="margin-top:.35rem">🔒 Requires research: ${esc(TECH[def.tech].name)}</div>`);
  },
  onToolChange() {
    const m = Tools.mode;
    const map = { select: 'tool-select', demolish: 'tool-demolish', copy: 'tool-copy', paste: 'tool-paste' };
    for (const k in map) $(map[k]).classList.toggle('on', m === k);
    this.refreshBuild();
    const hints = {
      select: '<b>Select</b> · click a building to inspect · click ore to hand-mine · drag to pan',

  upgrade(e) {
    const to = e.def.upgrade, up = BUILDINGS[to];
    if (!to || !Build.unlocked(to)) return;
    const refund = e.kit ? 0 : e.paid * BALANCE.refundRate, cost = ((Build.kit[to] | 0) > 0 ? 0 : up.cost) - refund;
    if (Econ.cash < cost) { this.toast(`Need ${fmtMoney(cost)} to upgrade`, 'bad'); Sfx.play('error'); return; }
    const snap = snapEnt(e);
    History.begin(); History.recDel(snap);
    Build.demolish(e, true);
    const n = Build.place(to, snap.x, snap.y, snap.r);
    const cfg = Object.assign({}, snap); delete cfg.p; delete cfg.k; delete cfg.t;
    applySnap(n, cfg);
    if (History.cur) History.cur.add = [snapEnt(n)];
    History.end();
    Sfx.play('research'); Render.burst((n.x + n.w / 2) * TILE, (n.y + n.h / 2) * TILE, '#ffd54a', 18);
    this.inspect(n);
  },
  updateInspector() {
    const e = this.sel; if (!e) return;
    if (e.dead) { this.closeInspector(); return; }

    const k = e.def.kind;
    const lamp = $('insp-lamp');
    if (lamp) { const s = ST_INFO[e.status]; lamp.style.background = Settings.colorblind ? s.cb : s.color; set('insp-status', s.name); $('insp-eff').style.width = (clamp(e.eff, 0, 1) * 100).toFixed(0) + '%'; }
    if (k === 'miner') { set('insp-rate', `${fmt(e.def.rate * e.tiles * Upg.mining * 60)}/min`); set('insp-buf', e.outN); }
    if (k === 'machine') {
      const ins = [], outs = [];
      if (e.recipe >= 0 && !e.def.auto) RECIPES[e.recipe].inp.forEach(([i]) => ins.push(i));
      else for (let i = 0; i < NI; i++) if (e.inb[i] > 0 && i !== COAL) ins.push(i);
      if (e.def.fuel) ins.push(COAL);
      for (let i = 0; i < NI; i++) if (e.outb[i] > 0) outs.push(i);
      const sig = ins.map(i => i + ':' + e.inb[i]).join(',') + '|' + outs.map(i => i + ':' + e.outb[i]).join(',');
      if (this._bufSig !== sig) {

        set('insp-out', outs.length ? outs.map(i => this.itemChip(i, e.outb[i])).join('') : '<span style="color:var(--faint);font-size:.8rem">empty</span>');
        this.paintIcons($('inspector'));
      }
      if (e.def.fuel) set('insp-fuel', `${e.fuel} crafts left + ${e.inb[COAL]} coal`);
      set('insp-crafted', fmt(e.crafted));
    }
    if (k === 'belt') set('insp-bitems', e.n);
    if (k === 'router') set('insp-rbuf', e.bn);
    if (k === 'storage') {
      set('insp-store', `${fmt(e.total)} / ${fmt(e.def.cap * Upg.storage)}`);
      const list = []; for (let i = 0; i < NI; i++) if (e.store[i] > 0) list.push(i);

    }
    if (k === 'gen') { set('insp-coal', `${e.fuelN} + ${Math.round(e.energy / BALANCE.coalEnergy * 100)}% burning`); set('insp-load', Math.round(e.load * 100) + '%'); }
    if (k === 'solar') set('insp-solar', fmtPower(e.def.out * Sim.daylight));
    if (k === 'battery') set('insp-charge', `${fmt(e.charge / 1000)} / ${fmt(e.def.cap / 1000)} MJ`);
    if (k === 'pole') {

  },

  renderResearch() {

      const cls = maxed ? 'done' : !pre ? 'locked' : aff ? 'afford' : 'avail';
      const unl = (t.unlocks || []).map(b => BUILDINGS[b].name).join(', ');
      h += `<div class="tnode ${cls}" data-tech="${t.id}" style="left:${t.col * cw + rem}px;top:${t.row * rh + rem}px" tabindex="0" role="button" data-tip="${esc(unl ? 'Unlocks: ' + unl : t.desc)}">` +

    const svg = tree.querySelector('svg'); let paths = '';
    for (const t of TECH_DEFS) for (const r of t.req) {
      const a = TECH[r];
      const x1 = a.col * cw + rem + nw, y1 = a.row * rh + rem + 2.2 * rem, x2 = t.col * cw + rem, y2 = t.row * rh + rem + 2.2 * rem;
      const done = Research.has(r);
      paths += `<path d="M${x1} ${y1} C${x1 + 40} ${y1} ${x2 - 40} ${y2} ${x2} ${y2}" stroke="${done ? '#f0a53a' : '#3a4757'}" stroke-width="2" fill="none" ${done ? '' : 'stroke-dasharray="5 4"'}/>`;

  },
  graph(cv, series, colors, fills, labelFn) {
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth || 300, H = cv.clientHeight || 100;
    if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
    let max = 1e-9; series.forEach(s => { for (const v of s) if (v > max) max = v; });

    c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 1;
    for (let k = 1; k < 4; k++) { c.beginPath(); c.moveTo(0, H * k / 4); c.lineTo(W, H * k / 4); c.stroke(); }
    series.forEach((s, j) => {

  drawPowerGraph() {

    let mx = 1; for (let k = 0; k < n; k++) { const j = ((Power.hhead - n + k + 120) % 120) * 3; mx = Math.max(mx, Power.hist[j], Power.hist[j + 1]); }
    const line = (off, col, fill) => {
      c.beginPath();
      for (let k = 0; k < n; k++) { const j = ((Power.hhead - n + k + 120) % 120) * 3; const v = off === 2 ? Power.hist[j + 2] * mx : Power.hist[j + off]; const x = k / (n - 1) * W, y = H - 2 - v / mx * (H - 5); k ? c.lineTo(x, y) : c.moveTo(x, y); }

/* ---------- Tutorial ---------- */

  },
  render() {

  },
  update() {

  },

    const t = this.target(); if (!t) { arrow.classList.add('hidden'); return; }
    let x, y, up = false, el = null;
    if (t.startsWith('build:')) {
      const type = t.slice(6);
      el = $('bi-' + type);
      if (!el && !UI.search && this.catStep !== this.step) { this.catStep = this.step; UI.setCat(BUILDINGS[type].cat); el = $('bi-' + type); }
    } else if (t.startsWith('dom:')) el = document.querySelector(t.slice(4));
    if (el) {
      if (this.glowEl !== el) { this.unglow(); el.classList.add('tut-glow'); this.glowEl = el; }
      const r = el.getBoundingClientRect();
      if (r.top < UI.H() / 2) { x = r.left + r.width / 2; y = r.bottom + 22; up = true; } else { x = r.left + r.width / 2; y = r.top - 22; }
    } else {
      this.unglow();

      if (t === 'world:sell') { const s = Sim.lists.sell && Sim.lists.sell[0]; if (!s) { arrow.classList.add('hidden'); return; } wx = (s.x + 1.5) * TILE; wy = (s.y + 0.2) * TILE; }
      else {
        const r = RES.findIndex(q => q && 'world:' + q.id === t);
        const p = this._patch && this._patch.r === r && World.res[this._patch.y * MAP_W + this._patch.x] === r ? this._patch : (this._patch = World.nearestPatch(r, World.cx, World.cy));
        if (!p) { arrow.classList.add('hidden'); return; }
        wx = (p.x + 0.5) * TILE; wy = (p.y + 0.5) * TILE;
      }
      x = Cam.sx(wx); y = Cam.sy(wy) - 26;
    }
    const m = 30, cx = clamp(x, m, UI.W() - m), cy = clamp(y, m + 50, UI.H() - m);
    let rot = up ? 180 : 0;
    if (cx !== x || cy !== y) rot = Math.atan2(y - cy, x - cx) * 180 / Math.PI - 90;
    arrow.classList.remove('hidden');

      case 'achieve': [523, 659, 784].forEach(f => this.tone(f, 0, 'triangle', 0.7, 0.08, 0, 0, 0.02)); [1046, 1318, 1568].forEach((f, i) => this.tone(f, 0, 'sine', 0.25, 0.06, 0.12 + i * 0.06)); break;

const Music = {
  next: 0, step: 0, bar: 0, timer: null,
  chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], // Am F C G
  start() { if (this.timer) return; this.next = Sfx.ctx.currentTime + 0.3; this.timer = setInterval(() => this.schedule(), 120); },
  schedule() {
    const c = Sfx.ctx; if (!c) return;

    const sd = 60 / 80 / 2;
    while (this.next < c.currentTime + 0.5) { this.play(this.next, sd); this.next += sd; }
  },
  voice(f, t, dur, vol, type, cutoff, attack) {

  },
  play(t, sd) {
    const s = this.step % 8, ch = this.chords[this.bar % 4];
    if (s === 0) {

      this.voice(mtof(ch[0] - 24), t, sd * 3, 0.12, 'sine', 400, 0.02);

/* =====================================================================
   9. SAVE / LOAD — versioned JSON, run-length encoded belts, migrations,
   offline progress, 3 slots, export/import text.
   ===================================================================== */
const MIGRATIONS = {
  1: o => { o.kit = o.kit || {}; o.v = 2; return o; },
  2: o => { o.rebirth = o.rebirth || { tokens: 0, runs: 0 }; o.v = 3; return o; },
};
const Save = {
  lastAt: 0,
  serialize() {
    const ents = [], belts = [], bitems = [];
    const bl = [];
    for (const e of Sim.ents.values()) {
      if (e.def.kind === 'belt') { bl.push(e); if (e.n) { const a = [e.x, e.y]; for (let i = 0; i < e.n; i++) a.push(e.ty[i], +e.p[i].toFixed(3)); bitems.push(a); } }
      else ents.push(snapEnt(e));
    }
    // RLE: consecutive belts of the same tier & direction along their travel axis
    const horiz = r => r === 0 || r === 2;
    bl.sort((a, b) => a.def.idx - b.def.idx || a.rot - b.rot || (horiz(a.rot) ? a.y - b.y || a.x - b.x : a.x - b.x || a.y - b.y));
    for (let i = 0; i < bl.length;) {
      const a = bl[i]; let n = 1;
      while (i + n < bl.length) {
        const b = bl[i + n];
        if (b.type !== a.type || b.rot !== a.rot) break;
        if (horiz(a.rot) ? (b.y !== a.y || b.x !== a.x + n) : (b.x !== a.x || b.y !== a.y + n)) break;
        n++;
      }
      belts.push([a.def.idx, a.rot, a.x, a.y, n]); i += n;
    }
    const sp = arr => sparse(Array.from(arr, v => Math.round(v * 1000) / 1000));
    return {
      v: SAVE_VERSION, at: Date.now(), seed: World.seed, time: +Sim.time.toFixed(2),
      cash: Econ.cash, lifetime: Econ.lifetime, runEarned: Econ.runEarned, incomeEma: Econ.incomeEma,
      factor: Array.from(Econ.factor, f => Math.round(f * 1000) / 1000), sold: sp(Econ.soldItem), soldTotal: Econ.soldTotal,
      produced: sp(Stats.producedLife), consumed: sp(Stats.consumedLife), playTime: Stats.playTime,
      kit: Build.kit, research: Research.levels, sci: Array.from(Research.sci), goals: Goals.done,
      tut: { step: Tut.step, done: Tut.done }, rebirth: { tokens: Rebirth.tokens, runs: Rebirth.runs },
      events: { next: Math.round(Events.next), vein: Upg.veinT, boom: Econ.boomItem, boomT: Econ.boomT },
      cam: { x: Math.round(Cam.x), y: Math.round(Cam.y), z: +Cam.tz.toFixed(3) },

    };
  },
  write(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); return true; }
    catch (e) { UI.toast('Could not save — browser storage is full or blocked. Use Export instead.', 'bad'); return false; }
  },
  autosave() { if (!Game.ready) return; if (this.write(SAVE_KEY, this.serialize())) this.lastAt = Date.now(); },
  saveSlot(n) { if (this.write(SLOT_KEY + n, this.serialize())) { UI.toast(`Saved to slot ${n + 1}`, 'good'); Sfx.play('click'); } },
  slotMeta(n) {
    try { const s = localStorage.getItem(SLOT_KEY + n); if (!s) return null; const o = JSON.parse(s); return { cash: o.cash, at: o.at, ents: o.ents.length + o.belts.reduce((a, b) => a + b[4], 0) }; }
    catch (_) { return null; }
  },
  loadSlot(n) {
    const s = localStorage.getItem(SLOT_KEY + n); if (!s) return;
    this.autosave();
    try { Game.load(this.migrate(JSON.parse(s)), false); UI.toast(`Loaded slot ${n + 1}`, 'good'); }
    catch (e) { UI.toast('That slot could not be loaded: ' + esc(e.message), 'bad'); }
  },
  b64enc(str) { const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); },
  b64dec(b64) { const s = atob(b64), b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return new TextDecoder().decode(b); },

  importText(s) {
    try {

  },

    location.reload();
  },
};

/* =====================================================================
   10. BOOT — game lifecycle, main loop, error overlay
   ===================================================================== */
const Game = {

  newGame(seed, announce) {

    Research.refresh(); Sim.relink();
    Cam.jump(World.cx * TILE, World.cy * TILE); Cam.zoom = Cam.tz = 1.1;
    if (Settings.tutorial) Tut.start(); else Tut.finish();

  },
  load(o, offline) {

    Econ.cash = +o.cash || 0; Econ.lifetime = +o.lifetime || 0; Econ.runEarned = +o.runEarned || 0; Econ.incomeEma = +o.incomeEma || 0;
    if (Array.isArray(o.factor)) o.factor.forEach((f, i) => { if (i < NI) Econ.factor[i] = clamp(+f || 1, BALANCE.priceFloor, 1); });
    Econ.hist.fill(1); for (let i = 0; i < NI; i++) for (let k = 0; k < 60; k++) Econ.hist[i * 60 + k] = Econ.factor[i];
    unsparse(Econ.soldItem, o.sold); Econ.soldTotal = +o.soldTotal || 0;
    unsparse(Stats.producedLife, o.produced); unsparse(Stats.consumedLife, o.consumed); Stats.playTime = +o.playTime || 0;
    Build.kit = Object.assign({}, o.kit || {});
    Research.levels = Object.assign({}, o.research || {}); if (Array.isArray(o.sci)) for (let j = 0; j < 3; j++) Research.sci[j] = +o.sci[j] || 0;

    for (const [ti, rot, x, y, n] of o.belts || []) {
      const type = BTYPES[ti]; if (!type || BUILDINGS[type].kind !== 'belt') { bad++; continue; }
      for (let k = 0; k < n; k++) {
        const bx = x + (rot === 0 || rot === 2 ? k : 0), by = y + (rot === 1 || rot === 3 ? k : 0);
        if (!this.fits(BUILDINGS[type], bx, by)) { bad++; continue; }

    if (earned < 1) return;
    Econ.earn(earned);
    UI.welcome(`<p>You were away for <b>${fmtTime(away)}</b>${away > cap ? ` (capped at ${BALANCE.offlineCapHours} h)` : ''}.</p>` +
      `<p>Your factory kept humming at ${Math.round(BALANCE.offlineEff * 100)}% efficiency, based on your recent income of <b>${fmtMoney(ratePerMin)}/min</b>.</p>` +
      `<p style="font-size:1.3rem">Earned <b style="color:var(--money)">+${fmtMoney(earned)}</b></p><div class="row" style="justify-content:flex-end"><button class="btn primary" data-close>Collect</button></div>`);
    $('welcome-body').querySelector('[data-close]').onclick = () => { UI.closeModal(); Sfx.play('sell'); };
  },
  rebirth() {
    const pend = Rebirth.pending(); if (!pend) return;
    Rebirth.tokens += pend; Rebirth.runs++;
    this.newGame((Math.random() * 1e9) >>> 0, false);
    Research.refresh();
    UI.toast(`🚀 Relocated! You now hold ${Rebirth.tokens} Relocation Tokens (×${Upg.sell.toFixed(2)} prices, ×${Upg.speed.toFixed(2)} speed).`, 'good', 6000);
    Render.celebrate(UI.W() / 2, UI.H() / 2); Sfx.play('achieve');
    Save.autosave();
  },
};

let lastT = 0, acc = 0, crashed = false, autoT = 0;
function loop(now) {
  if (crashed) return;
  try {
    let dt = lastT ? (now - lastT) / 1000 : 0; lastT = now;
    if (dt > 0.25) dt = 0.25; if (dt < 0) dt = 0;
    acc += dt;
    let steps = 0;
    while (acc >= DT && steps < 8) { Sim.step(); acc -= DT; steps++; }
    if (steps >= 8) acc = 0;
    Cam.update(dt);
    if (Input.over) Input.updateHover();
    if (Input.g && Input.g.mode === 'tool') Tools.move();
    Render.frame(Math.min(1, acc / DT), dt);
    UI.frame(dt);
    Sfx.frame();
    autoT += dt; if (autoT >= Settings.autosave) { autoT = 0; Save.autosave(); }
  } catch (e) { crashed = true; showError(e); return; }
  requestAnimationFrame(loop);
}
function showError(e) {
  try { console.error(e); } catch (_) { /* ignore */ }
  $('error-text').textContent = (e && (e.stack || e.message)) || String(e);
  $('error-overlay').classList.add('open');
}
function boot() {
  $('err-continue').onclick = () => { $('error-overlay').classList.remove('open'); if (crashed) { crashed = false; lastT = 0; requestAnimationFrame(loop); } };
  $('err-reload').onclick = () => location.reload();
  $('err-reset').onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (_) { /* ignore */ } location.reload(); };
  window.addEventListener('error', ev => { if (Game.ready && ev.error) { crashed = true; showError(ev.error); } });
  Settings.load();
  Sprites.build();
  Render.init();
  UI.init();
  Input.init(Render.cv);
  Research.refresh();
  let loaded = false;
  let raw = null; try { raw = localStorage.getItem(SAVE_KEY); } catch (_) { /* storage blocked */ }
  if (raw) {
    try { Game.load(Save.migrate(JSON.parse(raw)), true); loaded = true; }
    catch (e) {
      console.warn('Save failed to load', e);
      try { localStorage.setItem('forgeline.corrupt', raw); } catch (_) { /* ignore */ }
      UI.toast('Your save couldn’t be loaded, so a new world was started. (A backup was kept.)', 'bad', 6000);
    }
  }
  if (!loaded) Game.newGame((Math.random() * 1e9) >>> 0, false);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Save.autosave(); Game.hiddenAt = Date.now(); }
    else if (Game.hiddenAt) { const away = (Date.now() - Game.hiddenAt) / 1000; Game.hiddenAt = 0; lastT = 0; Game.offline(away, Econ.incomeEma); }
  });
  window.addEventListener('pagehide', () => Save.autosave());
  window.addEventListener('beforeunload', () => Save.autosave());
  requestAnimationFrame(loop);
}
try { boot(); } catch (e) { crashed = true; showError(e); }
</script>
</body>
</html>
