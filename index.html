/* =====================================================================
   3. WORLD — terrain generation, resources, tile/occupancy storage
   ===================================================================== */
const T_GRASS = 0, T_SAND = 1, T_ROCK = 2, T_WATER = 3;
const World = {
  seed: 1,
  terr: new Uint8Array(MAP_W * MAP_H),
  res: new Uint8Array(MAP_W * MAP_H),
  elev: new Uint8Array(MAP_W * MAP_H),
  det: new Uint8Array(MAP_W * MAP_H),   // smooth detail noise for ground colour variation
  occ: new Int32Array(MAP_W * MAP_H), // entity id (0 = empty)
  cx: MAP_W >> 1, cy: MAP_H >> 1,
  patches: [],                        // {r, x, y} centers for tutorial arrows
  version: 0,                         // bumps when terrain regenerates (render caches)

  inb(x, y) { return x >= 0 && y >= 0 && x < MAP_W && y < MAP_H; },
  entAt(x, y) {
    if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return null;
    const id = this.occ[y * MAP_W + x];
    return id ? Sim.ents.get(id) || null : null;
  },

  generate(seed) {
    this.seed = seed >>> 0;
    const rng = mulberry32(this.seed ^ 0xA5A5);
    const nE = new ValueNoise(this.seed ^ 0x9E37), nM = new ValueNoise(this.seed ^ 0x51AB), nR = new ValueNoise(this.seed ^ 0x1234), nD = new ValueNoise(this.seed ^ 0x3C3C);
    const cx = this.cx, cy = this.cy;
    this.res.fill(0); this.occ.fill(0); this.patches = [];
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
      const i = y * MAP_W + x;
      let e = nE.fbm(x / 60, y / 60, 5);
      e = (e - 0.5) * 1.9 + 0.5;
      const d = Math.hypot(x - cx, y - cy);
      e += 0.32 * Math.max(0, 1 - d / 34);
      const edge = Math.min(x, y, MAP_W - 1 - x, MAP_H - 1 - y);
      if (edge < 14) e -= (14 - edge) / 14 * 0.45;
      const m = nM.fbm(x / 45, y / 45, 3);
      let t;
      if (e < 0.33) t = T_WATER;
      else if (e < 0.37) t = T_SAND;
      else if (m < 0.36 && e < 0.62) t = T_SAND;
      else if (nR.fbm(x / 20, y / 20, 3) > 0.685 && e > 0.52) t = T_ROCK;
      else t = T_GRASS;
      if (d < 22 && t === T_WATER) t = T_GRASS;
      this.terr[i] = t;
      this.elev[i] = clamp(Math.round(e * 200), 0, 255);
      this.det[i] = clamp(Math.round(nD.fbm(x / 6, y / 6, 3) * 255), 0, 255);
    }
    const nP = new ValueNoise(this.seed ^ 0x7777);
    const patch = (r, px, py, rad) => {
      const R = Math.ceil(rad * 1.5);
      this.patches.push({ r, x: px, y: py });
      for (let y = py - R; y <= py + R; y++) for (let x = px - R; x <= px + R; x++) {
        if (!this.inb(x, y)) continue;
        const i = y * MAP_W + x;
        if (this.terr[i] === T_WATER) continue;
        const k = r === RES_OIL ? 1.3 : 0.75;
        const dd = Math.hypot(x - px, y - py) / rad + (nP.n(x * 0.33 + r * 17, y * 0.33) - 0.5) * k;
        if (dd < 1 && (r !== RES_OIL || nP.n(x * 0.9, y * 0.9 + 50) > 0.35)) this.res[i] = r;
      }
    };
    // guaranteed starter patches around spawn
    const a0 = rng() * Math.PI * 2;
    const starter = [[1, 9, 3.6], [3, 10, 3.2], [2, 12, 3.4], [4, 13, 3.0], [5, 15, 3.0]];
    starter.forEach(([r, dist, rad], k) => {
      const a = a0 + k * Math.PI * 2 / starter.length;
      patch(r, Math.round(cx + Math.cos(a) * dist), Math.round(cy + Math.sin(a) * dist), rad);
    });
    // scattered patches
    const counts = [0, 26, 22, 20, 18, 16, 12, 11];
    for (let r = 1; r <= 7; r++) {
      let placed = 0, tries = 0;
      const minD = r >= 6 ? 40 : 24;
      while (placed < counts[r] && tries++ < 3000) {
        const x = 8 + Math.floor(rng() * (MAP_W - 16)), y = 8 + Math.floor(rng() * (MAP_H - 16));
        const d = Math.hypot(x - cx, y - cy);
        if (d < minD) continue;
        const t = this.terr[y * MAP_W + x];
        if (t === T_WATER) continue;
        if (r === 5 && t !== T_SAND && rng() < 0.7) continue; // sand likes beaches & deserts
        patch(r, x, y, 2.6 + rng() * 3 + d / 70);
        placed++;
      }
    }
    // keep the market plaza clear
    for (let y = cy - 3; y <= cy + 3; y++) for (let x = cx - 3; x <= cx + 3; x++) {
      const i = y * MAP_W + x; this.res[i] = 0; if (this.terr[i] === T_WATER || this.terr[i] === T_ROCK) this.terr[i] = T_GRASS;
    }
    this.version++;
  },

  nearestPatch(r, fx, fy) {
    let best = null, bd = 1e9;
    for (const p of this.patches) {
      if (p.r !== r) continue;
      const d = Math.hypot(p.x - fx, p.y - fy);
      if (d < bd && this.res[p.y * MAP_W + p.x] === r) { bd = d; best = p; }
    }
    return best;
  },
};

/* =====================================================================
   4. SIMULATION — pure logic: entities, belts, machines, power, economy.
   No drawing here. Runs at a fixed TPS from the main loop.
   ===================================================================== */
const ST = { WORK: 0, STARVED: 1, BLOCKED: 2, NOPOWER: 3, OFF: 4, NORECIPE: 5, NOFUEL: 6, IDLE: 7 };
const ST_INFO = [
  { name: 'Working', color: '#57cf79', cb: '#4fa3ff' },
  { name: 'Waiting for input', color: '#f1c84b', cb: '#f1c84b' },
  { name: 'Output blocked', color: '#f08a3a', cb: '#ff7ad9' },
  { name: 'No power', color: '#ee5d5d', cb: '#ff9f1c' },
  { name: 'Disabled', color: '#7d8794', cb: '#7d8794' },
  { name: 'No recipe selected', color: '#4fb0d8', cb: '#ffffff' },
  { name: 'Out of fuel — needs coal', color: '#ee5d5d', cb: '#ff9f1c' },
  { name: 'Idle', color: '#7d8794', cb: '#7d8794' },
];
const SP = BALANCE.beltSpacing;
const SPLIT_DIRS = [0, 1, 2, 3].map(r => [r, (r + 3) & 3, (r + 1) & 3]);

/* ---------- Upgrades & multipliers ---------- */
const Upg = {
  mining: 1, speed: 1, storage: 1, sell: 1, veinT: 0,
  recalc() {
    const lv = id => Research.level(id);
    const tok = Rebirth.tokens;
    this.mining = (1 + 0.2 * lv('mining')) * (1 + BALANCE.rebirthSpeedBonus * tok) * (this.veinT > 0 ? 1.5 : 1);
    this.speed = (1 + 0.15 * lv('speed')) * (1 + BALANCE.rebirthSpeedBonus * tok);
    this.storage = 1 + 0.5 * lv('storagecap');
    this.sell = (1 + 0.1 * lv('market')) * (1 + BALANCE.rebirthSellBonus * tok);
  },
};

/* ---------- Statistics (per-item production/consumption, 5 min history) ---------- */
const HIST = 300;
const Stats = {
  prodSec: new Float64Array(NI), consSec: new Float64Array(NI),
  prodHist: new Float32Array(NI * HIST), consHist: new Float32Array(NI * HIST), head: 0,
  producedLife: new Float64Array(NI), consumedLife: new Float64Array(NI),
  playTime: 0,
  prod(i, n) { this.prodSec[i] += n; this.producedLife[i] += n; },
  cons(i, n) { this.consSec[i] += n; this.consumedLife[i] += n; },
  second() {
    const h = this.head;
    for (let i = 0; i < NI; i++) {
      this.prodHist[i * HIST + h] = this.prodSec[i]; this.consHist[i * HIST + h] = this.consSec[i];
      this.prodSec[i] = 0; this.consSec[i] = 0;
    }
    this.head = (h + 1) % HIST;
  },
  rate(arr, i, secs) { // items per minute averaged over the last `secs` seconds
    let s = 0;
    for (let k = 1; k <= secs; k++) s += arr[i * HIST + ((this.head - k + HIST) % HIST)];
    return s / secs * 60;
  },
  reset() {
    this.prodSec.fill(0); this.consSec.fill(0); this.prodHist.fill(0); this.consHist.fill(0);
    this.producedLife.fill(0); this.consumedLife.fill(0); this.head = 0; this.playTime = 0;
  },
};

/* ---------- Economy: dynamic prices ---------- */
const Econ = {
  cash: 0, lifetime: 0, runEarned: 0,
  factor: new Float32Array(NI).fill(1),
  hist: new Float32Array(NI * 60), hhead: 0,       // price factor samples every 5 s
  soldItem: new Float64Array(NI), soldTotal: 0,
  earnSec: 0, soldSec: 0, bins: new Float64Array(60), bhead: 0, sellBins: new Float64Array(5),
  incomeEma: 0, boomItem: -1, boomT: 0,
  price(i) { return VALUE[i] * this.factor[i] * Upg.sell * (i === this.boomItem ? 2 : 1); },
  sell(i, e) {
    const p = this.price(i);
    this.cash += p; this.lifetime += p; this.runEarned += p; this.earnSec += p; this.soldSec++;
    this.soldItem[i]++; this.soldTotal++;
    const f = this.factor[i] - BALANCE.priceDrop / VOL[i];
    this.factor[i] = f < BALANCE.priceFloor ? BALANCE.priceFloor : f;
    Stats.cons(i, 1);
    if (e) e.acc += p;
  },
  earn(v) { this.cash += v; this.lifetime += v; this.runEarned += v; this.earnSec += v; },
  tick() {
    const k = BALANCE.priceRecover * DT;
    for (let i = 0; i < NI; i++) { const f = this.factor[i]; if (f < 1) this.factor[i] = f + (1 - f) * k; }
  },
  second() {
    this.bins[this.bhead] = this.earnSec; this.bhead = (this.bhead + 1) % 60;
    this.sellBins[Sim.tick / TPS % 5 | 0] = this.soldSec;
    this.incomeEma = this.incomeEma * 0.98 + this.earnSec * 60 * 0.02;
    this.earnSec = 0; this.soldSec = 0;
    if ((Sim.tick / TPS | 0) % 5 === 0) {
      for (let i = 0; i < NI; i++) this.hist[i * 60 + this.hhead] = this.factor[i];
      this.hhead = (this.hhead + 1) % 60;
    }
    if (this.boomT > 0 && --this.boomT <= 0) { this.boomItem = -1; Bus.emit('event', 'Market boom has ended.'); }
  },
  get perMin() { let s = 0; for (let i = 0; i < 60; i++) s += this.bins[i]; return s; },
  get sellRate() { let s = 0; for (let i = 0; i < 5; i++) s += this.sellBins[i]; return s / 5; },
  trend(i) { // compare to ~30 s ago
    const now = this.factor[i], old = this.hist[i * 60 + ((this.hhead - 6 + 60) % 60)] || 1;
    return now - old > 0.015 ? 1 : now - old < -0.015 ? -1 : 0;
  },
  reset() {
    this.cash = 0; this.runEarned = 0; this.factor.fill(1); this.hist.fill(1); this.hhead = 0;
    this.soldItem.fill(0); this.soldTotal = 0; this.bins.fill(0); this.sellBins.fill(0); this.incomeEma = 0;
    this.boomItem = -1; this.boomT = 0; this.earnSec = 0; this.soldSec = 0;
  },
};

/* ---------- Research ---------- */
const Research = {
  levels: {}, sci: new Float64Array(3), count: 0,
  level(id) { return this.levels[id] | 0; },
  has(id) { return !id || (this.levels[id] | 0) > 0; },
  maxed(t) { return this.level(t.id) >= t.levels; },
  cost(t) {
    const m = Math.pow(t.mul, this.level(t.id)), c = {};
    for (const k in t.cost) c[k] = Math.ceil(t.cost[k] * m);
    return c;
  },
  prereqsMet(t) { return t.req.every(r => this.has(r)); },
  canAfford(t) {
    const c = this.cost(t);
    for (const k in c) {
      if (k === 'cash') { if (Econ.cash < c[k]) return false; }
      else if (this.sci[SCIENCE.indexOf(k)] < c[k]) return false;
    }
    return true;
  },
  buy(t) {
    if (this.maxed(t) || !this.prereqsMet(t) || !this.canAfford(t)) return false;
    const c = this.cost(t);
    for (const k in c) { if (k === 'cash') Econ.cash -= c[k]; else this.sci[SCIENCE.indexOf(k)] -= c[k]; }
    this.levels[t.id] = this.level(t.id) + 1;
    this.refresh();
    Bus.emit('research', t);
    return true;
  },
  refresh() {
    this.count = 0; for (const k in this.levels) if (this.levels[k] > 0) this.count++;
    for (const craft in CRAFT_RECIPES) {
      const a = AUTO_ACCEPT[craft] = new Uint8Array(NI);
      CRAFT_RECIPES[craft].forEach(ri => { const r = RECIPES[ri]; if (this.has(r.tech)) r.inp.forEach(([i]) => { a[i] = 1; }); });
    }
    Upg.recalc();
  },
  anyAffordable() {
    for (const t of TECH_DEFS) if (!this.maxed(t) && this.prereqsMet(t) && this.canAfford(t)) return true;
    return false;
  },
  reset() { this.levels = {}; this.sci.fill(0); this.refresh(); },
};

/* ---------- Relocation (prestige) ---------- */
const Rebirth = {
  tokens: 0, runs: 0,
  pending() { return Econ.runEarned < BALANCE.rebirthMin ? 0 : Math.floor(2 * Math.sqrt(Econ.runEarned / BALANCE.rebirthMin)); },
};

/* ---------- Random positive events ---------- */
const Events = {
  next: 200,
  second() {
    if (Upg.veinT > 0 && --Upg.veinT <= 0) { Upg.recalc(); Bus.emit('event', 'The rich ore vein has settled.'); }
    if (!Settings.events || Sim.countKind('miner') < 2) return;
    if (--this.next > 0) return;
    this.next = BALANCE.eventMinSec + Math.random() * (BALANCE.eventMaxSec - BALANCE.eventMinSec);
    const roll = Math.random();
    if (roll < 0.45) {
      const cands = []; for (let i = 0; i < NI; i++) if (Econ.soldItem[i] > 10) cands.push(i);
      if (!cands.length) return;
      Econ.boomItem = cands[(Math.random() * cands.length) | 0]; Econ.boomT = 60;
      Bus.emit('event', `📈 Market boom! ${ITEMS[Econ.boomItem].name} sells for 2× for 60 s.`, 'good');
    } else if (roll < 0.8) {
      Upg.veinT = 90; Upg.recalc();
      Bus.emit('event', '⛏ Rich vein struck! All drills +50% for 90 s.', 'good');
    } else {
      const g = Math.max(50, Econ.perMin * 0.75);
      Econ.earn(g);
      Bus.emit('event', `🏦 Investor grant: +${fmtMoney(g)}`, 'good');
    }
  },
};

/* ---------- Entities ---------- */
function makeEntity(type, x, y, rot) {
  const def = BUILDINGS[type];
  const e = {
    id: Sim.nextId++, type, def, x, y, rot: rot & 3, w: def.size, h: def.size,
    off: false, paid: 0, kit: false, born: -1e9, status: ST.IDLE, eff: 0, want: 0, net: null,
  };
  switch (def.kind) {
    case 'belt':
      e.n = 0; e.ty = new Int16Array(4); e.p = new Float32Array(4); e.pp = new Float32Array(4);
      e.l = new Float32Array(4); e.pl = new Float32Array(4); e.mt = new Int32Array(4).fill(-1);
      e.next = null; e.curve = 0; e.speed = def.speed / TPS; e._d = 0; e._w = 0; break;
    case 'tunnel':
      e.mode = 0; e.pair = null; e.cap = 24; e.qty = new Int16Array(24); e.qt = new Float32Array(24); e.qp = new Float32Array(24);
      e.qn = 0; e.speed = def.speed / TPS; e.next = null; e.len = 0.5; break;
    case 'router':
      e.bty = new Int16Array(2); e.bdir = new Int8Array(2); e.bt = new Int32Array(2); e.bn = 0; e.rr = 0; e.filter = -1; e.last = -1;
      e.nb = [null, null, null, null]; break;
    case 'junction':
      e.jty = new Int16Array(8); e.jt = new Float32Array(8); e.jn = new Uint8Array(4); e.nb = [null, null, null, null]; break;
    case 'miner': e.prog = 0; e.outN = 0; e.ore = -1; e.tiles = 0; e.outs = []; e.rr = 0; break;
    case 'machine':
      e.recipe = -1; e.inb = new Int32Array(NI); e.outb = new Int32Array(NI); e.outN = 0; e.prog = 0; e.fuel = 0;
      e.outs = []; e.rr = 0; e.crafted = 0; break;
    case 'sell': e.acc = 0; break;
    case 'lab': e.inb = new Int32Array(3); e.prog = 0; e.rr = 0; break;
    case 'storage': e.store = new Int32Array(NI); e.total = 0; e.filter = -1; break;
    case 'unloader': e.filter = -1; e.acc = 0; e.src = null; e.next = null; e.rr = 0; break;
    case 'gen': e.fuelN = 0; e.energy = 0; e.load = 0; break;
    case 'battery': e.charge = 0; break;
  }
  return e;
}

/* ---------- Item acceptance (the one entry point for moving items between buildings) ----------
   dir = direction the item is travelling; carry = how far past the edge it already moved. */
function acceptItem(e, it, dir, carry) {
  switch (e.def.kind) {
    case 'belt': {
      const r = e.rot;
      if (dir === ((r + 2) & 3)) return false;
      if (dir === r || (e.curve === 1 && dir === ((r + 1) & 3)) || (e.curve === 2 && dir === ((r + 3) & 3))) return beltBack(e, it, carry);
      return beltSide(e, it, dir === ((r + 1) & 3) ? 1 : -1);
    }
    case 'tunnel': {
      if (e.mode !== 0 || dir === ((e.rot + 2) & 3) || e.qn >= e.cap) return false;
      let pos = carry;
      if (e.qn > 0) { const lim = e.qt[e.qn - 1] - SP; if (lim < 0) return false; if (pos > lim) pos = lim; }
      e.qty[e.qn] = it; e.qt[e.qn] = pos; e.qp[e.qn] = pos - e.speed; e.qn++;
      return true;
    }
    case 'router': {
      if (e.bn >= 2 || dir === ((e.rot + 2) & 3)) return false;
      if (e.def.mode === 'merge' && e.bn > 0 && dir === e.last) return false;
      e.bty[e.bn] = it; e.bdir[e.bn] = dir; e.bt[e.bn] = Sim.tick; e.bn++; e.last = dir;
      return true;
    }
    case 'junction': {
      if (e.jn[dir] >= 2) return false;
      const k = dir * 2 + e.jn[dir]; e.jty[k] = it; e.jt[k] = 0; e.jn[dir]++;
      return true;
    }
    case 'machine': return machineIn(e, it);
    case 'sell': Econ.sell(it, e); return true;
    case 'lab': {
      const s = SCI_IDX[it]; if (s < 0 || e.inb[s] >= 20) return false;
      e.inb[s]++; return true;
    }
    case 'storage': {
      if (e.total >= e.def.cap * Upg.storage || (e.filter >= 0 && e.filter !== it)) return false;
      e.store[it]++; e.total++; return true;
    }
    case 'gen': if (it !== COAL || e.fuelN >= 10) return false; e.fuelN++; return true;
  }
  return false;
}

/* ---------- Belts ----------
   Each belt tile holds ≤4 items sorted by position p∈[0,1] (0 = back edge, 1 = front edge).
   Items keep ≥SP spacing, the front item waits at 1.0 if the next tile refuses (back-pressure).
   `l` is a lateral offset used to slide side-loaded items smoothly onto the lane. */
function beltShiftUp(e, from) {
  for (let i = e.n; i > from; i--) {
    e.ty[i] = e.ty[i - 1]; e.p[i] = e.p[i - 1]; e.pp[i] = e.pp[i - 1];
    e.l[i] = e.l[i - 1]; e.pl[i] = e.pl[i - 1]; e.mt[i] = e.mt[i - 1];
  }
}
function beltBack(e, it, carry) {
  const n = e.n; if (n >= 4) return false;
  let pos = carry;
  if (n > 0) { const lim = e.p[0] - SP; if (lim < 0) return false; if (pos > lim) pos = lim; }
  beltShiftUp(e, 0);
  e.ty[0] = it; e.p[0] = pos; e.pp[0] = pos - e.speed; e.l[0] = 0; e.pl[0] = 0; e.mt[0] = Sim.tick; e.n = n + 1;
  return true;
}
function beltSide(e, it, side) {
  const n = e.n; if (n >= 4) return false;
  let i = 0; while (i < n && e.p[i] <= 0.5) i++;
  if (i < n && e.p[i] < 0.5 + SP) return false;
  if (i > 0 && e.p[i - 1] > 0.5 - SP) return false;
  beltShiftUp(e, i);
  e.ty[i] = it; e.p[i] = 0.5; e.pp[i] = 0.5; e.l[i] = side * 0.5; e.pl[i] = side * 0.55; e.mt[i] = Sim.tick; e.n = n + 1;
  return true;
}
function tickBelt(e) {
  let n = e.n; if (n === 0) return;
  const sp = e.speed, t = Sim.tick;
  let i = n - 1;
  if (e.mt[i] !== t) { // front item
    const np = e.p[i] + sp;
    if (np >= 1 && e.next !== null && acceptItem(e.next, e.ty[i], e.rot, np - 1)) { e.n = --n; i--; }
    else {
      e.pp[i] = e.p[i]; e.pl[i] = e.l[i]; e.p[i] = np > 1 ? 1 : np;
      const l = e.l[i]; if (l !== 0) e.l[i] = l > 0 ? Math.max(0, l - sp) : Math.min(0, l + sp);
      e.mt[i] = t; i--;
    }
  } else i--;
  for (; i >= 0; i--) {
    if (e.mt[i] === t) continue;
    e.pp[i] = e.p[i]; e.pl[i] = e.l[i];
    let np = e.p[i] + sp; const lim = i + 1 < n ? e.p[i + 1] - SP : 1;
    if (np > lim) np = lim;
    if (np > e.p[i]) e.p[i] = np;
    const l = e.l[i]; if (l !== 0) e.l[i] = l > 0 ? Math.max(0, l - sp) : Math.min(0, l + sp);
    e.mt[i] = t;
  }
}

/* ---------- Underground belts ---------- */
function tickTunnel(e) {
  if (e.mode !== 0 || e.qn === 0) return;
  const sp = e.speed, L = e.len;
  for (let i = 0; i < e.qn; i++) {
    e.qp[i] = e.qt[i];
    const lim = i === 0 ? L : e.qt[i - 1] - SP;
    let v = e.qt[i] + sp; if (v > lim) v = lim; if (v > e.qt[i]) e.qt[i] = v;
  }
  if (e.pair && e.qt[0] >= L && e.pair.next && acceptItem(e.pair.next, e.qty[0], e.rot, 0)) {
    for (let i = 1; i < e.qn; i++) { e.qty[i - 1] = e.qty[i]; e.qt[i - 1] = e.qt[i]; e.qp[i - 1] = e.qp[i]; }
    e.qn--;
  }
}

/* ---------- Splitter / merger / sorter / overflow ---------- */
function routerTry(e, d) {
  const tg = e.nb[d];
  if (tg === null || d === ((e.bdir[0] + 2) & 3)) return false;
  if (!acceptItem(tg, e.bty[0], d, 0)) return false;
  e.bty[0] = e.bty[1]; e.bdir[0] = e.bdir[1]; e.bt[0] = e.bt[1]; e.bn--;
  return true;
}
function tickRouter(e) {
  for (let pass = 0; pass < 2 && e.bn > 0; pass++) {
    if (e.bt[0] === Sim.tick) return;           // arrived this tick — leave next tick
    const mode = e.def.mode, r = e.rot, it = e.bty[0];
    let ok = false;
    if (mode === 'merge') ok = routerTry(e, r);
    else if (mode === 'split') {
      const ds = SPLIT_DIRS[r];
      for (let k = 0; k < 3 && !ok; k++) { const j = (e.rr + k) % 3; if (routerTry(e, ds[j])) { ok = true; e.rr = (j + 1) % 3; } }
    } else {
      if (mode === 'overflow' || (mode === 'sort' && it === e.filter)) ok = routerTry(e, r);
      if (!ok && !(mode === 'sort' && it === e.filter)) {
        const ds = SPLIT_DIRS[r];
        for (let k = 0; k < 2 && !ok; k++) { const j = 1 + ((e.rr + k) & 1); if (routerTry(e, ds[j])) { ok = true; e.rr = j & 1; } }
      }
    }
    if (!ok) return;
  }
}
function tickJunction(e) {
  for (let d = 0; d < 4; d++) {
    const n = e.jn[d]; if (!n) continue;
    const k = d * 2;
    e.jt[k] = Math.min(1, e.jt[k] + 0.5); if (n > 1) e.jt[k + 1] = Math.min(0.5, e.jt[k + 1] + 0.5);
    if (e.jt[k] >= 1) {
      const tg = e.nb[d];
      if (tg !== null && acceptItem(tg, e.jty[k], d, 0)) {
        e.jty[k] = e.jty[k + 1]; e.jt[k] = e.jt[k + 1]; e.jn[d]--;
      }
    }
  }
}

/* ---------- Output helper (miners, machines, unloaders) ---------- */
function pushOut(e, it) {
  const outs = e.outs, n = outs.length;
  for (let k = 0; k < n; k++) {
    const i = (e.rr + k) % n;
    if (acceptItem(outs[i], it, e.rot, 0)) { e.rr = (i + 1) % n; return true; }
  }
  return false;
}

/* ---------- Miners ---------- */
function tickMiner(e) {
  e.want = 0;
  if (e.outN > 0 && pushOut(e, e.ore)) e.outN--;
  if (e.off) { e.status = ST.OFF; e.eff *= 0.97; return; }
  if (e.outN >= 3) { e.status = ST.BLOCKED; e.eff *= 0.97; return; }
  let s = 1;
  if (e.def.power) {
    e.want = 1; s = e.net ? e.net.sat : 0;
    if (s <= 0) { e.status = ST.NOPOWER; e.eff *= 0.97; return; }
  }
  e.prog += e.def.rate * e.tiles * Upg.mining / TPS * s;
  while (e.prog >= 1 && e.outN < 3) { e.prog -= 1; e.outN++; Stats.prod(e.ore, 1); }
  e.status = ST.WORK; e.eff += (s - e.eff) * 0.05;
}

/* ---------- Crafting machines ---------- */
function machineIn(e, it) {
  if (e.off) return false;
  const def = e.def;
  if (def.fuel && it === COAL) { if (e.inb[COAL] >= 8) return false; e.inb[COAL]++; return true; }
  if (def.auto) {
    if (!AUTO_ACCEPT[def.craft][it] || e.inb[it] >= 8) return false;
    e.inb[it]++; return true;
  }
  if (e.recipe < 0) return false;
  const need = RECIPE_NEED[e.recipe][it];
  if (!need || e.inb[it] >= need * 2 + 2) return false;
  e.inb[it]++; return true;
}
function hasInputs(e, r) {
  const inp = RECIPES[r].inp;
  for (let k = 0; k < inp.length; k++) if (e.inb[inp[k][0]] < inp[k][1]) return false;
  return true;
}
function outRoom(e, R) {
  const out = R.out;
  for (let k = 0; k < out.length; k++) if (e.outb[out[k][0]] + out[k][1] > Math.max(6, out[k][1] * 3)) return false;
  return true;
}
function flushMachine(e) {
  let pushes = 0;
  for (let i = 0; i < NI && pushes < 2; i++) {
    if (e.outb[i] > 0 && pushOut(e, i)) { e.outb[i]--; e.outN--; pushes++; i--; }
  }
}
function tickMachine(e) {
  const def = e.def;
  e.want = 0;
  if (e.outN > 0) flushMachine(e);
  if (e.off) { e.status = ST.OFF; e.eff *= 0.97; return; }
  let r = e.recipe;
  if (def.auto && e.prog <= 0 && (r < 0 || !hasInputs(e, r))) {
    const list = CRAFT_RECIPES[def.craft];
    for (let k = 0; k < list.length; k++) {
      const ri = list[k];
      if (Research.has(RECIPES[ri].tech) && hasInputs(e, ri)) { r = e.recipe = ri; break; }
    }
  }
  if (r < 0) { e.status = def.auto ? ST.STARVED : ST.NORECIPE; e.eff *= 0.97; return; }
  const R = RECIPES[r];
  if (e.prog <= 0) {
    if (!hasInputs(e, r)) { e.status = ST.STARVED; e.eff *= 0.97; return; }
    if (!outRoom(e, R)) { e.status = ST.BLOCKED; e.eff *= 0.97; return; }
    if (def.fuel) {
      if (e.fuel <= 0) {
        if (e.inb[COAL] > 0) { e.inb[COAL]--; e.fuel += BALANCE.coalFuelCrafts; Stats.cons(COAL, 1); }
        else { e.status = ST.NOFUEL; e.eff *= 0.97; return; }
      }
      e.fuel--;
    }
    const inp = R.inp;
    for (let k = 0; k < inp.length; k++) { e.inb[inp[k][0]] -= inp[k][1]; Stats.cons(inp[k][0], inp[k][1]); }
    e.prog = 1e-6;
  }
  let s = 1;
  if (def.power) {
    e.want = 1; s = e.net ? e.net.sat : 0;
    if (s <= 0) { e.status = ST.NOPOWER; e.eff *= 0.97; return; }
  }
  e.prog += def.speed * Upg.speed / R.time / TPS * s;
  if (e.prog >= 1) {
    if (!outRoom(e, R)) { e.prog = 1; e.want = 0; e.status = ST.BLOCKED; e.eff *= 0.97; return; }
    const out = R.out;
    for (let k = 0; k < out.length; k++) { e.outb[out[k][0]] += out[k][1]; e.outN += out[k][1]; Stats.prod(out[k][0], out[k][1]); }
    e.prog = 0; e.crafted++;
  }
  e.status = ST.WORK; e.eff += (s - e.eff) * 0.05;
}
function setRecipe(e, ri) {
  if (e.recipe === ri) return;
  e.recipe = ri; e.inb.fill(0); e.prog = 0;
}

/* ---------- Labs, unloaders ---------- */
function tickLab(e) {
  e.want = 0;
  if (e.off) { e.status = ST.OFF; e.eff *= 0.97; return; }
  if (e.inb[0] + e.inb[1] + e.inb[2] === 0) { e.status = ST.STARVED; e.eff *= 0.97; return; }
  e.want = 1; const s = e.net ? e.net.sat : 0;
  if (s <= 0) { e.status = ST.NOPOWER; e.eff *= 0.97; return; }
  e.prog += 2 / TPS * s * Upg.speed;
  while (e.prog >= 1) {
    e.prog -= 1;
    for (let k = 0; k < 3; k++) {
      const j = (e.rr + k) % 3;
      if (e.inb[j] > 0) { e.inb[j]--; Research.sci[j]++; Stats.cons(II[SCIENCE[j]], 1); e.rr = (j + 1) % 3; break; }
    }
  }
  e.status = ST.WORK; e.eff += (s - e.eff) * 0.05;
}
function tickUnloader(e) {
  if (e.off || !e.src || !e.next) { e.acc = 0; return; }
  e.acc = Math.min(2, e.acc + e.def.rate / TPS);
  while (e.acc >= 1) {
    const s = e.src; let it = -1;
    if (e.filter >= 0) { if (s.store[e.filter] > 0) it = e.filter; }
    else for (let k = 0; k < NI; k++) { const j = (e.rr + k) % NI; if (s.store[j] > 0) { it = j; e.rr = (j + 1) % NI; break; } }
    if (it < 0 || !acceptItem(e.next, it, e.rot, 0)) { e.acc = Math.min(e.acc, 1); return; }
    s.store[it]--; s.total--; e.acc--;
  }
}

/* ---------- Power networks ---------- */
const Power = {
  nets: [], links: [], prod: 0, demand: 0, cap: 0, stored: 0, storeCap: 0,
  hist: new Float32Array(120 * 3), hhead: 0, secProd: 0, secDemand: 0, secN: 0,
  build() {
    const nodes = []; for (const e of Sim.ents.values()) { e.net = null; if (isPowerNode(e.def)) { e._pi = nodes.length; nodes.push(e); } }
    const links = this.links = [];
    const par = new Int32Array(nodes.length); for (let i = 0; i < par.length; i++) par[i] = i;
    const find = i => { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
    const uni = (a, b) => { a = find(a); b = find(b); if (a !== b) par[a] = b; };
    const scan = (x0, y0, x1, y1, fn) => {
      for (let y = Math.max(0, y0); y <= Math.min(MAP_H - 1, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(MAP_W - 1, x1); x++) {
        const id = World.occ[y * MAP_W + x]; if (id) { const o = Sim.ents.get(id); if (o) fn(o); }
      }
    };
    for (const e of nodes) {
      if (e.def.kind === 'pole') {
        const R = e.def.range, c = e.def.cover;
        scan(e.x - R, e.y - R, e.x + R, e.y + R, o => {
          if (o === e || !isPowerNode(o.def)) return;
          if (o.def.kind === 'pole') { if (Math.hypot(o.x - e.x, o.y - e.y) <= R) { uni(e._pi, o._pi); if (o.id > e.id) links.push(e.x, e.y, o.x, o.y); } }
          else if (o.x <= e.x + c && o.x + o.w - 1 >= e.x - c && o.y <= e.y + c && o.y + o.h - 1 >= e.y - c) uni(e._pi, o._pi);
        });
      } else scan(e.x - 1, e.y - 1, e.x + e.w, e.y + e.h, o => { if (o !== e && isPowerNode(o.def) && o.def.kind !== 'pole') uni(e._pi, o._pi); });
    }
    const map = new Map(); this.nets = [];
    for (const e of nodes) {
      const root = find(e._pi); let net = map.get(root);
      if (!net) { net = { id: this.nets.length, cons: [], gens: [], solars: [], bats: [], poles: [], sat: 0, demand: 0, prod: 0 }; map.set(root, net); this.nets.push(net); }
      e.net = net;
      const k = e.def.kind; (k === 'gen' ? net.gens : k === 'solar' ? net.solars : k === 'battery' ? net.bats : net.poles).push(e);
    }
    for (const e of nodes) {
      const c = e.def.kind === 'pole' ? e.def.cover : 0;
      const x0 = e.def.kind === 'pole' ? e.x - c : e.x - 1, y0 = e.def.kind === 'pole' ? e.y - c : e.y - 1;
      const x1 = e.def.kind === 'pole' ? e.x + c : e.x + e.w, y1 = e.def.kind === 'pole' ? e.y + c : e.y + e.h;
      scan(x0, y0, x1, y1, o => { if (o.net === null && isConsumer(o.def)) { o.net = e.net; e.net.cons.push(o); } });
    }
  },
  solve() {
    const light = Sim.daylight;
    let P = 0, D = 0, C = 0, S = 0, SC = 0;
    for (let n = 0; n < this.nets.length; n++) {
      const net = this.nets[n];
      let demand = 0;
      for (let i = 0; i < net.cons.length; i++) { const c = net.cons[i]; if (c.want) demand += c.def.power; }
      let coalCap = 0, solarCap = 0;
      for (let i = 0; i < net.gens.length; i++) { const g = net.gens[i]; if (!g.off && (g.energy > 0 || g.fuelN > 0)) coalCap += g.def.out; }
      for (let i = 0; i < net.solars.length; i++) if (!net.solars[i].off) solarCap += net.solars[i].def.out * light;
      let stored = 0, storeCap = 0, rate = 0;
      for (let i = 0; i < net.bats.length; i++) { const b = net.bats[i]; stored += b.charge; storeCap += b.def.cap; rate += b.def.rate; }
      const gen = coalCap + solarCap;
      let used, sat;
      if (gen >= demand) {
        const surplus = gen - demand;
        const chg = Math.min(surplus, rate, (storeCap - stored) / DT);
        if (chg > 0 && storeCap > 0) for (let i = 0; i < net.bats.length; i++) { const b = net.bats[i]; b.charge = Math.min(b.def.cap, b.charge + chg * DT * b.def.cap / storeCap); }
        used = demand + Math.max(0, chg);
        sat = demand > 0 ? 1 : (gen > 0 || stored > 0 ? 1 : 0);
      } else {
        const dis = Math.min(demand - gen, rate, stored / DT);
        if (dis > 0) for (let i = 0; i < net.bats.length; i++) { const b = net.bats[i]; b.charge = Math.max(0, b.charge - dis * DT * (b.charge / stored)); }
        used = gen; sat = (gen + Math.max(0, dis)) / demand;
      }
      const coalUsed = Math.max(0, used - solarCap), load = coalCap > 0 ? Math.min(1, coalUsed / coalCap) : 0;
      for (let i = 0; i < net.gens.length; i++) {
        const g = net.gens[i];
        if (g.off || (g.energy <= 0 && g.fuelN <= 0)) { g.load = 0; g.status = g.off ? ST.OFF : ST.NOFUEL; continue; }
        g.load = load; g.status = load > 0 ? ST.WORK : ST.IDLE;
        g.energy -= load * g.def.out * DT;
        if (g.energy <= 0 && g.fuelN > 0) { g.fuelN--; g.energy += BALANCE.coalEnergy; Stats.cons(COAL, 1); }
        if (g.energy < 0) g.energy = 0;
      }
      net.sat = sat; net.demand = demand; net.prod = demand * Math.min(1, sat);
      P += net.prod; D += demand; C += gen; S += stored; SC += storeCap;
    }
    this.prod = P; this.demand = D; this.cap = C; this.stored = S; this.storeCap = SC;
    this.secProd += P; this.secDemand += D; this.secN++;
  },
  second() {
    const h = this.hhead * 3, n = Math.max(1, this.secN);
    this.hist[h] = this.secProd / n; this.hist[h + 1] = this.secDemand / n; this.hist[h + 2] = this.storeCap > 0 ? this.stored / this.storeCap : 0;
    this.hhead = (this.hhead + 1) % 120; this.secProd = this.secDemand = 0; this.secN = 0;
  },
};

/* ---------- Simulation core ---------- */
const KIND_LISTS = ['belt', 'tunnel', 'router', 'junction', 'miner', 'machine', 'sell', 'lab', 'storage', 'unloader', 'gen', 'solar', 'battery', 'pole'];
const Sim = {
  tick: 0, time: 0, ents: new Map(), nextId: 1, dirty: true, daylight: 1,
  lists: {}, typeCount: {}, kindCount: {},
  chunks: Array.from({ length: CHUNKS_X * CHUNKS_Y }, () => []),
  chunkVer: new Int32Array(CHUNKS_X * CHUNKS_Y),   // bumped when a chunk's buildings change (render caches)
  topoVersion: 0,

  clear() {
    this.ents.clear(); this.nextId = 1; this.tick = 0; this.time = 0; this.dirty = true;
    this.chunks.forEach(c => { c.length = 0; }); this.chunkVer.fill(0); this.bumpAll = (this.bumpAll | 0) + 1;
    this.typeCount = {}; this.kindCount = {};
    World.occ.fill(0);
    KIND_LISTS.forEach(k => { this.lists[k] = []; });
    Power.nets = [];
  },
  countKind(k) { return this.kindCount[k] | 0; },
  countType(t) { return this.typeCount[t] | 0; },

  add(e) {
    for (let y = e.y; y < e.y + e.h; y++) for (let x = e.x; x < e.x + e.w; x++) World.occ[y * MAP_W + x] = e.id;
    this.ents.set(e.id, e);
    this.chunks[(e.y / CHUNK | 0) * CHUNKS_X + (e.x / CHUNK | 0)].push(e);
    this.typeCount[e.type] = (this.typeCount[e.type] | 0) + 1;
    this.kindCount[e.def.kind] = (this.kindCount[e.def.kind] | 0) + 1;
    if (e.def.kind === 'miner') this.computeOre(e);
    this.touch(e);
  },
  touch(e) { // mark neighbourhood as changed (topology + render caches)
    const cx0 = Math.max(0, ((e.x - 1) / CHUNK) | 0), cy0 = Math.max(0, ((e.y - 1) / CHUNK) | 0);
    const cx1 = Math.min(CHUNKS_X - 1, ((e.x + e.w) / CHUNK) | 0), cy1 = Math.min(CHUNKS_Y - 1, ((e.y + e.h) / CHUNK) | 0);
    for (let y = cy0; y <= cy1; y++) for (let x = cx0; x <= cx1; x++) this.chunkVer[y * CHUNKS_X + x]++;
    this.dirty = true;
  },
  remove(e) {
    for (let y = e.y; y < e.y + e.h; y++) for (let x = e.x; x < e.x + e.w; x++) if (World.occ[y * MAP_W + x] === e.id) World.occ[y * MAP_W + x] = 0;
    this.ents.delete(e.id);
    const c = this.chunks[(e.y / CHUNK | 0) * CHUNKS_X + (e.x / CHUNK | 0)], i = c.indexOf(e); if (i >= 0) c.splice(i, 1);
    this.typeCount[e.type]--; this.kindCount[e.def.kind]--;
    e.dead = true;
    this.touch(e);
  },
  computeOre(e) {
    const cnt = new Int32Array(8);
    for (let y = e.y; y < e.y + e.h; y++) for (let x = e.x; x < e.x + e.w; x++) cnt[World.res[y * MAP_W + x]]++;
    let best = 0;
    for (let r = 1; r < 8; r++) { if ((r === RES_OIL) !== !!e.def.oil) continue; if (cnt[r] > cnt[best] || best === 0 && cnt[r] > 0) best = r; }
    e.ore = best ? RES_ITEM[best] : -1; e.tiles = best ? cnt[best] : 0;
  },

  feeds(src, tx, ty) {
    if (!src || src.w !== 1) return false;
    const k = src.def.kind;
    if (k !== 'belt' && k !== 'router' && k !== 'unloader' && !(k === 'tunnel' && src.mode === 1)) return false;
    return src.x + DX[src.rot] === tx && src.y + DY[src.rot] === ty;
  },
  frontTargets(e) {
    const out = [], r = e.rot, seen = new Set();
    for (let k = 0; k < e.w; k++) {
      let x, y;
      if (r === 0) { x = e.x + e.w; y = e.y + k; } else if (r === 2) { x = e.x - 1; y = e.y + k; }
      else if (r === 1) { x = e.x + k; y = e.y + e.h; } else { x = e.x + k; y = e.y - 1; }
      const t = World.entAt(x, y);
      if (t && t !== e && !seen.has(t.id)) { seen.add(t.id); out.push(t); }
    }
    return out;
  },
  relink() {
    const L = this.lists; KIND_LISTS.forEach(k => { L[k].length = 0; });
    for (const e of this.ents.values()) L[e.def.kind].push(e);
    for (const b of L.belt) {
      const r = b.rot, oc = b.curve;
      b.next = World.entAt(b.x + DX[r], b.y + DY[r]);
      if (this.feeds(World.entAt(b.x - DX[r], b.y - DY[r]), b.x, b.y)) b.curve = 0;
      else {
        const lf = this.feeds(World.entAt(b.x + DX[(r + 3) & 3], b.y + DY[(r + 3) & 3]), b.x, b.y);
        const rf = this.feeds(World.entAt(b.x + DX[(r + 1) & 3], b.y + DY[(r + 1) & 3]), b.x, b.y);
        b.curve = lf && !rf ? 1 : rf && !lf ? 2 : 0;
      }
      if (b.curve !== oc) this.chunkVer[(b.y / CHUNK | 0) * CHUNKS_X + (b.x / CHUNK | 0)]++;
    }
    for (const t of L.tunnel) {
      t.next = World.entAt(t.x + DX[t.rot], t.y + DY[t.rot]);
      t.pair = null; t.len = 0.5;
    }
    for (const t of L.tunnel) {
      if (t.mode !== 0) continue;
      for (let k = 1; k <= t.def.range + 1; k++) {
        const o = World.entAt(t.x + DX[t.rot] * k, t.y + DY[t.rot] * k);
        if (o && o.def.kind === 'tunnel' && o.rot === t.rot) { if (o.mode === 1) { t.pair = o; o.pair = t; t.len = k + 1; } break; }
      }
      for (let i = 0; i < t.qn; i++) if (t.qt[i] > t.len) t.qt[i] = t.len;
    }
    for (const e of L.router.concat(L.junction)) for (let d = 0; d < 4; d++) e.nb[d] = World.entAt(e.x + DX[d], e.y + DY[d]);
    for (const e of L.miner) e.outs = this.frontTargets(e);
    for (const e of L.machine) e.outs = this.frontTargets(e);
    for (const u of L.unloader) {
      const s = World.entAt(u.x - DX[u.rot], u.y - DY[u.rot]);
      u.src = s && s.def.kind === 'storage' ? s : null;
      u.next = World.entAt(u.x + DX[u.rot], u.y + DY[u.rot]);
    }
    // downstream-first belt order → saturated lines compress without gaps
    let stamp = 1; const path = [];
    for (const b of L.belt) { b._d = -1; b._w = 0; }
    for (const b of L.belt) {
      if (b._d >= 0) continue;
      path.length = 0; let cur = b; stamp++;
      while (cur && cur.def.kind === 'belt' && cur._d < 0 && cur._w !== stamp) { cur._w = stamp; path.push(cur); cur = cur.next; }
      const base = cur && cur.def.kind === 'belt' && cur._d >= 0 ? cur._d + 1 : 0;
      for (let i = path.length - 1; i >= 0; i--) path[i]._d = base + (path.length - 1 - i);
    }
    L.belt.sort((a, b) => a._d - b._d);
    Power.build();
    this.dirty = false; this.topoVersion++;
  },

  step() {
    if (this.dirty) this.relink();
    this.tick++; this.time += DT;
    this.daylight = Settings.daynight ? clamp(0.5 + 0.75 * Math.cos((this.time / BALANCE.dayLength) * Math.PI * 2), 0.08, 1) : 0.8;
    const L = this.lists;
    for (let i = 0; i < L.belt.length; i++) tickBelt(L.belt[i]);
    for (let i = 0; i < L.tunnel.length; i++) tickTunnel(L.tunnel[i]);
    for (let i = 0; i < L.router.length; i++) tickRouter(L.router[i]);
    for (let i = 0; i < L.junction.length; i++) tickJunction(L.junction[i]);
    for (let i = 0; i < L.unloader.length; i++) tickUnloader(L.unloader[i]);
    for (let i = 0; i < L.miner.length; i++) tickMiner(L.miner[i]);
    for (let i = 0; i < L.machine.length; i++) tickMachine(L.machine[i]);
    for (let i = 0; i < L.lab.length; i++) tickLab(L.lab[i]);
    Power.solve();
    Econ.tick();
    if (this.tick % TPS === 0) this.second();
  },
  second() {
    Stats.second(); Stats.playTime++;
    Econ.second(); Power.second(); Events.second();
    for (const s of this.lists.sell) if (s.acc > 0) { Bus.emit('sold', s, s.acc); s.acc = 0; }
    Goals.check();
  },
};

/* ---------- Goals ---------- */
const Goals = {
  done: {},
  progress(g) {
    switch (g.type) {
      case 'soldAny': return Econ.soldTotal;
      case 'sold': return Econ.soldItem[II[g.item]];
      case 'earned': return Econ.runEarned;
      case 'research': return Research.count;
      case 'built': return Sim.countKind(g.kind);
      case 'produced': return Stats.producedLife[II[g.item]];
      case 'power': return Power.prod;
      case 'rate': return Econ.perMin;
      case 'sellrate': return Econ.sellRate;
    }
    return 0;
  },
  active(n) { const a = []; for (const g of GOAL_DEFS) { if (!this.done[g.id]) { a.push(g); if (a.length >= n) break; } } return a; },
  check() {
    for (const g of this.active(3)) {
      if (this.progress(g) >= g.n) {
        this.done[g.id] = 1; Econ.earn(g.reward);
        Bus.emit('goal', g);
      }
    }
  },
};

/* ---------- Construction rules, placement, undo/redo ---------- */
const CHK = { ok: false, reason: '', replace: null, cost: 0 };
const Build = {
  kit: {},
  unlocked(type) { return Research.has(BUILDINGS[type].tech); },
  price(type) { return (this.kit[type] | 0) > 0 ? 0 : BUILDINGS[type].cost; },
  anchor(type, tx, ty) { const s = BUILDINGS[type].size; const o = (s - 1) >> 1; return [tx - o, ty - o]; },
  tunnelMode(x, y, rot) {
    for (let k = 1; k <= BUILDINGS.tunnel.range + 1; k++) {
      const o = World.entAt(x - DX[rot] * k, y - DY[rot] * k);
      if (o && o.def.kind === 'tunnel' && o.rot === rot) return o.mode === 0 ? 1 : 0;
    }
    return 0;
  },
  // check(type, x, y, rot, spent) → CHK (reused object). `spent` = cash already committed in this gesture.
  check(type, x, y, rot, spent = 0, free = false) {
    const def = BUILDINGS[type], s = def.size;
    CHK.ok = false; CHK.replace = null; CHK.cost = 0; CHK.same = false;
    if (!this.unlocked(type)) { CHK.reason = `Locked — research ${TECH[def.tech].name}`; return CHK; }
    if (x < 0 || y < 0 || x + s > MAP_W || y + s > MAP_H) { CHK.reason = 'Outside the map'; return CHK; }
    let ores = 0, oil = 0;
    for (let yy = y; yy < y + s; yy++) for (let xx = x; xx < x + s; xx++) {
      const i = yy * MAP_W + xx;
      if (World.terr[i] === T_WATER) { CHK.reason = 'Can’t build on water'; return CHK; }
      const id = World.occ[i];
      if (id) {
        const o = Sim.ents.get(id);
        if (def.kind === 'belt' && o.def.kind === 'belt' && s === 1) {
          if (o.type === type && o.rot === rot) { CHK.reason = 'Already built'; CHK.same = true; return CHK; }
          CHK.replace = o;
        } else { CHK.reason = `Blocked by ${o.def.name}`; return CHK; }
      }
      const r = World.res[i]; if (r === RES_OIL) oil++; else if (r) ores++;
    }
    if (def.kind === 'miner' && (def.oil ? oil === 0 : ores === 0)) { CHK.reason = def.oil ? 'Must be placed on an oil seep' : 'Must be placed on ore'; return CHK; }
    const cost = free ? 0 : this.price(type) - (CHK.replace ? CHK.replace.paid * BALANCE.refundRate : 0);
    if (!free && cost > 0 && Econ.cash - spent < cost - 1e-9) { CHK.reason = `Need ${fmtMoney(cost)} (have ${fmtMoney(Math.max(0, Econ.cash - spent))})`; CHK.cost = cost; return CHK; }
    CHK.ok = true; CHK.reason = ''; CHK.cost = Math.max(0, cost);
    return CHK;
  },
  // place(): assumes check() passed. Returns the new entity.
  place(type, x, y, rot, opt = {}) {
    const def = BUILDINGS[type];
    let carried = null;
    const old = World.entAt(x, y);
    if (old && def.kind === 'belt' && old.def.kind === 'belt') {
      if (old.n) carried = old;
      History.recDel(snapEnt(old));
      this.demolish(old, true);
    }
    const e = makeEntity(type, x, y, rot);
    if (def.kind === 'tunnel') e.mode = opt.mode !== undefined ? opt.mode : this.tunnelMode(x, y, rot);
    if (!opt.free) {
      if ((this.kit[type] | 0) > 0 && !opt.noKit) { this.kit[type]--; e.kit = true; e.paid = 0; }
      else { Econ.cash -= def.cost; e.paid = def.cost; }
    } else if (opt.paid !== undefined) { e.paid = opt.paid; e.kit = !!opt.kit; }
    if (carried) { // keep items when re-laying a belt
      e.n = carried.n;
      for (let i = 0; i < carried.n; i++) { e.ty[i] = carried.ty[i]; e.p[i] = carried.p[i]; e.pp[i] = carried.p[i]; }
    }
    if (!opt.quiet) e.born = Render.now;
    Sim.add(e);
    if (!opt.noHistory) History.recAdd(e);
    if (!opt.quiet) Bus.emit('placed', e);
    return e;
  },
  demolish(e, silent) {
    if (e.kit) this.kit[e.type] = (this.kit[e.type] | 0) + 1;
    else if (e.paid) Econ.cash += e.paid * BALANCE.refundRate;
    Sim.remove(e);
    if (!silent) Bus.emit('removed', e);
  },
  canDemolish(e) {
    if (e.def.kind === 'sell' && Sim.countKind('sell') <= 1) return 'Can’t remove your last Market Hub';
    return '';
  },
};

/* entity snapshot — used by undo, blueprints and saves */
function sparse(arr) { const o = []; for (let i = 0; i < arr.length; i++) if (arr[i]) o.push(i, arr[i]); return o; }
function unsparse(arr, o) { if (o) for (let i = 0; i + 1 < o.length; i += 2) if (o[i] < arr.length) arr[o[i]] = o[i + 1]; }
function snapEnt(e, withState = true) {
  const o = { t: e.type, x: e.x, y: e.y, r: e.rot };
  if (e.paid) o.p = e.paid; if (e.kit) o.k = 1; if (e.off) o.o = 1;
  switch (e.def.kind) {
    case 'machine': if (e.recipe >= 0) o.rc = RECIPES[e.recipe].id; if (withState) { o.ib = sparse(e.inb); o.ob = sparse(e.outb); o.pg = +e.prog.toFixed(3); o.f = e.fuel; } break;
    case 'storage': if (e.filter >= 0) o.fl = ITEMS[e.filter].id; if (withState) o.s = sparse(e.store); break;
    case 'router': if (e.filter >= 0) o.fl = ITEMS[e.filter].id; if (withState && e.bn) { o.b = []; for (let i = 0; i < e.bn; i++) o.b.push(e.bty[i], e.bdir[i]); } break;
    case 'unloader': if (e.filter >= 0) o.fl = ITEMS[e.filter].id; break;
    case 'tunnel': o.m = e.mode; if (withState && e.qn) { o.q = []; for (let i = 0; i < e.qn; i++) o.q.push(e.qty[i], +e.qt[i].toFixed(3)); } break;
    case 'belt': if (withState && e.n) { o.i = []; for (let i = 0; i < e.n; i++) o.i.push(e.ty[i], +e.p[i].toFixed(3)); } break;
    case 'miner': if (withState) { o.pg = +e.prog.toFixed(3); o.on = e.outN; } break;
    case 'gen': if (withState) { o.fn = e.fuelN; o.en = Math.round(e.energy); } break;
    case 'battery': if (withState) o.ch = Math.round(e.charge); break;
    case 'lab': if (withState) o.ib = Array.from(e.inb); break;
  }
  return o;
}
function applySnap(e, o) {
  if (o.o) e.off = true;
  const it = id => (id !== undefined && II[id] !== undefined ? II[id] : -1);
  switch (e.def.kind) {
    case 'machine': if (o.rc && RI[o.rc] !== undefined && RECIPES[RI[o.rc]].craft === e.def.craft) e.recipe = RI[o.rc];
      unsparse(e.inb, o.ib); unsparse(e.outb, o.ob); e.outN = 0; for (let i = 0; i < NI; i++) e.outN += e.outb[i];
      e.prog = o.pg || 0; e.fuel = o.f || 0; break;
    case 'storage': e.filter = it(o.fl); unsparse(e.store, o.s); e.total = 0; for (let i = 0; i < NI; i++) e.total += e.store[i]; break;
    case 'router': e.filter = it(o.fl); if (o.b) for (let i = 0; i + 1 < o.b.length && e.bn < 2; i += 2) { e.bty[e.bn] = o.b[i]; e.bdir[e.bn] = o.b[i + 1]; e.bt[e.bn] = -1; e.bn++; } break;
    case 'unloader': e.filter = it(o.fl); break;
    case 'tunnel': if (o.q) for (let i = 0; i + 1 < o.q.length && e.qn < e.cap; i += 2) { e.qty[e.qn] = o.q[i]; e.qt[e.qn] = o.q[i + 1]; e.qp[e.qn] = o.q[i + 1]; e.qn++; } break;
    case 'belt': if (o.i) { e.n = 0; for (let i = 0; i + 1 < o.i.length && e.n < 4; i += 2) { e.ty[e.n] = o.i[i]; e.p[e.n] = e.pp[e.n] = o.i[i + 1]; e.n++; } } break;
    case 'miner': e.prog = o.pg || 0; e.outN = o.on || 0; break;
    case 'gen': e.fuelN = o.fn || 0; e.energy = o.en || 0; break;
    case 'battery': e.charge = o.ch || 0; break;
    case 'lab': if (o.ib) for (let k = 0; k < 3; k++) e.inb[k] = o.ib[k] | 0; break;
  }
}
function restoreEnt(o, free, historyAdd) {
  if (!BUILDINGS[o.t]) return null;
  const e = Build.place(o.t, o.x, o.y, o.r, { free, paid: o.p || 0, kit: !!o.k, mode: o.m, noHistory: !historyAdd, quiet: true });
  applySnap(e, o);
  return e;
}

const History = {
  undo: [], redo: [], cur: null,
  begin() { this.cur = { add: [], del: [] }; },
  recAdd(e) { if (this.cur) this.cur.add.push(snapEnt(e)); },
  recDel(s) { if (this.cur) this.cur.del.push(s); },
  end() {
    const g = this.cur; this.cur = null;
    if (g && (g.add.length || g.del.length)) { this.undo.push(g); if (this.undo.length > 150) this.undo.shift(); this.redo.length = 0; }
  },
  // remove entities matching `rem` snapshots, restore `res` snapshots
  apply(rem, res) {
    let need = 0, refund = 0;
    const found = rem.map(s => { const e = World.entAt(s.x, s.y); return e && e.type === s.t && e.x === s.x && e.y === s.y ? e : null; });
    found.forEach(e => { if (e && !e.kit) refund += e.paid * BALANCE.refundRate; });
    const costOf = s => s.k ? BUILDINGS[s.t].cost : (s.p || 0);
    res.forEach(s => { if (!(s.k && (Build.kit[s.t] | 0) > 0)) need += costOf(s); });
    if (Econ.cash + refund < need) { UI.toast(`Need ${fmtMoney(need - refund)} to redo/undo that`, 'bad'); Sfx.play('error'); return false; }
    found.forEach(e => { if (e && !e.dead) Build.demolish(e, true); });
    let blocked = 0;
    res.forEach(s => {
      const def = BUILDINGS[s.t]; let ok = true;
      for (let y = s.y; y < s.y + def.size && ok; y++) for (let x = s.x; x < s.x + def.size; x++) if (!World.inb(x, y) || World.occ[y * MAP_W + x]) { ok = false; break; }
      if (!ok) { blocked++; return; }
      if (s.k && (Build.kit[s.t] | 0) > 0) { Build.kit[s.t]--; restoreEnt(s, true, false); }
      else { const c = costOf(s); Econ.cash -= c; restoreEnt(Object.assign({}, s, { k: 0, p: c }), true, false); }
      Bus.emit('placed', World.entAt(s.x, s.y), true);
    });
    if (blocked) UI.toast(`${blocked} building(s) couldn’t be restored (space taken)`, 'bad');
    return true;
  },
  doUndo() {
    const g = this.undo.pop(); if (!g) { UI.toast('Nothing to undo', 'info'); return; }
    if (this.apply(g.add, g.del)) { this.redo.push(g); Sfx.play('click'); } else this.undo.push(g);
  },
  doRedo() {
    const g = this.redo.pop(); if (!g) { UI.toast('Nothing to redo', 'info'); return; }
    if (this.apply(g.del, g.add)) { this.undo.push(g); Sfx.play('click'); } else this.redo.push(g);
  },
  clear() { this.undo.length = 0; this.redo.length = 0; this.cur = null; },
};

/* =====================================================================
   5. INPUT — camera, mouse/keyboard/touch, tool state machine
   ===================================================================== */
const Cam = {
  x: MAP_W * TILE / 2, y: MAP_H * TILE / 2, zoom: 1, tz: 1, W: 800, H: 600,
  ax: 0, ay: 0, vx: 0, vy: 0, minZ: 0.1, maxZ: 2.6,
  wx(sx) { return (sx - this.W / 2) / this.zoom + this.x; },
  wy(sy) { return (sy - this.H / 2) / this.zoom + this.y; },
  sx(wx) { return (wx - this.x) * this.zoom + this.W / 2; },
  sy(wy) { return (wy - this.y) * this.zoom + this.H / 2; },
  resize(W, H) {
    this.W = W; this.H = H;
    this.minZ = Math.max(0.06, Math.min(W / (MAP_W * TILE), H / (MAP_H * TILE)) * 0.95);
    this.tz = clamp(this.tz, this.minZ, this.maxZ); this.zoom = clamp(this.zoom, this.minZ, this.maxZ);
  },
  zoomBy(f, sx, sy) { this.tz = clamp(this.tz * f, this.minZ, this.maxZ); this.ax = sx; this.ay = sy; },
  setZoom(z, sx, sy) {
    const wx = this.wx(sx), wy = this.wy(sy);
    this.zoom = z; this.x = wx - (sx - this.W / 2) / z; this.y = wy - (sy - this.H / 2) / z;
  },
  jump(wx, wy) { this.x = wx; this.y = wy; this.vx = this.vy = 0; },
  update(dt) {
    if (Math.abs(this.tz - this.zoom) > 1e-5) {
      const z = Math.abs(this.tz - this.zoom) < 1e-3 ? this.tz : this.zoom + (this.tz - this.zoom) * Math.min(1, dt * 14);
      this.setZoom(z, this.ax, this.ay);
    }
    const K = Input.keys;
    let ix = 0, iy = 0;
    if (K.has('a') || K.has('arrowleft')) ix--; if (K.has('d') || K.has('arrowright')) ix++;
    if (K.has('w') || K.has('arrowup')) iy--; if (K.has('s') || K.has('arrowdown')) iy++;
    const sp = (K.has('shift') ? 1500 : 800) / this.zoom;
    const k = Math.min(1, dt * 12);
    this.vx += (ix * sp - this.vx) * k; this.vy += (iy * sp - this.vy) * k;
    if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) { this.x += this.vx * dt; this.y += this.vy * dt; }
    this.x = clamp(this.x, 0, MAP_W * TILE); this.y = clamp(this.y, 0, MAP_H * TILE);
  },
};

const Input = {
  mx: -1, my: -1, over: false, tx: 0, ty: 0, wx: 0, wy: 0,
  keys: new Set(), ptrs: new Map(), g: null, pinch: null, drawMode: false, touchUsed: false,
  updateHover() {
    this.wx = Cam.wx(this.mx); this.wy = Cam.wy(this.my);
    this.tx = Math.floor(this.wx / TILE); this.ty = Math.floor(this.wy / TILE);
  },
  init(cv) {
    cv.addEventListener('pointerdown', e => this.down(e, cv));
    cv.addEventListener('pointermove', e => this.move(e));
    cv.addEventListener('pointerup', e => this.up(e, false));
    cv.addEventListener('pointercancel', e => this.up(e, true));
    cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { this.over = false; UI.hideTip(); } });
    cv.addEventListener('pointerenter', () => { this.over = true; });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      let d = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
      d = clamp(d, -300, 300);
      Cam.zoomBy(Math.exp(-d * 0.0016), e.clientX, e.clientY);
    }, { passive: false });
    window.addEventListener('keydown', e => this.key(e));
    window.addEventListener('keyup', e => { this.keys.delete(e.key.toLowerCase()); });
    window.addEventListener('blur', () => { this.keys.clear(); });
  },
  down(e, cv) {
    Sfx.unlock();
    try { cv.focus({ preventScroll: true }); cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const touch = e.pointerType !== 'mouse';
    if (touch) this.touchUsed = true;
    this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    this.mx = e.clientX; this.my = e.clientY; this.over = true; this.updateHover();
    if (this.ptrs.size === 2) {
      if (this.g) { if (this.g.long) clearTimeout(this.g.long); if (this.g.mode === 'tool') Tools.cancelDrag(); }
      const [a, b] = [...this.ptrs.values()];
      this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: Cam.zoom, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      this.g = null; return;
    }
    if (this.ptrs.size > 2) return;
    const g = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, touch, btn: e.button, mode: 'maybe', long: null };
    if (e.button === 1 || e.button === 2) g.mode = 'pan';
    else if (!touch || this.drawMode) g.mode = Tools.down() ? 'tool' : 'maybe';
    if (touch && g.mode === 'maybe') g.long = setTimeout(() => { if (this.g === g && !g.moved) { g.mode = 'done'; Tools.longPress(); } }, 480);
    this.g = g;
  },
  move(e) {
    if (this.ptrs.has(e.pointerId)) this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    this.mx = e.clientX; this.my = e.clientY; this.over = true;
    if (this.pinch && this.ptrs.size >= 2) {
      const [a, b] = [...this.ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      Cam.x -= (mx - this.pinch.mx) / Cam.zoom; Cam.y -= (my - this.pinch.my) / Cam.zoom;
      const z = clamp(this.pinch.z * d / this.pinch.d, Cam.minZ, Cam.maxZ);
      Cam.setZoom(z, mx, my); Cam.tz = z;
      this.pinch.mx = mx; this.pinch.my = my;
      this.updateHover(); return;
    }
    const g = this.g;
    if (g && g.id === e.pointerId) {
      if (!g.moved && Math.hypot(e.clientX - g.sx, e.clientY - g.sy) > (g.touch ? 10 : 5)) { g.moved = true; if (g.long) clearTimeout(g.long); }
      if ((g.mode === 'pan' || g.mode === 'maybe') && g.moved) {
        Cam.x -= (e.clientX - g.lx) / Cam.zoom; Cam.y -= (e.clientY - g.ly) / Cam.zoom; g.mode = 'pan';
      }
      g.lx = e.clientX; g.ly = e.clientY;
    }
    this.updateHover();
    if (g && g.mode === 'tool') Tools.move();
  },
  up(e, cancel) {
    this.ptrs.delete(e.pointerId);
    if (this.pinch) { if (this.ptrs.size < 2) this.pinch = null; this.g = null; return; }
    const g = this.g;
    if (!g || g.id !== e.pointerId) return;
    if (g.long) clearTimeout(g.long);
    this.g = null;
    if (cancel) { if (g.mode === 'tool') Tools.cancelDrag(); return; }
    if (g.mode === 'tool') Tools.up();
    else if (!g.moved && g.mode !== 'done') { if (g.btn === 2) Tools.rightClick(); else if (g.btn === 0 || g.touch) Tools.click(); }
    if (g.touch && e.pointerType !== 'mouse') this.over = false;
  },
  key(e) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) { if (e.key === 'Escape') t.blur(); return; }
    Sfx.unlock();
    const k = e.key.toLowerCase();
    if (UI.modalOpen()) { if (k === 'escape') UI.closeModal(); return; }
    if (e.ctrlKey || e.metaKey) {
      if (k === 'z') { e.preventDefault(); if (e.shiftKey) History.doRedo(); else History.doUndo(); }
      else if (k === 'y') { e.preventDefault(); History.doRedo(); }
      else if (k === 's') { e.preventDefault(); Save.autosave(); UI.toast('Game saved', 'good'); }
      return;
    }
    if (e.altKey) return;
    this.keys.add(k);
    if (k >= '1' && k <= '9') { UI.hotkey(+k); return; }
    switch (k) {
      case 'escape': Tools.escape(); break;
      case 'r': Tools.rotate(e.shiftKey ? -1 : 1); break;
      case 'q': Tools.pipette(); break;
      case 'tab': e.preventDefault(); UI.nextCat(e.shiftKey ? -1 : 1); break;
      case 'x': Tools.set(Tools.mode === 'demolish' ? 'select' : 'demolish'); break;
      case 'c': Tools.set(Tools.mode === 'copy' ? 'select' : 'copy'); break;
      case 'v': Tools.set('paste'); break;
      case 'delete': case 'backspace': Tools.demolishAt(this.tx, this.ty); break;
      case 't': UI.openModal('m-research'); break;
      case 'i': UI.openModal('m-stats'); break;
      case 'k': UI.openModal('m-market'); break;
      case 'g': UI.openModal('m-goals'); break;
      case 'h': UI.openModal('m-codex'); break;
      case 'o': UI.openModal('m-settings'); break;
      case 'm': UI.toggleMinimap(); break;
      case 'f3': e.preventDefault(); Settings.showFps = !Settings.showFps; Settings.save(); break;
      case ' ': e.preventDefault(); Cam.tz = 1; Cam.ax = Cam.W / 2; Cam.ay = Cam.H / 2; break;
    }
  },
};

/* ---------- Tool state machine: select | build | demolish | copy | paste ---------- */
const LP = { x: new Int16Array(1024), y: new Int16Array(1024), r: new Uint8Array(1024), n: 0 };
const Tools = {
  mode: 'select', type: null, rot: 0, drag: null, bp: null, handT: 0, ghostReason: '',
  set(mode, type) {
    if (mode === 'build' && (!type || !BUILDINGS[type])) mode = 'select';
    if (mode === 'build' && !Build.unlocked(type)) { UI.toast(`Locked — research ${TECH[BUILDINGS[type].tech].name}`, 'bad'); Sfx.play('error'); return; }
    if (mode === 'paste' && !this.bp) { UI.toast('Copy an area first: press C and drag a box', 'info'); mode = 'select'; }
    this.mode = mode; this.type = mode === 'build' ? type : null; this.drag = null;
    UI.onToolChange();
  },
  pick(type) { if (this.mode === 'build' && this.type === type) this.set('select'); else this.set('build', type); Sfx.play('click'); },
  escape() {
    if (this.drag) { this.drag = null; return; }
    if (this.mode !== 'select') this.set('select'); else UI.closeInspector();
  },
  rotate(d) {
    if (this.mode === 'paste' && this.bp) { const n = (d + 4) % 4; for (let i = 0; i < n; i++) this.rotateBp(); Sfx.play('click'); return; }
    if (this.mode === 'select') {
      const e = World.entAt(Input.tx, Input.ty) || (UI.sel && !UI.sel.dead ? UI.sel : null);
      if (e && DIRECTIONAL[e.def.kind]) { e.rot = (e.rot + d + 4) & 3; Sim.touch(e); e.born = Render.now - 120; Sfx.play('click'); UI.inspectRefresh(); }
      return;
    }
    this.rot = (this.rot + d + 4) & 3; Sfx.play('click');
  },
  pipette() {
    const e = World.entAt(Input.tx, Input.ty);
    if (e) { this.rot = e.rot; if (Build.unlocked(e.type)) this.set('build', e.type); }
  },
  down() {
    const tx = Input.tx, ty = Input.ty;
    switch (this.mode) {
      case 'build': case 'demolish': case 'copy': this.drag = { sx: tx, sy: ty, cx: tx, cy: ty }; return true;
      case 'paste': return true;
    }
    return false;
  },
  move() { if (this.drag) { this.drag.cx = Input.tx; this.drag.cy = Input.ty; } },
  up() {
    const d = this.drag; this.drag = null;
    switch (this.mode) {
      case 'build': if (d) this.commitBuild(d); break;
      case 'demolish': if (d) this.commitDemolish(d); break;
      case 'copy': if (d) this.commitCopy(d); break;
      case 'paste': this.commitPaste(); break;
    }
  },
  click() {
    const tx = Input.tx, ty = Input.ty, d = { sx: tx, sy: ty, cx: tx, cy: ty };
    switch (this.mode) {
      case 'select': this.selectAt(tx, ty); break;
      case 'build': this.commitBuild(d); break;
      case 'demolish': this.commitDemolish(d); break;
      case 'copy': UI.toast(Input.touchUsed ? 'Enable ✎ draw mode, then drag a box to copy' : 'Drag a box to copy', 'info'); break;
      case 'paste': this.commitPaste(); break;
    }
  },
  rightClick() { if (this.mode !== 'select') this.set('select'); else UI.closeInspector(); },
  longPress() { const e = World.entAt(Input.tx, Input.ty); if (e) { UI.inspect(e); Sfx.play('click'); } },
  cancelDrag() { this.drag = null; },

  selectAt(tx, ty) {
    const e = World.entAt(tx, ty);
    if (e) { UI.inspect(e); Sfx.play('click'); return; }
    if (World.inb(tx, ty) && World.res[ty * MAP_W + tx]) { this.handMine(tx, ty); return; }
    UI.closeInspector();
  },
  handMine(tx, ty) {
    const now = performance.now();
    if (now - this.handT < BALANCE.handMineCooldown * 1000) return;
    this.handT = now;
    const it = RES_ITEM[World.res[ty * MAP_W + tx]];
    const v = VALUE[it] * Upg.sell;
    Econ.earn(v); Stats.prod(it, 1);
    Render.burst((tx + 0.5) * TILE, (ty + 0.5) * TILE, ITEMS[it].color, 7);
    Render.floatText((tx + 0.5) * TILE, ty * TILE, '+' + fmtMoney(v), '#8ee38a');
    Sfx.play('mine');
    Bus.emit('handmine');
  },

  // Build a line (belts: L-shaped path with auto directions; others: repeated along the drag axis)
  linePts(d, type) {
    const def = BUILDINGS[type]; LP.n = 0;
    const push = (x, y, r) => { if (LP.n < 1024) { LP.x[LP.n] = x; LP.y[LP.n] = y; LP.r[LP.n] = r; LP.n++; } };
    const dx = d.cx - d.sx, dy = d.cy - d.sy;
    if (dx === 0 && dy === 0) { const [ax, ay] = Build.anchor(type, d.sx, d.sy); push(ax, ay, this.rot); return; }
    if (def.kind === 'belt') {
      const hf = Math.abs(dx) >= Math.abs(dy);
      const hd = dx > 0 ? 0 : 2, vd = dy > 0 ? 1 : 3, sx = Math.sign(dx), sy = Math.sign(dy);
      if (hf) {
        for (let x = d.sx; ; x += sx) { push(x, d.sy, hd); if (x === d.cx) break; }
        if (dy !== 0) { LP.r[LP.n - 1] = vd; for (let y = d.sy + sy; ; y += sy) { push(d.cx, y, vd); if (y === d.cy) break; } }
      } else {
        for (let y = d.sy; ; y += sy) { push(d.sx, y, vd); if (y === d.cy) break; }
        if (dx !== 0) { LP.r[LP.n - 1] = hd; for (let x = d.sx + sx; ; x += sx) { push(x, d.cy, hd); if (x === d.cx) break; } }
      }
      return;
    }
    const hf = Math.abs(dx) >= Math.abs(dy);
    if (def.kind === 'tunnel') {
      const r = hf ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3);
      const ex = hf ? d.cx : d.sx, ey = hf ? d.sy : d.cy;
      push(d.sx, d.sy, r);
      if (Math.abs(hf ? dx : dy) <= def.range + 1) push(ex, ey, r);
      return;
    }
    const s = def.size, len = hf ? dx : dy, n = Math.floor(Math.abs(len) / s) + 1, sg = Math.sign(len);
    for (let k = 0; k < n; k++) {
      const [ax, ay] = Build.anchor(type, hf ? d.sx + sg * k * s : d.sx, hf ? d.sy : d.sy + sg * k * s);
      push(ax, ay, this.rot);
    }
  },
  commitBuild(d) {
    const type = this.type; if (!type) return;
    this.linePts(d, type);
    History.begin();
    let placed = 0, err = '';
    for (let i = 0; i < LP.n; i++) {
      const c = Build.check(type, LP.x[i], LP.y[i], LP.r[i]);
      if (c.ok) { Build.place(type, LP.x[i], LP.y[i], LP.r[i]); placed++; }
      else if (!c.same) err = c.reason;
    }
    History.end();
    if (placed) {
      Sfx.play('place');

      if (err && LP.n > 1) UI.toast(`Placed ${placed}, some skipped: ${err}`, 'info');
    } else if (err) { UI.toast(err, 'bad'); Sfx.play('error'); }

  },
  demolishAt(tx, ty) { this.commitDemolish({ sx: tx, sy: ty, cx: tx, cy: ty }); },
  boxEnts(d, full) {
    const x0 = Math.max(0, Math.min(d.sx, d.cx)), x1 = Math.min(MAP_W - 1, Math.max(d.sx, d.cx));

    const set = new Set();
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const id = World.occ[y * MAP_W + x]; if (!id) continue;
      const e = Sim.ents.get(id);
      if (e && (!full || (e.x >= x0 && e.y >= y0 && e.x + e.w - 1 <= x1 && e.y + e.h - 1 <= y1))) set.add(e);

  commitDemolish(d) {

    let n = 0, err = '', refund = 0;
    for (const e of set) {
      const why = Build.canDemolish(e); if (why) { err = why; continue; }
      History.recDel(snapEnt(e));
      refund += e.kit ? 0 : e.paid * BALANCE.refundRate;
      Render.burst((e.x + e.w / 2) * TILE, (e.y + e.h / 2) * TILE, e.def.color, 6 + e.w * 3);
      Build.demolish(e);
      if (UI.sel === e) UI.closeInspector();
      n++;

    History.end();
    if (n) { Sfx.play('demolish'); if (refund > 0 && n > 1) UI.toast(`Removed ${n} buildings, refunded ${fmtMoney(refund)}`, 'info'); }
    if (err) { UI.toast(err, 'bad'); if (!n) Sfx.play('error'); }
  },
  commitCopy(d) {
    const { set, x0, y0, x1, y1 } = this.boxEnts(d, true);
    if (!set.size) { UI.toast('Nothing to copy there', 'info'); return; }
    const items = [];
    for (const e of set) items.push({ t: e.type, dx: e.x - x0, dy: e.y - y0, r: e.rot, cfg: snapEnt(e, false) });
    this.bp = { w: x1 - x0 + 1, h: y1 - y0 + 1, items };
    this.set('paste');
    UI.toast(`Copied ${items.length} buildings — click to paste, R rotates`, 'good');
    Sfx.play('click');
  },
  rotateBp() {
    const bp = this.bp; if (!bp) return;
    for (const it of bp.items) {
      const s = BUILDINGS[it.t].size, ndx = bp.h - (it.dy + s), ndy = it.dx;
      it.dx = ndx; it.dy = ndy; it.r = (it.r + 1) & 3;
    }
    const w = bp.w; bp.w = bp.h; bp.h = w;
  },
  bpOrigin() { return [Input.tx - (this.bp.w >> 1), Input.ty - (this.bp.h >> 1)]; },
  commitPaste() {
    const bp = this.bp; if (!bp) return;
    const [ox, oy] = this.bpOrigin();
    History.begin();
    let placed = 0, skipped = 0, err = '';
    for (const it of bp.items) {
      const c = Build.check(it.t, ox + it.dx, oy + it.dy, it.r);
      if (!c.ok) { if (!c.same) { skipped++; err = c.reason; } continue; }
      const e = Build.place(it.t, ox + it.dx, oy + it.dy, it.r, { mode: it.cfg.m });
      const cfg = Object.assign({}, it.cfg); delete cfg.p; delete cfg.k;

    if (History.cur) History.cur.add = History.cur.add.map(s => { const e = World.entAt(s.x, s.y); return e ? snapEnt(e, false) : s; });
    History.end();
    if (placed) { Sfx.play('place'); if (skipped) UI.toast(`Pasted ${placed}, skipped ${skipped}: ${err}`, 'info'); }
    else if (err) { UI.toast(err, 'bad'); Sfx.play('error'); }
  },
};

const SPR = 64, PAD = 14, BS = 64, BFRAMES = 16;

/* ---------- belts ---------- */
function drawBeltFrame(c, def, shape, phase) {
  const col = def.color, rail = shade(col, -0.2), railHi = shade(col, 0.25), chev = shade(col, 0.35);
  const W0 = 12, W1 = 52;
  if (shape === 0) {
    c.fillStyle = '#1e2127'; c.fillRect(0, W0, BS, W1 - W0);
    const g = c.createLinearGradient(0, W0, 0, W1); g.addColorStop(0, 'rgba(255,255,255,0.06)'); g.addColorStop(0.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.25)');
    c.fillStyle = g; c.fillRect(0, W0, BS, W1 - W0);
    c.save(); c.beginPath(); c.rect(0, W0, BS, W1 - W0); c.clip();
    c.strokeStyle = chev; c.globalAlpha = 0.55; c.lineWidth = 4; c.lineJoin = 'round';
    for (let k = -1; k < 3 && phase >= 0; k++) {
      const x = (k * 0.5 + phase * 0.5) * BS;
      c.beginPath(); c.moveTo(x - 5, W0 + 9); c.lineTo(x + 5, 32); c.lineTo(x - 5, W1 - 9); c.stroke();
    }

    if (phase >= 0) c.fillStyle = 'rgba(0,0,0,0.3)'; else c.fillStyle = 'rgba(0,0,0,0)';
    for (let k = 0; k < 4; k++) { c.fillRect(k * 16 + ((phase * 16) | 0) % 16, 6, 2, 5); c.fillRect(k * 16 + ((phase * 16) | 0) % 16, W1 + 1, 2, 5); }
    return;
  }
  // curve: shape 1 = from left (enter top edge), 2 = from right (enter bottom edge); exit east edge
  const ccx = BS, ccy = shape === 1 ? 0 : BS;
  const a0 = shape === 1 ? Math.PI / 2 : Math.PI, a1 = shape === 1 ? Math.PI : Math.PI * 1.5;
  c.beginPath(); c.arc(ccx, ccy, W1, a0, a1); c.arc(ccx, ccy, W0, a1, a0, true); c.closePath(); c.fillStyle = '#1e2127'; c.fill();
  c.save(); c.clip();
  c.strokeStyle = chev; c.globalAlpha = 0.55; c.lineWidth = 4; c.lineJoin = 'round';
  for (let k = -1; k < 3 && phase >= 0; k++) {
    const t = k * 0.5 + phase * 0.5; if (t < -0.3 || t > 1.3) continue;
    const a = shape === 1 ? Math.PI - t * Math.PI / 2 : Math.PI + t * Math.PI / 2;
    const px = ccx + Math.cos(a) * 32, py = ccy + Math.sin(a) * 32;

    c.save(); c.translate(px, py); c.rotate(ang); c.beginPath(); c.moveTo(-5, -11); c.lineTo(5, 0); c.lineTo(-5, 11); c.stroke(); c.restore();
  }
  c.restore();
  for (const [r0, r1] of [[5, 12], [52, 59]]) {
    c.beginPath(); c.arc(ccx, ccy, r1, a0, a1); c.arc(ccx, ccy, r0, a1, a0, true); c.closePath(); c.fillStyle = rail; c.fill();
  }

/* ---------- items ---------- */

      c.beginPath(); c.moveTo(h - 7, 17); c.lineTo(h + 7, 17); c.lineTo(s - 6, s - 6); c.lineTo(6, s - 6); c.closePath(); c.fillStyle = col; c.fill(); circle(c, h + 2, h + 6, 1.8, 'rgba(255,255,255,0.7)'); break;

const Sprites = {
  body: {}, shadow: {}, belts: [], beltsPlain: [], items: [], glow: null, glowCool: null,
  build() {
    for (const k of BTYPES) {
      const def = BUILDINGS[k];
      if (def.kind === 'belt') continue;
      if (def.kind === 'router' || def.kind === 'junction' || def.kind === 'unloader') {
        for (let r = 0; r < 4; r++) this.body[k + ':' + r] = this.makeBody(def, c => drawRouterArt(c, def, r));
      } else if (def.kind === 'tunnel') {
        for (let m = 0; m < 2; m++) for (let r = 0; r < 4; r++) this.body['tunnel:' + m + ':' + r] = this.makeBody(def, c => drawTunnelArt(c, def, r, m));
      } else {
        const fn = BodyArt[def.id] || BodyArt[def.kind === 'machine' ? (def.craft === 'assemble' ? 'assembler' : def.id) : def.kind] || BodyArt[def.kind];
        this.body[k] = this.makeBody(def, c => fn(c, def.size * SPR, def));
      }
      this.shadow[k] = this.makeShadow(def);
    }
    // belts: [tier][shape][rot][frame]
    ['belt1', 'belt2', 'belt3'].forEach((k, ti) => {
      const def = BUILDINGS[k]; this.belts[ti] = []; this.beltsPlain[ti] = [];
      for (let sh = 0; sh < 3; sh++) {
        const plain = mkCanvas(BS, BS); drawBeltFrame(plain.getContext('2d'), def, sh, -1);
        this.beltsPlain[ti][sh] = [0, 1, 2, 3].map(r => { const cv = mkCanvas(BS, BS), c = cv.getContext('2d'); c.translate(BS / 2, BS / 2); c.rotate(r * Math.PI / 2); c.drawImage(plain, -BS / 2, -BS / 2); return cv; });
        this.belts[ti][sh] = [[], [], [], []];
        for (let f = 0; f < BFRAMES; f++) {
          const base = mkCanvas(BS, BS); drawBeltFrame(base.getContext('2d'), def, sh, f / BFRAMES);
          for (let r = 0; r < 4; r++) {
            if (r === 0) { this.belts[ti][sh][0][f] = base; continue; }
            const cv = mkCanvas(BS, BS), c = cv.getContext('2d');
            c.translate(BS / 2, BS / 2); c.rotate(r * Math.PI / 2); c.drawImage(base, -BS / 2, -BS / 2);
            this.belts[ti][sh][r][f] = cv;
          }
        }
      }
      def.tierIdx = ti;
    });
    // items with baked soft shadow
    for (const it of ITEMS) {
      const cv = mkCanvas(ITEM_PX + 6, ITEM_PX + 6), c = cv.getContext('2d');
      const tmp = mkCanvas(ITEM_PX, ITEM_PX); drawItemShape(tmp.getContext('2d'), it, ITEM_PX);
      c.save(); c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 3; c.shadowOffsetX = 1.5; c.shadowOffsetY = 2; c.drawImage(tmp, 2, 2); c.restore();
      this.items[it.idx] = cv;
    }
    this.glow = this.makeGlow('255,200,110'); this.glowCool = this.makeGlow('120,220,255');
  },
  makeBody(def, fn) {
    const S = def.size * SPR, cv = mkCanvas(S, S);
    fn(cv.getContext('2d'));
    return cv;
  },
  makeShadow(def) {
    const S = def.size * SPR, cv = mkCanvas(S + PAD * 2, S + PAD * 2), c = cv.getContext('2d');
    c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 12; c.shadowOffsetX = 6; c.shadowOffsetY = 7;
    const inset = def.kind === 'pole' ? S * 0.3 : 6;
    rr(c, PAD + inset, PAD + inset, S - inset * 2, S - inset * 2, 10); c.fillStyle = 'rgba(0,0,0,0.6)'; c.fill();
    return cv;
  },
  makeGlow(rgb) {
    const cv = mkCanvas(64, 64), c = cv.getContext('2d');
    const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, `rgba(${rgb},0.9)`); g.addColorStop(0.35, `rgba(${rgb},0.35)`); g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g; c.fillRect(0, 0, 64, 64); return cv;
  },
  bodyOf(e) {
    const k = e.def.kind;
    if (k === 'router' || k === 'junction' || k === 'unloader') return this.body[e.type + ':' + (k === 'junction' ? 0 : e.rot)];
    if (k === 'tunnel') return this.body['tunnel:' + (e.mode | 0) + ':' + e.rot];
    return this.body[e.type];
  },
  bodyFor(type, rot, mode) {
    const k = BUILDINGS[type].kind;
    if (k === 'router' || k === 'junction' || k === 'unloader') return this.body[type + ':' + (k === 'junction' ? 0 : rot)];
    if (k === 'tunnel') return this.body['tunnel:' + (mode | 0) + ':' + rot];
    if (k === 'belt') return this.belts[BUILDINGS[type].tierIdx][0][rot][0];
    return this.body[type];
  },
  // small DOM icon canvases
  icon(type, px) {
    const cv = mkCanvas(px, px), c = cv.getContext('2d');
    const def = BUILDINGS[type], img = this.bodyFor(type, 0, 0);
    const s = def.kind === 'belt' ? px : px;
    c.drawImage(img, 0, 0, img.width, img.height, (px - s) / 2, (px - s) / 2, s, s);
    return cv;
  },
  itemIcon(i, px) { const cv = mkCanvas(px, px); cv.getContext('2d').drawImage(this.items[i], 0, 0, px, px); return cv; },
