<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<title>Forgeline — Factory Automation</title>
<style>
:root{
  --ui:1;
  --bg:#0f1318; --panel:rgba(19,24,31,.94); --panel-solid:#161c24; --panel2:#1f2731; --panel3:#28323e;
  --line:#2c3743; --line2:#3a4757; --text:#e8eef4; --dim:#95a3b4; --faint:#5e6c7d;
  --accent:#f0a53a; --accent-d:#b8741c; --blue:#4fb0d8; --good:#57cf79; --warn:#f1c84b; --bad:#ee5d5d;
  --money:#8ee38a; --sci0:#e0524f; --sci1:#4fc46a; --sci2:#4f8fe0;
  --shadow:0 8px 28px rgba(0,0,0,.45); --ease:cubic-bezier(.2,.8,.2,1);
}
html{font-size:calc(14px * var(--ui))}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
  -webkit-font-smoothing:antialiased}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
canvas#game:focus-visible{outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

/* ---------- top bar ---------- */
#topbar{position:fixed;left:.6rem;right:.6rem;top:.6rem;display:flex;gap:.45rem;align-items:stretch;pointer-events:none;z-index:10}
#topbar>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.35rem .7rem;display:flex;align-items:center;gap:.55rem;box-shadow:var(--shadow);backdrop-filter:blur(6px);min-height:2.7rem}
.chip .lbl{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;line-height:1}
.chip b{font-variant-numeric:tabular-nums}
#cash{font-size:1.25rem;color:var(--money);line-height:1.1}
#income{font-size:.78rem;color:var(--dim);font-variant-numeric:tabular-nums}
.col{display:flex;flex-direction:column;justify-content:center}
.pbar{height:.35rem;border-radius:.2rem;background:#0b0e12;overflow:hidden;margin-top:.2rem;width:6.5rem}
.pbar i{display:block;height:100%;width:0;background:var(--good);transition:width .25s var(--ease),background .25s}
#power-text{font-size:.85rem}
#power-graph{width:5.5rem;height:1.9rem;border-radius:.3rem;background:#0b0e12}
.sci{display:flex;align-items:center;gap:.2rem;font-size:.85rem;font-variant-numeric:tabular-nums}
.sci .dot{width:.6rem;height:.8rem;border-radius:.15rem .15rem .35rem .35rem}
#objective{flex:1;min-width:0;cursor:pointer}
#objective .col{min-width:0;flex:1}
#obj-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
#obj-bar{height:.3rem;background:#0b0e12;border-radius:.2rem;overflow:hidden;margin-top:.25rem}
#obj-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s var(--ease)}
.tbtns{display:flex;gap:.3rem}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;min-width:2.7rem;height:2.7rem;display:flex;align-items:center;justify-content:center;gap:.35rem;padding:0 .6rem;box-shadow:var(--shadow);transition:background .15s,border-color .15s,transform .15s var(--ease);position:relative}
.ibtn:hover{background:var(--panel3);border-color:var(--line2)}
.ibtn:active{transform:scale(.95)}
.ibtn.on{border-color:var(--accent);color:var(--accent)}
.ibtn .badge{position:absolute;top:-.3rem;right:-.3rem;background:var(--accent);color:#1a1206;font-size:.65rem;font-weight:700;border-radius:1rem;padding:.05rem .35rem}
.ibtn span.t{font-size:.82rem}

/* ---------- right side ---------- */
#side{position:fixed;right:.6rem;top:3.9rem;width:18.5rem;display:flex;flex-direction:column;gap:.45rem;z-index:9;pointer-events:none;bottom:9.5rem}
#side>*{pointer-events:auto}
#minimap-wrap{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.3rem;box-shadow:var(--shadow);position:relative}
#minimap{width:11rem;height:11rem;display:block;border-radius:.4rem;cursor:pointer;image-rendering:pixelated}
#mm-toggle{position:absolute;left:.4rem;top:.4rem;width:1.5rem;height:1.5rem;border-radius:.4rem;border:0;background:rgba(0,0,0,.45);font-size:.8rem;line-height:1}
#inspector{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;box-shadow:var(--shadow);overflow:auto;min-height:0;flex:0 1 auto;animation:slidein .2s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.insp-h{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-solid);z-index:1}
.insp-h canvas{width:2.4rem;height:2.4rem}
.insp-h .ttl{font-weight:700;flex:1}
.insp-h .sub{font-size:.75rem;color:var(--dim)}
.insp-b{padding:.6rem .7rem;display:flex;flex-direction:column;gap:.6rem}
.status{display:flex;align-items:center;gap:.45rem;font-size:.85rem}
.status .lamp{width:.8rem;height:.8rem;border-radius:50%}
.effbar{height:.45rem;background:#0b0e12;border-radius:.25rem;overflow:hidden}
.effbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent));width:0;transition:width .3s var(--ease)}
.sect{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:-.25rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;font-size:.85rem}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:.4rem;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:.5rem;padding:.4rem .7rem;font-size:.85rem;transition:background .15s,transform .12s var(--ease),border-color .15s}
.btn:hover{background:var(--panel3)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1305;font-weight:700}
.btn.primary:hover{background:#ffb84f}
.btn.danger{border-color:#6b2c2c;color:#ffb3b3}
.btn.danger:hover{background:#3a1c1c}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.25rem .5rem;font-size:.78rem}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:.3rem}
.rbtn{background:var(--panel2);border:1px solid var(--line);border-radius:.45rem;padding:.2rem;height:2.6rem;display:flex;align-items:center;justify-content:center;position:relative}
.rbtn:hover{border-color:var(--line2);background:var(--panel3)}
.rbtn.sel{border-color:var(--accent);background:#3a2d15}
.rbtn.locked{opacity:.35}
.rbtn canvas{width:1.8rem;height:1.8rem}
.rgraph{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;background:#10151b;border:1px solid var(--line);border-radius:.5rem;padding:.4rem .5rem;font-size:.82rem}
.rgraph .it{display:inline-flex;align-items:center;gap:.15rem;font-variant-numeric:tabular-nums}
.rgraph canvas{width:1.4rem;height:1.4rem}
.rgraph .arrow{color:var(--dim);padding:0 .15rem}
.rgraph .meta{width:100%;color:var(--dim);font-size:.75rem;margin-top:.1rem}
.bufs{display:flex;gap:.35rem;flex-wrap:wrap}
.buf{display:flex;align-items:center;gap:.2rem;background:#10151b;border:1px solid var(--line);border-radius:.4rem;padding:.15rem .4rem .15rem .2rem;font-size:.8rem;font-variant-numeric:tabular-nums}
.buf canvas{width:1.3rem;height:1.3rem}
.toggle{display:flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.85rem}
.toggle input{width:2.2rem;height:1.2rem;appearance:none;-webkit-appearance:none;background:#0b0e12;border:1px solid var(--line2);border-radius:1rem;position:relative;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;left:.12rem;top:.1rem;width:.85rem;height:.85rem;border-radius:50%;background:var(--dim);transition:left .2s var(--ease),background .2s}
.toggle input:checked{background:#3a2d15;border-color:var(--accent)}
.toggle input:checked::after{left:1.15rem;background:var(--accent)}

/* ---------- bottom build bar ---------- */
#bottom{position:fixed;left:50%;bottom:.6rem;transform:translateX(-50%);max-width:calc(100% - 1.2rem);z-index:10;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
#bottom>*{pointer-events:auto}
#tools{display:flex;gap:.3rem;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.3rem;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
#tools .ibtn{box-shadow:none;height:2.4rem;min-width:2.4rem;background:transparent;border-color:transparent}
#tools .ibtn:hover{background:var(--panel3)}
#tools .ibtn.on{background:#3a2d15;border-color:var(--accent)}
#tools .sep{width:1px;background:var(--line);margin:.2rem .15rem}
#buildbar{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;box-shadow:var(--shadow);padding:.4rem;display:flex;flex-direction:column;gap:.35rem;max-width:100%}
#cats{display:flex;gap:.25rem;align-items:center}
.cat{border:0;background:transparent;padding:.3rem .65rem;border-radius:.45rem;color:var(--dim);font-size:.82rem;transition:background .15s,color .15s}
.cat:hover{background:var(--panel2);color:var(--text)}
.cat.on{background:var(--panel3);color:var(--accent)}
#build-search{margin-left:auto;background:#0d1116;border:1px solid var(--line);border-radius:.45rem;padding:.25rem .5rem;width:8.5rem;font-size:.82rem;outline:none;-webkit-user-select:text;user-select:text}
#build-search:focus{border-color:var(--accent)}
#build-items{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:thin;padding-bottom:.1rem;max-width:100%}
.bitem{position:relative;flex:none;width:4.1rem;height:4.4rem;background:var(--panel2);border:1px solid var(--line);border-radius:.55rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;padding:.2rem;transition:background .15s,border-color .15s,transform .15s var(--ease)}
.bitem:hover{background:var(--panel3);border-color:var(--line2);transform:translateY(-2px)}
.bitem.on{border-color:var(--accent);background:#3a2d15}
.bitem canvas{width:2.3rem;height:2.3rem}
.bitem .c{font-size:.7rem;color:var(--money);font-variant-numeric:tabular-nums}
.bitem .c.no{color:var(--bad)}
.bitem .hk{position:absolute;left:.25rem;top:.15rem;font-size:.62rem;color:var(--faint)}
.bitem .kit{position:absolute;right:.2rem;top:.15rem;font-size:.6rem;background:var(--blue);color:#06141b;border-radius:.6rem;padding:0 .3rem;font-weight:700}
.bitem.locked{opacity:.5}
.bitem.locked::after{content:"";position:absolute;inset:0;border-radius:.55rem;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.25) 6px 12px)}
.bitem .lk{position:absolute;right:.25rem;bottom:.25rem;z-index:1}

/* ---------- tooltip / toasts / hints ---------- */
#tooltip{position:fixed;z-index:50;pointer-events:none;background:rgba(12,15,20,.97);border:1px solid var(--line2);border-radius:.55rem;padding:.5rem .65rem;font-size:.82rem;max-width:18rem;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;left:0;top:0}
#tooltip.show{opacity:1}
#tooltip h4{margin:0 0 .25rem;font-size:.92rem}
#tooltip .d{color:var(--dim);margin-bottom:.3rem}
#tooltip .bad{color:var(--bad)}
#tooltip .good{color:var(--good)}
#tooltip .kv{font-size:.8rem}
#toasts{position:fixed;top:4.2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.35rem;align-items:center;z-index:40;pointer-events:none}
.toast{background:rgba(14,18,24,.96);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:.5rem;padding:.45rem .8rem;font-size:.85rem;box-shadow:var(--shadow);animation:toastin .22s var(--ease);transition:opacity .3s,transform .3s var(--ease)}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}.toast.info{border-left-color:var(--blue)}
.toast.out{opacity:0;transform:translateY(-6px)}
@keyframes toastin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#mode-hint{position:fixed;left:.6rem;bottom:.6rem;z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:.55rem;padding:.35rem .6rem;font-size:.78rem;color:var(--dim);max-width:16rem;pointer-events:none}
#mode-hint b{color:var(--text)}
#fps{position:fixed;left:.6rem;bottom:3rem;font-size:.7rem;color:var(--faint);z-index:9;pointer-events:none;font-variant-numeric:tabular-nums}

/* ---------- tutorial ---------- */
#tut{position:fixed;left:.6rem;top:4rem;z-index:30;max-width:21rem;background:linear-gradient(180deg,#221a0e,#18140d);border:1px solid var(--accent-d);border-radius:.8rem;padding:.7rem .8rem;box-shadow:var(--shadow);animation:slidein .25s var(--ease)}
#tut .step{font-size:.7rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
#tut p{margin:.3rem 0 .55rem;font-size:.9rem;line-height:1.4}
#tut-arrow{position:fixed;z-index:31;pointer-events:none;width:2.2rem;height:2.2rem;margin:-1.1rem 0 0 -1.1rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
#tut-arrow svg{width:100%;height:100%;animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
.tut-glow{box-shadow:0 0 0 2px var(--accent),0 0 18px 4px rgba(240,165,58,.55)!important;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--accent),0 0 6px 1px rgba(240,165,58,.3)}}

/* ---------- modals ---------- */
#modal-root{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,7,10,.55);backdrop-filter:blur(3px);padding:1rem}
#modal-root.open{display:flex;animation:fadein .18s var(--ease)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel-solid);border:1px solid var(--line2);border-radius:1rem;box-shadow:0 20px 60px rgba(0,0,0,.6);width:min(58rem,100%);max-height:min(46rem,100%);display:none;flex-direction:column;overflow:hidden;animation:pop .22s var(--ease)}
.modal.open{display:flex}
.modal.sm{width:min(28rem,100%)}
.modal.md{width:min(40rem,100%)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:1.1rem;flex:1}
.mb{padding:1rem;overflow:auto;-webkit-user-select:text;user-select:text}
.mb p{line-height:1.5;color:#cfd8e2}
.close{background:transparent;border:0;color:var(--dim);width:2rem;height:2rem;border-radius:.5rem}
.close:hover{background:var(--panel3);color:var(--text)}
.tabs{display:flex;gap:.25rem;margin-bottom:.8rem;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th{text-align:left;color:var(--dim);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:.35rem .4rem;border-bottom:1px solid var(--line);position:sticky;top:-1rem;background:var(--panel-solid)}
table.t td{padding:.3rem .4rem;border-bottom:1px solid #1d252f;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#1c242e}
table.t tr.sel td{background:#2b2415}
table.t td canvas.ic{width:1.5rem;height:1.5rem;vertical-align:middle}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--dim)}
.big-graph{width:100%;height:12rem;background:#0b0e12;border-radius:.5rem;border:1px solid var(--line);display:block;margin-bottom:.8rem}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.6rem}
.settings-grid h3{grid-column:1/-1;margin:.4rem 0 -.4rem;font-size:.78rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.field{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem}
.field label{color:var(--dim)}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field select,.field input[type=text],textarea{background:#0d1116;border:1px solid var(--line2);border-radius:.45rem;padding:.35rem .5rem;outline:none}
textarea{width:100%;height:5.5rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;resize:vertical;-webkit-user-select:text;user-select:text}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;grid-column:1/-1}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.55rem;font-size:.8rem;display:flex;flex-direction:column;gap:.35rem}
.slot .meta{color:var(--dim);min-height:2.2em}
.keys{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.25rem .9rem;font-size:.82rem}
kbd{display:inline-block;min-width:1.5em;text-align:center;background:#0c1015;border:1px solid var(--line2);border-bottom-width:2px;border-radius:.3rem;padding:0 .35rem;font-family:inherit;font-size:.78rem;color:var(--text)}

/* research tree */
#tree{position:relative;min-width:62rem;min-height:30rem}
#tree svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tnode{position:absolute;width:11rem;background:var(--panel2);border:1px solid var(--line2);border-radius:.65rem;padding:.5rem .6rem;font-size:.8rem;cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--ease)}
.tnode:hover{transform:translateY(-2px);border-color:var(--dim)}
.tnode .n{font-weight:700;font-size:.88rem;margin-bottom:.15rem}
.tnode .d{color:var(--dim);font-size:.74rem;line-height:1.3;margin-bottom:.3rem}
.tnode .cost{display:flex;gap:.35rem;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tnode .cost span.no{color:var(--bad)}
.tnode.done{border-color:#2f6b40;background:#16261b}
.tnode.done .n::after{content:" ✓";color:var(--good)}
.tnode.avail{border-color:var(--accent-d)}
.tnode.afford{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px rgba(240,165,58,.25)}
.tnode.locked{opacity:.5}
.tnode .lv{float:right;color:var(--accent);font-size:.72rem}
.goal{background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.55rem .7rem;margin-bottom:.45rem}
.goal .top{display:flex;justify-content:space-between;gap:.5rem;font-size:.88rem}
.goal .rw{color:var(--money);font-size:.8rem;white-space:nowrap}
.goal .effbar{margin-top:.35rem}
.goal.done{opacity:.6}
.rebirth{background:linear-gradient(135deg,#1f1830,#191d2a);border:1px solid #4d3f7a;border-radius:.8rem;padding:.8rem;margin-top:1rem}
.rebirth h3{margin:.1rem 0 .4rem;color:#c7b4ff}
.codex-m{margin-bottom:1rem}
.codex-m h3{font-size:.85rem;color:var(--accent);margin:.2rem 0 .4rem}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.4rem}

/* v4: families, dex, menu, contracts, achievements */
#st-poll{cursor:pointer;color:inherit;font:inherit;text-align:left}
#st-poll.on{border-color:#b86ae0}
#poll-tax{font-size:.72rem;color:var(--bad)}
.bitem .fa{position:absolute;left:50%;bottom:-.55rem;transform:translateX(-50%);width:1.6rem;height:1rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel3);color:var(--dim);font-size:.6rem;line-height:.9rem;padding:0;z-index:2}
.bitem .fa:hover{color:var(--accent);border-color:var(--accent)}
.bitem .tn{position:absolute;left:.2rem;bottom:.1rem;font-size:.55rem;color:var(--faint)}
#build-items{padding-bottom:.7rem}
#famdrop{position:fixed;z-index:55;background:var(--panel-solid);border:1px solid var(--line2);border-radius:.7rem;box-shadow:var(--shadow);padding:.35rem;display:flex;flex-direction:column;gap:.25rem;min-width:15rem;animation:pop .15s var(--ease)}
#famdrop button{display:flex;align-items:center;gap:.55rem;background:var(--panel2);border:1px solid var(--line);border-radius:.5rem;padding:.3rem .5rem;text-align:left;font-size:.82rem}
#famdrop button:hover{border-color:var(--accent)}
#famdrop button.on{border-color:var(--accent);background:#3a2d15}
#famdrop button.locked{opacity:.5}
#famdrop canvas{width:2rem;height:2rem;flex:none}
#famdrop .c{margin-left:auto;color:var(--money);font-variant-numeric:tabular-nums}
.modal.wide{width:min(70rem,100%);max-height:min(50rem,100%)}
.dexcount{font-size:.85rem;color:var(--dim)}
.dexwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1rem;padding:0!important;overflow:hidden!important}
.dex-left,.dex-right{overflow:auto;padding:1rem;min-height:0}
.dex-right{border-left:1px solid var(--line);background:#141a21}
.dex-filters{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.6rem}
.dex-filters .btn{padding:.2rem .5rem;font-size:.75rem}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2rem,1fr));gap:.4rem}
.dex-tile{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.3rem .2rem .25rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.62rem;line-height:1.15;text-align:center;min-height:5rem;transition:transform .12s var(--ease),border-color .12s}
.dex-tile:hover{transform:translateY(-2px);border-color:var(--line2)}
.dex-tile.sel{border-color:var(--accent);background:#2e2616}
.dex-tile canvas{width:2.6rem;height:2.6rem}
.dex-tile.unk canvas{filter:brightness(0) opacity(.45)}
.dex-tile.unk{color:var(--faint)}
.dex-tile .tier{position:absolute;right:.25rem;top:.15rem;font-size:.55rem;color:var(--faint)}
.dex-hero{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem}
.dex-hero canvas{width:4.5rem;height:4.5rem;background:#0d1116;border-radius:.8rem;border:1px solid var(--line)}
.dex-hero h3{margin:0;font-size:1.15rem}
.dex-tag{display:inline-block;font-size:.68rem;padding:.05rem .45rem;border-radius:1rem;background:var(--panel3);color:var(--dim);margin:.2rem .2rem 0 0}
.dex-tag.new{background:#3a2d15;color:var(--accent)}
.dex-right .rgraph{margin-bottom:.4rem;cursor:default}
.dex-right .rgraph .it{cursor:pointer}
.dex-right h4{margin:.8rem 0 .35rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
.tier-tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.8rem}
.tier-tabs .btn.locked{opacity:.5}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.6rem}
.tnode2{background:var(--panel2);border:1px solid var(--line2);border-radius:.7rem;padding:.6rem .7rem;font-size:.8rem;cursor:pointer;display:flex;flex-direction:column;gap:.3rem;transition:transform .15s var(--ease),border-color .15s}
.tnode2:hover{transform:translateY(-2px);border-color:var(--dim)}
.tnode2 .n{font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;gap:.4rem}
.tnode2 .d{color:var(--dim);font-size:.76rem;line-height:1.35}
.tnode2 .rq{font-size:.7rem;color:var(--faint)}
.tnode2 .rq b{color:var(--bad);font-weight:600}
.tnode2 .ul{display:flex;gap:.2rem;flex-wrap:wrap}
.tnode2 .ul canvas{width:1.5rem;height:1.5rem;background:#0d1116;border-radius:.3rem}
.tnode2 .cost{display:flex;gap:.6rem;font-variant-numeric:tabular-nums;font-weight:600}
.tnode2 .cost .no{color:var(--bad)}
.tnode2.done{border-color:#2f6b40;background:#16261b}
.tnode2.afford{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px rgba(240,165,58,.25)}
.tnode2.locked{opacity:.55}
.tnode2.milestone{background:linear-gradient(135deg,#2a2240,#1f2731);border-color:#6a5aa8}
.contracts{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.5rem;margin-bottom:1rem}
.contract{background:linear-gradient(135deg,#1f2a22,#1b2129);border:1px solid #2f5a3e;border-radius:.7rem;padding:.55rem .65rem;font-size:.82rem;display:flex;flex-direction:column;gap:.3rem}
.contract .top{display:flex;align-items:center;gap:.45rem}
.contract canvas{width:1.8rem;height:1.8rem}
.contract .rw{margin-left:auto;color:var(--money);font-weight:700}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.45rem}
.ach{display:flex;gap:.55rem;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.45rem .55rem;font-size:.8rem}
.ach .ic{font-size:1.4rem;width:2rem;text-align:center;filter:grayscale(1) opacity(.4)}
.ach.done{border-color:#6a5a2a;background:#241f14}
.ach.done .ic{filter:none}
.ach .nm{font-weight:700}
.ach .ds{color:var(--dim);font-size:.72rem}
.upg-row{display:flex;align-items:center;gap:.5rem;font-size:.8rem}
.upg-row .pips{display:flex;gap:.15rem}
.upg-row .pips i{width:.55rem;height:.55rem;border-radius:.15rem;background:#0b0e12;border:1px solid var(--line2)}
.upg-row .pips i.on{background:var(--accent);border-color:var(--accent)}
.upg-row .nm{flex:1}
.slots{display:flex;gap:.3rem;flex-wrap:wrap}
.slotc{position:relative;width:2.4rem;height:2.4rem;background:#0d1116;border:1px solid var(--line);border-radius:.45rem;overflow:hidden}
.slotc canvas{width:100%;height:100%}
.slotc i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
#menu{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:1rem}
#menu .menu-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(30,40,55,.55),rgba(5,7,10,.88));backdrop-filter:blur(4px)}
.menu-card{position:relative;width:min(34rem,100%);max-height:100%;overflow:auto;background:rgba(19,24,31,.96);border:1px solid var(--line2);border-radius:1.2rem;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:1.6rem;animation:pop .25s var(--ease)}
.menu-card h1{margin:0;font-size:2.6rem;letter-spacing:.14em;text-align:center;background:linear-gradient(180deg,#ffd58a,#f0a53a 55%,#b8741c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.menu-card .tag{text-align:center;color:var(--dim);margin:.2rem 0 1.3rem;font-size:.9rem}
.menu-card .mbtn{display:block;width:100%;margin:.45rem 0;padding:.75rem 1rem;font-size:1rem;border-radius:.7rem}
.menu-card .sub{font-size:.75rem;color:var(--faint);text-align:center;margin-top:1rem}
.menu-card h2{margin:0 0 .8rem}
.wc-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1rem;margin-bottom:1rem}
.wc-grid .full{grid-column:1/-1}
.seg{display:flex;gap:.25rem;flex-wrap:wrap}
.seg button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:.45rem;padding:.35rem .4rem;font-size:.78rem}
.seg button.on{border-color:var(--accent);color:var(--accent);background:#3a2d15}
@media (max-width:640px){.dexwrap{grid-template-columns:1fr}.dex-right{border-left:0;border-top:1px solid var(--line)}.wc-grid{grid-template-columns:1fr}.menu-card h1{font-size:2rem}}

/* error overlay */
#error-overlay{position:fixed;inset:0;z-index:100;background:rgba(8,10,14,.92);display:none;align-items:center;justify-content:center;padding:1rem}
#error-overlay.open{display:flex}
#error-overlay .box{max-width:34rem;background:var(--panel-solid);border:1px solid #6b2c2c;border-radius:1rem;padding:1.2rem}
#error-overlay pre{white-space:pre-wrap;font-size:.72rem;color:#ffb3b3;background:#0b0e12;border-radius:.5rem;padding:.6rem;max-height:12rem;overflow:auto;-webkit-user-select:text;user-select:text}

/* burst particles (screen space UI juice) */
#fx{position:fixed;inset:0;pointer-events:none;z-index:45}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .ibtn span.t{display:none}
  #objective{display:none}
  #st-sci{display:none}
  #st-poll{display:none}
}
@media (max-width:640px){
  html{font-size:calc(12.5px * var(--ui))}
  #topbar{flex-wrap:wrap}
  #power-graph{display:none}
  .pbar{width:4.5rem}
  .tbtns{flex:1;justify-content:flex-end;flex-wrap:wrap}
  .tbtns .ibtn{min-width:2.4rem;height:2.4rem;padding:0 .4rem}
  #side{top:auto;bottom:12.6rem;left:.6rem;right:.6rem;width:auto}
  #minimap{width:7rem;height:7rem}
  #minimap-wrap{position:fixed;right:.6rem;top:6.6rem}
  #inspector{max-height:40vh}
  .bitem{width:3.6rem;height:4rem}
  #build-search{width:6rem}
  #mode-hint{display:none}
  .settings-grid{grid-template-columns:1fr}
  .slots{grid-template-columns:1fr}
  #tut{top:auto;bottom:12.6rem;right:.6rem;max-width:none}
}
@media (pointer:coarse){ #tool-draw{display:flex!important} }
</style>
</head>

<script>
'use strict';
/* =====================================================================
   FORGELINE — a top-down factory automation game in one file.
   Sections:
     1. CONFIG & DATA TABLES   6. RENDERER
     2. UTILITIES              7. UI
     3. WORLD                  8. AUDIO
     4. SIMULATION             9. SAVE / LOAD
     5. INPUT & TOOLS         10. BOOT
   ===================================================================== */

/* =====================================================================
   1. CONFIG & DATA TABLES — all game content lives here.
   Append new items / buildings at the END of their tables: saves store
   indices, so existing entries must keep their positions.
   ===================================================================== */
const SAVE_VERSION = 4;
const SAVE_KEY = 'forgeline.auto', SLOT_KEY = 'forgeline.slot', SETTINGS_KEY = 'forgeline.settings', META_KEY = 'forgeline.meta';
const TPS = 20, DT = 1 / TPS;                 // fixed simulation rate
const TILE = 32, CHUNK = 16;                  // world px per tile, tiles per render/pollution chunk
let MAP_W = 384, MAP_H = 384;                 // world size in tiles (chosen at world creation)
let CHUNKS_X = MAP_W / CHUNK, CHUNKS_Y = MAP_H / CHUNK;
const MAP_SIZES = [{ id: 256, name: 'Small (256²)' }, { id: 384, name: 'Medium (384²)' }, { id: 512, name: 'Huge (512²)' }];
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1]; // 0=E 1=S 2=W 3=N (clockwise, y down)
const DIR_NAMES = ['East', 'South', 'West', 'North'];

/* ---------- BALANCE TABLE (the knobs) ----------
   Early pacing target: first shipment (~$60) inside the first minute, first
   automated line at 3–4 min, first research around minute 5–8. Buildings are
   deliberately pricey; contracts, shipping bonuses and new product lines pay for them. */
const BALANCE = {
  startCash: 150,
  startKit: { miner1: 2, belt1: 40, smelter: 1, lab: 1 },  // free starter buildings (never soft-locked)
  refundRate: 1.0,            // demolish refund (fraction of what was paid)
  handMineCooldown: 0.12,     // seconds between hand-mine clicks
  valueMarkup: 1.3,           // crafted item value = Σinputs × markup + time × valuePerSec
  valuePerSec: 0.5,
  beltSpacing: 0.34,          // min gap between items on a belt (tiles) → ~3 items/tile
  priceDrop: 0.0125,          // per-sale drop of the price factor, ÷ market volume
  priceRecover: 0.05,         // fraction of the gap back to 100% recovered per second
  priceFloor: 0.3,            // prices never fall below 30% of base
  marketVolume: 8,            // items/s a $1 item can be sold before prices sag (÷ √value)
  coalFuelCrafts: 4,          // furnace/kiln crafts per coal (charcoal = 3)
  hubCap: 40, hubShipTime: 4, hubAutoShip: 45,   // Market Hub: items per truck, seconds loading, idle auto-ship
  depotCap: 80,
  contractMinutes: 10,
  rpPerSqrtValue: 2, rpScienceMul: 6,             // research points per item fed to a lab
  pollAbsorb: 0.05, pollGrassAbsorb: 0.45,        // pollution units/s absorbed per chunk (+ × grass fraction)
  pollDiffuse: 0.04, pollTaxPer: 25000, pollTaxMax: 0.3,
  offlineCapHours: 2, offlineEff: 0.5,
  rebirthMin: 1e6, rebirthSellBonus: 0.25, rebirthSpeedBonus: 0.10,
  finalMatterMul: 25,         // Final Matter is worth 25× its ingredients — the most valuable thing in the game
  eventMinSec: 150, eventMaxSec: 330,
  dayLength: 480,             // seconds for a full day/night cycle

function mulberry32(a) {

    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);

}

}

    const r = mulberry32(seed);

    const p = new Uint16Array(256);
    for (let i = 0; i < 256; i++) { p[i] = i; this.val[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
    for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
  }
  n(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const P = this.perm, V = this.val, X = xi & 255, Y = yi & 255;
    const a = V[P[P[X] + Y]], b = V[P[P[X + 1] + Y]], c = V[P[P[X] + Y + 1]], d = V[P[P[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  fbm(x, y, oct) {
    let s = 0, amp = 0.5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { s += this.n(x * f, y * f) * amp; norm += amp; amp *= 0.5; f *= 2.03; }

    s = (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString()) + SUFFIX[k];

  idx: i, id: d[0], craft: d[1], time: d[2], tech: d[5], big: !!d[6],
  inp: Object.entries(d[3]).map(([k, v]) => [II[k], v]),
  out: Object.entries(d[4]).map(([k, v]) => [II[k], v]),

const RI = {}; RECIPES.forEach(r => { RI[r.id] = r.idx; });
const RECIPE_NEED = RECIPES.map(r => { const a = new Int32Array(NI); r.inp.forEach(([i, n]) => { a[i] = n; }); return a; });
const CRAFT_RECIPES = {}; RECIPES.forEach(r => { (CRAFT_RECIPES[r.craft] || (CRAFT_RECIPES[r.craft] = [])).push(r.idx); });

RECIPES.forEach(r => { r.out.forEach(([i]) => MADE_BY[i].push(r.idx)); r.inp.forEach(([i]) => { if (!USED_IN[i].includes(r.idx)) USED_IN[i].push(r.idx); }); });

const VALUE = new Float64Array(NI);
ITEMS.forEach(it => { if (it.raw) VALUE[it.idx] = it.raw; });
for (let pass = 0; pass < 12; pass++) {
  RECIPES.forEach(r => {
    if (r.out.every(([i]) => VALUE[i])) return;
    if (!r.inp.every(([i]) => VALUE[i])) return;
    let s = 0; r.inp.forEach(([i, n]) => { s += VALUE[i] * n; });
    const total = s * BALANCE.valueMarkup + r.time * BALANCE.valuePerSec;
    let outs = 0; r.out.forEach(([, n]) => { outs += n; });

  cx: MAP_W >> 1, cy: MAP_H >> 1,

  version: 0,                         // bumps when terrain regenerates (render caches)

  inb(x, y) { return x >= 0 && y >= 0 && x < MAP_W && y < MAP_H; },
  entAt(x, y) {
    if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return null;

  zoneOf(x, y) { return Math.hypot(x - this.cx, y - this.cy) / (MAP_W * 0.5 * 0.95); },

/* per-building upgrade helpers */

/* ---------- Statistics (per-item production/consumption, 5 min history) ---------- */
const HIST = 300;
const Stats = {
  prodSec: new Float64Array(NI), consSec: new Float64Array(NI),
  prodHist: new Float32Array(NI * HIST), consHist: new Float32Array(NI * HIST), head: 0,
  producedLife: new Float64Array(NI), consumedLife: new Float64Array(NI),
  playTime: 0, cropsLife: 0, handMined: 0, upgradesBought: 0, caveBuilt: false,
  prod(i, n) { this.prodSec[i] += n; this.producedLife[i] += n; if (!Dex.seen[i]) Dex.mark(i); },
  cons(i, n) { this.consSec[i] += n; this.consumedLife[i] += n; },
  second() {
    const h = this.head;
    for (let i = 0; i < NI; i++) {
      this.prodHist[i * HIST + h] = this.prodSec[i]; this.consHist[i * HIST + h] = this.consSec[i];

  rate(arr, i, secs) {

    return s / secs * 60;
  },
  reset() {
    this.prodSec.fill(0); this.consSec.fill(0); this.prodHist.fill(0); this.consHist.fill(0);
    this.producedLife.fill(0); this.consumedLife.fill(0); this.head = 0; this.playTime = 0;

/* ---------- Item Dex (discoveries persist across relocations) ---------- */
const Dex = {

  mark(i) { this.seen[i] = 1; Bus.emit('discover', i); },

/* ---------- Pollution: one cell per 16×16 chunk, diffuses and is absorbed by grass & trees ---------- */
const Pollution = {
  grid: new Float32Array(1), tmp: new Float32Array(1), farm: new Float32Array(1),
  total: 0, scrubbed: 0, tax: 0, hist: new Float32Array(120), hhead: 0,
  resize() { const n = CHUNKS_X * CHUNKS_Y; this.grid = new Float32Array(n); this.tmp = new Float32Array(n); this.farm = new Float32Array(n); },
  reset() { this.grid.fill(0); this.total = 0; this.tax = 0; this.hist.fill(0); },
  idx(e) { return (((e.y + (e.h >> 1)) / CHUNK) | 0) * CHUNKS_X + (((e.x + (e.w >> 1)) / CHUNK) | 0); },
  add(e, v) { if (v > 0 && World.opts.pollution) this.grid[this.idx(e)] += v; },
  at(e) { return this.grid[this.idx(e)]; },
  growMul(e) { return 1 / (1 + this.at(e) / 300); },
  second() {
    const g = this.grid, t = this.tmp, W = CHUNKS_X, H = CHUNKS_Y, D = BALANCE.pollDiffuse;

      const i = y * W + x, v = t[i];

        const s = v * D;

      }
    }

/* ---------- Economy: dynamic prices, shipments, contracts ---------- */
const Econ = {
  cash: 0, lifetime: 0, runEarned: 0,

  hist: new Float32Array(NI * 60), hhead: 0,
  soldItem: new Float64Array(NI), soldTotal: 0,

  sell(i, mult) {
    const p = this.price(i) * (mult || 1);
    this.cash += p; this.lifetime += p; this.runEarned += p; this.earnSec += p; this.soldSec++;
    this.soldItem[i]++; this.soldTotal++;
    const f = this.factor[i] - BALANCE.priceDrop / VOL[i];

  },
  newContract() {
    const cand = [];

    if (!cand.length) cand.push(II.iron_ore, II.iron_plate, II.copper_ore);
    const others = this.contracts.map(c => c && c.item);

    for (let t = 0; t < 6 && others.includes(it); t++) it = cand[(Math.random() * cand.length) | 0];

  second() {

    for (let i = 0; i < L.junction.length; i++) tickJunction(L.junction[i]);
    for (let i = 0; i < L.unloader.length; i++) tickUnloader(L.unloader[i]);
    for (let i = 0; i < L.miner.length; i++) tickMiner(L.miner[i]);
    for (let i = 0; i < L.farm.length; i++) tickFarm(L.farm[i]);
    for (let i = 0; i < L.machine.length; i++) tickMachine(L.machine[i]);
    for (let i = 0; i < L.lab.length; i++) tickLab(L.lab[i]);

/* ---------- Goals ---------- */
const Goals = {
  done: {},
  progress(g) {
    switch (g.type) {
      case 'soldAny': return Econ.soldTotal;
      case 'sold': return Econ.soldItem[II[g.item]];
      case 'earned': return Econ.runEarned;
      case 'research': return Research.count;
      case 'built': return Sim.countKind(g.kind);
      case 'produced': return Stats.producedLife[II[g.item]];
      case 'power': return Power.prod;
      case 'rate': return Econ.perMin;
      case 'sellrate': return Econ.sellRate;
      case 'rp': return Research.rpLife;
      case 'contracts': return Econ.contractsDone;
      case 'tech': return Research.has(g.tech) ? 1 : 0;
      case 'shipments': return Econ.shipments + Econ.tankers;
      case 'scrubbed': return Pollution.scrubbed;

  active(n) { const a = []; for (const g of GOAL_DEFS) { if (!this.done[g.id]) { a.push(g); if (a.length >= n) break; } } return a; },
  check() {
    for (const g of this.active(3)) {

};

/* ---------- Construction rules, placement, undo/redo ---------- */
const CHK = { ok: false, reason: '', replace: null, cost: 0, same: false };
const Build = {
  kit: {},
  unlocked(type) { return Research.has(BUILDINGS[type].tech); },
  price(type) { return (this.kit[type] | 0) > 0 ? 0 : BUILDINGS[type].cost; },
  anchor(type, tx, ty) { const s = BUILDINGS[type].size; const o = (s - 1) >> 1; return [tx - o, ty - o]; },
  tunnelMode(x, y, rot, type) {
    const range = BUILDINGS[type || 'tunnel2'].range;
    for (let k = 1; k <= range + 1; k++) {
      const o = World.entAt(x - DX[rot] * k, y - DY[rot] * k);
      if (o && o.def.kind === 'tunnel' && o.rot === rot) return o.mode === 0 && k <= o.def.range + 1 ? 1 : 0;
    }
    return 0;
  },
  // check(type, x, y, rot, spent) → CHK (reused object). `spent` = cash already committed in this gesture.
  check(type, x, y, rot, spent = 0, free = false) {
    const def = BUILDINGS[type], s = def.size;
    CHK.ok = false; CHK.replace = null; CHK.cost = 0; CHK.same = false;
    if (!this.unlocked(type)) { CHK.reason = `Locked — research ${TECH[def.tech].name}`; return CHK; }
    if (x < 0 || y < 0 || x + s > MAP_W || y + s > MAP_H) { CHK.reason = 'Outside the map'; return CHK; }
    let ores = 0, oil = 0, water = 0, rock = 0, grass = 0;
    for (let yy = y; yy < y + s; yy++) for (let xx = x; xx < x + s; xx++) {
      const i = yy * MAP_W + xx, t = World.terr[i];
      if (t === T_CLIFF) { CHK.reason = 'Cave wall — tunnel under it with an Underground Belt'; return CHK; }
      if (t === T_WATER) { if (!def.water) { CHK.reason = 'Can’t build on water'; return CHK; } water++; }
      if (t === T_ROCK || t === T_CAVE) rock++; if (t === T_GRASS) grass++;
      const id = World.occ[i];
      if (id) {
        const o = Sim.ents.get(id);
        if (def.kind === 'belt' && o.def.kind === 'belt' && s === 1) {
          if (o.type === type && o.rot === rot) { CHK.reason = 'Already built'; CHK.same = true; return CHK; }
          CHK.replace = o;
        } else { CHK.reason = `Blocked by ${o.def.name}`; return CHK; }
      }
      const r = World.res[i]; if (r === RES_OIL) oil++; else if (r) ores++;
    }
    if (def.kind === 'miner') {
      if (def.water && !water) { CHK.reason = 'Must overlap water'; return CHK; }
      if (def.deep && rock * 2 < s * s) { CHK.reason = 'Needs mostly rock or cave floor (bedrock)'; return CHK; }
      if (def.oil && !oil) { CHK.reason = 'Must be placed on an oil seep'; return CHK; }
      if (!def.oil && !def.water && !def.deep && !def.giga && !ores) { CHK.reason = 'Must be placed on ore'; return CHK; }
    }
    if (def.kind === 'farm' && grass * 2 < s * s) { CHK.reason = 'Needs mostly grass'; return CHK; }
    const cost = free ? 0 : this.price(type) - (CHK.replace ? CHK.replace.paid * BALANCE.refundRate : 0);
    if (!free && cost > 0 && Econ.cash - spent < cost - 1e-9) { CHK.reason = `Need ${fmtMoney(cost)} (have ${fmtMoney(Math.max(0, Econ.cash - spent))})`; CHK.cost = cost; return CHK; }
    CHK.ok = true; CHK.reason = ''; CHK.cost = Math.max(0, cost);
    return CHK;
  },
  // place(): assumes check() passed. Returns the new entity.
  place(type, x, y, rot, opt = {}) {
    const def = BUILDINGS[type];
    let carried = null;
    const old = World.entAt(x, y);
    if (old && def.kind === 'belt' && old.def.kind === 'belt') {
      if (old.n) carried = old;
      History.recDel(snapEnt(old));
      this.demolish(old, true);
    }
    const e = makeEntity(type, x, y, rot);
    if (def.kind === 'tunnel') e.mode = opt.mode !== undefined ? opt.mode : this.tunnelMode(x, y, rot, type);
    if (!opt.free) {
      if ((this.kit[type] | 0) > 0 && !opt.noKit) { this.kit[type]--; e.kit = true; e.paid = 0; }
      else { Econ.cash -= def.cost; e.paid = def.cost; }
    } else if (opt.paid !== undefined) { e.paid = opt.paid; e.kit = !!opt.kit; }
    if (carried) {
      e.n = carried.n;
      for (let i = 0; i < carried.n; i++) { e.ty[i] = carried.ty[i]; e.p[i] = carried.p[i]; e.pp[i] = carried.p[i]; }
    }
    if (!opt.quiet) e.born = Render.now;
    Sim.add(e);
    if (!Stats.caveBuilt && World.inCave(e)) Stats.caveBuilt = true;
    if (!opt.noHistory) History.recAdd(e);
    if (!opt.quiet) Bus.emit('placed', e);
    return e;
  },
  demolish(e, silent) {
    if (e.kit) this.kit[e.type] = (this.kit[e.type] | 0) + 1;
    else if (e.paid) Econ.cash += e.paid * BALANCE.refundRate;
    Sim.remove(e);
    if (!silent) Bus.emit('removed', e);
  },
  canDemolish(e) {
    if (e.type === 'sell' && Sim.countType('sell') <= 1) return 'Can’t remove your last Market Hub';
    return '';
  },
};

    case 'belt': if (o.i) { e.n = 0; for (let i = 0; i + 1 < o.i.length && e.n < 4; i += 2) { if (!okItem(o.i[i])) continue; e.ty[e.n] = o.i[i]; e.p[e.n] = e.pp[e.n] = o.i[i + 1]; e.n++; } } break;

const History = {
  undo: [], redo: [], cur: null,
  begin() { this.cur = { add: [], del: [] }; },
  recAdd(e) { if (this.cur) this.cur.add.push(snapEnt(e)); },
  recDel(s) { if (this.cur) this.cur.del.push(s); },
  end() {

    if (g && (g.add.length || g.del.length)) { this.undo.push(g); if (this.undo.length > 150) this.undo.shift(); this.redo.length = 0; }
  },
  apply(rem, res) {
    let need = 0, refund = 0;
    const found = rem.map(s => { const e = World.entAt(s.x, s.y); return e && e.type === s.t && e.x === s.x && e.y === s.y ? e : null; });
    found.forEach(e => { if (e && !e.kit) refund += e.paid * BALANCE.refundRate; });
    const costOf = s => s.k ? BUILDINGS[s.t].cost : (s.p || 0);
    res.forEach(s => { if (!(s.k && (Build.kit[s.t] | 0) > 0)) need += costOf(s); });
    if (Econ.cash + refund < need) { UI.toast(`Need ${fmtMoney(need - refund)} to redo/undo that`, 'bad'); Sfx.play('error'); return false; }
    found.forEach(e => { if (e && !e.dead) Build.demolish(e, true); });
    let blocked = 0;
    res.forEach(s => {
      const def = BUILDINGS[s.t]; let ok = true;
      for (let y = s.y; y < s.y + def.size && ok; y++) for (let x = s.x; x < s.x + def.size; x++) if (!World.inb(x, y) || World.occ[y * MAP_W + x]) { ok = false; break; }

      else { const c = costOf(s); Econ.cash -= c; restoreEnt(Object.assign({}, s, { k: 0, p: c }), true, false); }
      Bus.emit('placed', World.entAt(s.x, s.y), true);

    return true;
  },
  doUndo() {
    const g = this.undo.pop(); if (!g) { UI.toast('Nothing to undo', 'info'); return; }

  },
  doRedo() {

    if (this.apply(g.del, g.add)) { this.undo.push(g); Sfx.play('click'); } else this.redo.push(g);
  },
  clear() { this.undo.length = 0; this.redo.length = 0; this.cur = null; },
};

/* =====================================================================
   5. INPUT — camera, mouse/keyboard/touch, tool state machine
   ===================================================================== */
const Cam = {
  x: MAP_W * TILE / 2, y: MAP_H * TILE / 2, zoom: 1, tz: 1, W: 800, H: 600,

  wy(sy) { return (sy - this.H / 2) / this.zoom + this.y; },
  sx(wx) { return (wx - this.x) * this.zoom + this.W / 2; },
  sy(wy) { return (wy - this.y) * this.zoom + this.H / 2; },
  resize(W, H) {

    this.tz = clamp(this.tz, this.minZ, this.maxZ); this.zoom = clamp(this.zoom, this.minZ, this.maxZ);
  },

  setZoom(z, sx, sy) {

  },

    if (K.has('w') || K.has('arrowup')) iy--; if (K.has('s') || K.has('arrowdown')) iy++;

    }
    if (this.ptrs.size > 2) return;
    const g = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, touch, btn: e.button, mode: 'maybe', long: null };
    if (e.button === 1 || e.button === 2) g.mode = 'pan';
    else if (!touch || this.drawMode) g.mode = Tools.down() ? 'tool' : 'maybe';
    if (touch && g.mode === 'maybe') g.long = setTimeout(() => { if (this.g === g && !g.moved) { g.mode = 'done'; Tools.longPress(); } }, 480);
    this.g = g;
  },
  move(e) {
    if (this.ptrs.has(e.pointerId)) this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    this.mx = e.clientX; this.my = e.clientY; this.over = true;
    if (this.pinch && this.ptrs.size >= 2) {
      const [a, b] = [...this.ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      Cam.x -= (mx - this.pinch.mx) / Cam.zoom; Cam.y -= (my - this.pinch.my) / Cam.zoom;
      const z = clamp(this.pinch.z * d / this.pinch.d, Cam.minZ, Cam.maxZ);
      Cam.setZoom(z, mx, my); Cam.tz = z;
      this.pinch.mx = mx; this.pinch.my = my;
      this.updateHover(); return;
    }
    const g = this.g;
    if (g && g.id === e.pointerId) {
      if (!g.moved && Math.hypot(e.clientX - g.sx, e.clientY - g.sy) > (g.touch ? 10 : 5)) { g.moved = true; if (g.long) clearTimeout(g.long); }
      if ((g.mode === 'pan' || g.mode === 'maybe') && g.moved) {
        Cam.x -= (e.clientX - g.lx) / Cam.zoom; Cam.y -= (e.clientY - g.ly) / Cam.zoom; g.mode = 'pan';
      }
      g.lx = e.clientX; g.ly = e.clientY;
    }
    this.updateHover();
    if (g && g.mode === 'tool') Tools.move();
  },
  up(e, cancel) {
    this.ptrs.delete(e.pointerId);
    if (this.pinch) { if (this.ptrs.size < 2) this.pinch = null; this.g = null; return; }
    const g = this.g;
    if (!g || g.id !== e.pointerId) return;
    if (g.long) clearTimeout(g.long);
    this.g = null;
    if (cancel) { if (g.mode === 'tool') Tools.cancelDrag(); return; }
    if (g.mode === 'tool') Tools.up();
    else if (!g.moved && g.mode !== 'done') { if (g.btn === 2) Tools.rightClick(); else if (g.btn === 0 || g.touch) Tools.click(); }
    if (g.touch && e.pointerType !== 'mouse') this.over = false;
  },
  key(e) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) { if (e.key === 'Escape') t.blur(); return; }
    Sfx.unlock();
    const k = e.key.toLowerCase();
    if (Menu.open) { if (k === 'escape') Menu.back(); return; }
    if (UI.modalOpen()) { if (k === 'escape') UI.closeModal(); return; }
    if (e.ctrlKey || e.metaKey) {
      if (k === 'z') { e.preventDefault(); if (e.shiftKey) History.doRedo(); else History.doUndo(); }
      else if (k === 'y') { e.preventDefault(); History.doRedo(); }
      else if (k === 's') { e.preventDefault(); Save.autosave(); UI.toast('Game saved', 'good'); }
      return;
    }
    if (e.altKey) return;
    this.keys.add(k);
    if (k >= '1' && k <= '9') { UI.hotkey(+k); return; }
    switch (k) {
      case 'escape': Tools.escape(); break;
      case 'r': Tools.rotate(e.shiftKey ? -1 : 1); break;
      case 'q': Tools.pipette(); break;
      case 'tab': e.preventDefault(); UI.nextCat(e.shiftKey ? -1 : 1); break;
      case 'x': Tools.set(Tools.mode === 'demolish' ? 'select' : 'demolish'); break;
      case 'c': Tools.set(Tools.mode === 'copy' ? 'select' : 'copy'); break;
      case 'v': Tools.set('paste'); break;
      case 'delete': case 'backspace': Tools.demolishAt(this.tx, this.ty); break;
      case 't': UI.openModal('m-research'); break;
      case 'i': UI.openModal('m-stats'); break;
      case 'k': UI.openModal('m-market'); break;
      case 'g': UI.openModal('m-goals'); break;
      case 'h': UI.openModal('m-dex'); break;
      case 'p': UI.togglePollution(); break;
      case 'o': UI.openModal('m-settings'); break;
      case 'm': UI.toggleMinimap(); break;
      case 'f3': e.preventDefault(); Settings.showFps = !Settings.showFps; Settings.save(); break;
      case ' ': e.preventDefault(); Cam.tz = 1; Cam.ax = Cam.W / 2; Cam.ay = Cam.H / 2; break;
    }
  },
};

/* ---------- Tool state machine: select | build | demolish | copy | paste ---------- */
const LP = { x: new Int16Array(1024), y: new Int16Array(1024), r: new Uint8Array(1024), n: 0 };
const Tools = {
  mode: 'select', type: null, rot: 0, drag: null, bp: null, handT: 0, ghostReason: '',
  set(mode, type) {
    if (mode === 'build' && (!type || !BUILDINGS[type])) mode = 'select';
    if (mode === 'build' && !Build.unlocked(type)) { UI.toast(`Locked — research ${TECH[BUILDINGS[type].tech].name}`, 'bad'); Sfx.play('error'); return; }
    if (mode === 'paste' && !this.bp) { UI.toast('Copy an area first: press C and drag a box', 'info'); mode = 'select'; }
    this.mode = mode; this.type = mode === 'build' ? type : null; this.drag = null;
    UI.onToolChange();
  },
  pick(type) { if (this.mode === 'build' && this.type === type) this.set('select'); else this.set('build', type); Sfx.play('click'); },
  escape() {
    if (this.drag) { this.drag = null; return; }
    if (this.mode !== 'select') this.set('select'); else if (UI.sel) UI.closeInspector(); else Menu.show();
  },
  rotate(d) {
    if (this.mode === 'paste' && this.bp) { const n = (d + 4) % 4; for (let i = 0; i < n; i++) this.rotateBp(); Sfx.play('click'); return; }
    if (this.mode === 'select') {
      const e = World.entAt(Input.tx, Input.ty) || (UI.sel && !UI.sel.dead ? UI.sel : null);
      if (e && DIRECTIONAL[e.def.kind]) { e.rot = (e.rot + d + 4) & 3; Sim.touch(e); e.born = Render.now - 120; Sfx.play('click'); UI.inspectRefresh(); }
      return;
    }
    this.rot = (this.rot + d + 4) & 3; Sfx.play('click');
  },
  pipette() {
    const e = World.entAt(Input.tx, Input.ty);
    if (e) { this.rot = e.rot; if (Build.unlocked(e.type)) this.set('build', e.type); }
  },
  down() {
    const tx = Input.tx, ty = Input.ty;
    switch (this.mode) {
      case 'build': case 'demolish': case 'copy': this.drag = { sx: tx, sy: ty, cx: tx, cy: ty }; return true;
      case 'paste': return true;
    }
    return false;
  },
  move() { if (this.drag) { this.drag.cx = Input.tx; this.drag.cy = Input.ty; } },
  up() {
    const d = this.drag; this.drag = null;
    switch (this.mode) {
      case 'build': if (d) this.commitBuild(d); break;
      case 'demolish': if (d) this.commitDemolish(d); break;
      case 'copy': if (d) this.commitCopy(d); break;
      case 'paste': this.commitPaste(); break;
    }
  },
  click() {
    const tx = Input.tx, ty = Input.ty, d = { sx: tx, sy: ty, cx: tx, cy: ty };
    switch (this.mode) {
      case 'select': this.selectAt(tx, ty); break;
      case 'build': this.commitBuild(d); break;
      case 'demolish': this.commitDemolish(d); break;
      case 'copy': UI.toast(Input.touchUsed ? 'Enable ✎ draw mode, then drag a box to copy' : 'Drag a box to copy', 'info'); break;
      case 'paste': this.commitPaste(); break;
    }
  },
  rightClick() { if (this.mode !== 'select') this.set('select'); else UI.closeInspector(); },
  longPress() { const e = World.entAt(Input.tx, Input.ty); if (e) { UI.inspect(e); Sfx.play('click'); } },
  cancelDrag() { this.drag = null; },

  selectAt(tx, ty) {
    const e = World.entAt(tx, ty);
    if (e) { UI.inspect(e); Sfx.play('click'); return; }
    if (World.inb(tx, ty) && World.res[ty * MAP_W + tx]) { this.handMine(tx, ty); return; }
    UI.closeInspector();
  },
  handMine(tx, ty) {
    const now = performance.now();
    if (now - this.handT < BALANCE.handMineCooldown * 1000) return;
    this.handT = now;
    const it = RES_ITEM[World.res[ty * MAP_W + tx]];
    const v = VALUE[it] * Upg.sell * Upg.hand;
    Econ.earn(v); Stats.prod(it, 1); Stats.handMined++;
    Render.burst((tx + 0.5) * TILE, (ty + 0.5) * TILE, ITEMS[it].color, 7);
    Render.floatText((tx + 0.5) * TILE, ty * TILE, '+' + fmtMoney(v), '#8ee38a');
    Sfx.play('mine');
    Bus.emit('handmine');
  },

  // Build a line (belts: L-shaped path with auto directions; others: repeated along the drag axis)
  linePts(d, type) {
    const def = BUILDINGS[type]; LP.n = 0;
    const push = (x, y, r) => { if (LP.n < 1024) { LP.x[LP.n] = x; LP.y[LP.n] = y; LP.r[LP.n] = r; LP.n++; } };
    const dx = d.cx - d.sx, dy = d.cy - d.sy;
    if (dx === 0 && dy === 0) { const [ax, ay] = Build.anchor(type, d.sx, d.sy); push(ax, ay, this.rot); return; }
    if (def.kind === 'belt') {
      const hf = Math.abs(dx) >= Math.abs(dy);
      const hd = dx > 0 ? 0 : 2, vd = dy > 0 ? 1 : 3, sx = Math.sign(dx), sy = Math.sign(dy);
      if (hf) {
        for (let x = d.sx; ; x += sx) { push(x, d.sy, hd); if (x === d.cx) break; }
        if (dy !== 0) { LP.r[LP.n - 1] = vd; for (let y = d.sy + sy; ; y += sy) { push(d.cx, y, vd); if (y === d.cy) break; } }
      } else {
        for (let y = d.sy; ; y += sy) { push(d.sx, y, vd); if (y === d.cy) break; }
        if (dx !== 0) { LP.r[LP.n - 1] = hd; for (let x = d.sx + sx; ; x += sx) { push(x, d.cy, hd); if (x === d.cx) break; } }
      }
      return;
    }
    const hf = Math.abs(dx) >= Math.abs(dy);
    if (def.kind === 'tunnel') {
      const r = hf ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3);
      const ex = hf ? d.cx : d.sx, ey = hf ? d.sy : d.cy;
      push(d.sx, d.sy, r);
      if (Math.abs(hf ? dx : dy) <= def.range + 1) push(ex, ey, r);
      return;
    }
    const s = def.size, len = hf ? dx : dy, n = Math.floor(Math.abs(len) / s) + 1, sg = Math.sign(len);
    for (let k = 0; k < n; k++) {
      const [ax, ay] = Build.anchor(type, hf ? d.sx + sg * k * s : d.sx, hf ? d.sy : d.sy + sg * k * s);
      push(ax, ay, this.rot);
    }
  },
  commitBuild(d) {
    const type = this.type; if (!type) return;
    this.linePts(d, type);
    History.begin();
    let placed = 0, err = '';
    for (let i = 0; i < LP.n; i++) {
      const c = Build.check(type, LP.x[i], LP.y[i], LP.r[i]);
      if (c.ok) { Build.place(type, LP.x[i], LP.y[i], LP.r[i]); placed++; }
      else if (!c.same) err = c.reason;
    }
    History.end();
    if (placed) {
      Sfx.play('place');
      if (BUILDINGS[type].kind === 'belt') this.rot = LP.r[LP.n - 1];
      if (err && LP.n > 1) UI.toast(`Placed ${placed}, some skipped: ${err}`, 'info');
    } else if (err) { UI.toast(err, 'bad'); Sfx.play('error'); }
    if (BUILDINGS[type] && !(Build.kit[type] > 0) && Econ.cash < BUILDINGS[type].cost && placed) UI.toast('Out of cash for more ' + BUILDINGS[type].name, 'info');
  },
  demolishAt(tx, ty) { this.commitDemolish({ sx: tx, sy: ty, cx: tx, cy: ty }); },
  boxEnts(d, full) {
    const x0 = Math.max(0, Math.min(d.sx, d.cx)), x1 = Math.min(MAP_W - 1, Math.max(d.sx, d.cx));
    const y0 = Math.max(0, Math.min(d.sy, d.cy)), y1 = Math.min(MAP_H - 1, Math.max(d.sy, d.cy));
    const set = new Set();
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const id = World.occ[y * MAP_W + x]; if (!id) continue;
      const e = Sim.ents.get(id);
      if (e && (!full || (e.x >= x0 && e.y >= y0 && e.x + e.w - 1 <= x1 && e.y + e.h - 1 <= y1))) set.add(e);
    }
    return { set, x0, y0, x1, y1 };
  },
  commitDemolish(d) {
    const { set } = this.boxEnts(d, false);
    if (!set.size) return;
    History.begin();
    let n = 0, err = '', refund = 0;
    for (const e of set) {
      const why = Build.canDemolish(e); if (why) { err = why; continue; }
      History.recDel(snapEnt(e));
      refund += e.kit ? 0 : e.paid * BALANCE.refundRate;
      Render.burst((e.x + e.w / 2) * TILE, (e.y + e.h / 2) * TILE, e.def.color, 6 + e.w * 3);
      Build.demolish(e);
      if (UI.sel === e) UI.closeInspector();
      n++;
    }
    History.end();
    if (n) { Sfx.play('demolish'); if (refund > 0 && n > 1) UI.toast(`Removed ${n} buildings, refunded ${fmtMoney(refund)}`, 'info'); }
    if (err) { UI.toast(err, 'bad'); if (!n) Sfx.play('error'); }
  },
  commitCopy(d) {
    const { set, x0, y0, x1, y1 } = this.boxEnts(d, true);
    if (!set.size) { UI.toast('Nothing to copy there', 'info'); return; }
    const items = [];
    for (const e of set) items.push({ t: e.type, dx: e.x - x0, dy: e.y - y0, r: e.rot, cfg: snapEnt(e, false) });
    this.bp = { w: x1 - x0 + 1, h: y1 - y0 + 1, items };
    this.set('paste');
    UI.toast(`Copied ${items.length} buildings — click to paste, R rotates`, 'good');
    Sfx.play('click');
  },
  rotateBp() {
    const bp = this.bp; if (!bp) return;
    for (const it of bp.items) {
      const s = BUILDINGS[it.t].size, ndx = bp.h - (it.dy + s), ndy = it.dx;
      it.dx = ndx; it.dy = ndy; it.r = (it.r + 1) & 3;
    }
    const w = bp.w; bp.w = bp.h; bp.h = w;
  },
  bpOrigin() { return [Input.tx - (this.bp.w >> 1), Input.ty - (this.bp.h >> 1)]; },
  commitPaste() {
    const bp = this.bp; if (!bp) return;
    const [ox, oy] = this.bpOrigin();
    History.begin();
    let placed = 0, skipped = 0, err = '';
    for (const it of bp.items) {
      const c = Build.check(it.t, ox + it.dx, oy + it.dy, it.r);
      if (!c.ok) { if (!c.same) { skipped++; err = c.reason; } continue; }
      const e = Build.place(it.t, ox + it.dx, oy + it.dy, it.r, { mode: it.cfg.m });
      const cfg = Object.assign({}, it.cfg); delete cfg.p; delete cfg.k; delete cfg.u;
      applySnap(e, cfg);
      placed++;
    }
    // fix recorded snapshots so undo/redo keep configs
    if (History.cur) History.cur.add = History.cur.add.map(s => { const e = World.entAt(s.x, s.y); return e ? snapEnt(e, false) : s; });
    History.end();
    if (placed) { Sfx.play('place'); if (skipped) UI.toast(`Pasted ${placed}, skipped ${skipped}: ${err}`, 'info'); }
    else if (err) { UI.toast(err, 'bad'); Sfx.play('error'); }
  },
};

/* =====================================================================
   6a. RENDERER — procedural art. Everything is drawn once into cached
   canvases at boot (buildings, belts, items); only animated overlays are
   drawn per frame. Light comes from the top-left; shadows fall bottom-right.
   ===================================================================== */
const SPR = 64, PAD = 14, BS = 64, BFRAMES = 16;
// mip(img, px): cached half-size copies so heavy downscaling never happens per frame
function mip(img, px) {
  while (img.width > px * 1.6 && img.width > 12) {
    if (!img._half) {
      const h = mkCanvas(img.width / 2, img.height / 2), c = h.getContext('2d');
      c.imageSmoothingQuality = 'high'; c.drawImage(img, 0, 0, h.width, h.height);
      img._half = h;
    }
    img = img._half;
  }
  return img;
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function panel(c, x, y, w, h, r, col, lw = 2) {
  const g = c.createLinearGradient(x, y, x + w * 0.35, y + h);
  g.addColorStop(0, shade(col, 0.16)); g.addColorStop(1, shade(col, -0.2));
  rr(c, x, y, w, h, r); c.fillStyle = g; c.fill();
  c.lineWidth = lw; c.strokeStyle = shade(col, -0.5); c.stroke();
  rr(c, x + 2.5, y + 2.5, w - 5, h - 5, Math.max(1, r - 2)); c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,0.16)'; c.stroke();
}
function inset(c, x, y, w, h, r, col) {
  rr(c, x, y, w, h, r); c.fillStyle = col; c.fill();
  const g = c.createLinearGradient(x, y, x, y + h); g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(0.35, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fill();
  c.lineWidth = 1; c.strokeStyle = 'rgba(255,255,255,0.08)'; c.stroke();
}
function bolts(c, x, y, w, h, d, col) {
  c.fillStyle = col;
  for (const [bx, by] of [[x + d, y + d], [x + w - d, y + d], [x + d, y + h - d], [x + w - d, y + h - d]]) { c.beginPath(); c.arc(bx, by, 2.2, 0, 6.29); c.fill(); }
}
function circle(c, x, y, r, fill, stroke, lw) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw || 1.5; c.strokeStyle = stroke; c.stroke(); } }
function ball(c, x, y, r, col) {
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, shade(col, 0.45)); g.addColorStop(0.6, col); g.addColorStop(1, shade(col, -0.4));
  circle(c, x, y, r, g, shade(col, -0.55), 1.5);
}
function stripes(c, x, y, w, h, a, b, sw = 8) {
  c.save(); rr(c, x, y, w, h, 3); c.clip(); c.fillStyle = a; c.fillRect(x, y, w, h); c.strokeStyle = b; c.lineWidth = sw / 2;
  for (let k = -h; k < w + h; k += sw) { c.beginPath(); c.moveTo(x + k, y + h); c.lineTo(x + k + h, y); c.stroke(); }
  c.restore();
}
function gearPath(c, cx, cy, r, teeth, rot, depth = 0.22) {
  c.beginPath();
  const n = teeth * 2;
  for (let i = 0; i <= n * 2; i++) {
    const a = rot + i / (n * 2) * Math.PI * 2;
    const t = (i % 4); const rad = t === 0 || t === 1 ? r : r * (1 - depth);
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}
function arrowHead(c, x, y, ang, s, col) {
  c.save(); c.translate(x, y); c.rotate(ang); c.beginPath(); c.moveTo(s, 0); c.lineTo(-s * 0.6, -s * 0.8); c.lineTo(-s * 0.25, 0); c.lineTo(-s * 0.6, s * 0.8); c.closePath();
  c.fillStyle = col; c.fill(); c.restore();
}

/* ---------- building bodies ---------- */
const BodyArt = {
  miner(c, S, def) {
    const col = def.color;
    panel(c, 5, 5, S - 10, S - 10, 10, '#4b5058');
    for (const [x, y] of [[8, 8], [S - 24, 8], [8, S - 24], [S - 24, S - 24]]) panel(c, x, y, 16, 16, 4, col, 1.5);
    c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(24, S / 2 - 3, S - 48, 6); c.fillRect(S / 2 - 3, 24, 6, S - 48);
    const g = c.createRadialGradient(S / 2 - 8, S / 2 - 8, 4, S / 2, S / 2, S * 0.3);
    g.addColorStop(0, shade(col, 0.35)); g.addColorStop(1, shade(col, -0.35));
    circle(c, S / 2, S / 2, S * 0.3, g, shade(col, -0.6), 2);
    circle(c, S / 2, S / 2, S * 0.2, '#1a1c20', 'rgba(255,255,255,0.1)', 1);
    if (def.power) { c.fillStyle = '#ffd54a'; c.beginPath(); c.moveTo(S - 38, 12); c.lineTo(S - 44, 22); c.lineTo(S - 39, 22); c.lineTo(S - 42, 30); c.lineTo(S - 34, 19); c.lineTo(S - 39, 19); c.closePath(); c.fill(); }
  },
  pump(c, S, def) {
    panel(c, 5, 5, S - 10, S - 10, 10, '#3d3448');
    inset(c, 16, 16, S - 32, S - 32, 8, '#241c2b');
    circle(c, S * 0.3, S * 0.7, 10, '#1a1320', '#6b4f8a', 2);
    c.strokeStyle = '#8a8f99'; c.lineWidth = 5; c.beginPath(); c.moveTo(S * 0.35, S * 0.78); c.lineTo(S * 0.52, S * 0.42); c.lineTo(S * 0.69, S * 0.78); c.stroke();
    panel(c, S * 0.62, S * 0.62, 26, 22, 4, def.color, 1.5);
  },
  smelter(c, S) {

const Sprites = {
  body: {}, shadow: {}, belts: [], beltsPlain: [], items: [], glow: null, glowCool: null,
  build() {
    for (const k of BTYPES) {
      const def = BUILDINGS[k];
      if (def.kind === 'belt') continue;
      if (def.kind === 'router' || def.kind === 'junction' || def.kind === 'unloader') {
        for (let r = 0; r < 4; r++) this.body[k + ':' + r] = this.makeBody(def, c => drawRouterArt(c, def, r));
      } else if (def.kind === 'tunnel') {
        for (let m = 0; m < 2; m++) for (let r = 0; r < 4; r++) this.body[k + ':' + m + ':' + r] = this.makeBody(def, c => drawTunnelArt(c, def, r, m));
      } else {
        const fn = BodyArt[def.id] || (def.oil && BodyArt.pump) || (def.craft === 'assemble' && BodyArt.assembler) || BodyArt[def.kind] || BodyArt.assembler;
        this.body[k] = this.makeBody(def, c => fn(c, def.size * SPR, def));
      }
      this.shadow[k] = this.makeShadow(def);
    }
    // belts: [tier][shape][rot][frame]
    ['belt1', 'belt2', 'belt3', 'belt4'].forEach((k, ti) => {
      const def = BUILDINGS[k]; this.belts[ti] = []; this.beltsPlain[ti] = [];
      for (let sh = 0; sh < 3; sh++) {
        const plain = mkCanvas(BS, BS); drawBeltFrame(plain.getContext('2d'), def, sh, -1);
        this.beltsPlain[ti][sh] = [0, 1, 2, 3].map(r => { const cv = mkCanvas(BS, BS), c = cv.getContext('2d'); c.translate(BS / 2, BS / 2); c.rotate(r * Math.PI / 2); c.drawImage(plain, -BS / 2, -BS / 2); return cv; });
        this.belts[ti][sh] = [[], [], [], []];
        for (let f = 0; f < BFRAMES; f++) {
          const base = mkCanvas(BS, BS); drawBeltFrame(base.getContext('2d'), def, sh, f / BFRAMES);
          for (let r = 0; r < 4; r++) {
            if (r === 0) { this.belts[ti][sh][0][f] = base; continue; }
            const cv = mkCanvas(BS, BS), c = cv.getContext('2d');
            c.translate(BS / 2, BS / 2); c.rotate(r * Math.PI / 2); c.drawImage(base, -BS / 2, -BS / 2);
            this.belts[ti][sh][r][f] = cv;
          }
        }
      }
      def.tierIdx = ti;
    });
    // items with baked soft shadow
    for (const it of ITEMS) {
      const cv = mkCanvas(ITEM_PX + 6, ITEM_PX + 6), c = cv.getContext('2d');
      const tmp = mkCanvas(ITEM_PX, ITEM_PX); drawItemShape(tmp.getContext('2d'), it, ITEM_PX);
      c.save(); c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 3; c.shadowOffsetX = 1.5; c.shadowOffsetY = 2; c.drawImage(tmp, 2, 2); c.restore();

    }

  },
  makeBody(def, fn) {
    const S = def.size * SPR, cv = mkCanvas(S, S);
    fn(cv.getContext('2d'));
    return cv;
  },
  makeShadow(def) {
    const S = def.size * SPR, cv = mkCanvas(S + PAD * 2, S + PAD * 2), c = cv.getContext('2d');
    c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 12; c.shadowOffsetX = 6; c.shadowOffsetY = 7;

  },
  makeGlow(rgb) {

    const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, `rgba(${rgb},0.9)`); g.addColorStop(0.35, `rgba(${rgb},0.35)`); g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g; c.fillRect(0, 0, 64, 64); return cv;
  },
  bodyOf(e) {
    const k = e.def.kind;
    if (k === 'router' || k === 'junction' || k === 'unloader') return this.body[e.type + ':' + (k === 'junction' ? 0 : e.rot)];
    if (k === 'tunnel') return this.body[e.type + ':' + (e.mode | 0) + ':' + e.rot];
    return this.body[e.type];
  },
  bodyFor(type, rot, mode) {
    const k = BUILDINGS[type].kind;
    if (k === 'router' || k === 'junction' || k === 'unloader') return this.body[type + ':' + (k === 'junction' ? 0 : rot)];
    if (k === 'tunnel') return this.body[type + ':' + (mode | 0) + ':' + rot];

    if (!Settings.particles) return;
    const cols = ['#f0a53a', '#57cf79', '#4fb0d8', '#e0524f', '#c7b4ff', '#fff'];
    for (let i = 0; i < 70; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, s = 250 + Math.random() * 450; this.conf.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: Math.random() * 6, vr: (Math.random() - 0.5) * 12, l: 1.6 + Math.random(), c: cols[i % cols.length] }); }
  },
  drawFx(dt) {
    const c = this.fxc;
    if (!this.conf.length) { if (this.fxDirty) { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.fx.width, this.fx.height); this.fxDirty = false; } return; }
    this.fxDirty = true;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); c.clearRect(0, 0, this.W, this.H);
    for (let i = this.conf.length - 1; i >= 0; i--) {
      const p = this.conf[i]; p.l -= dt; if (p.l <= 0) { this.conf.splice(i, 1); continue; }
      p.vy += 700 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      c.save(); c.globalAlpha = Math.min(1, p.l); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-4, -2.5, 8, 5); c.restore();
    }
  },
};

   7. UI — DOM panels, tooltips, modals, HUD (throttled to ~10 Hz)
   ===================================================================== */
const Settings = {
  KEYS: ['master', 'music', 'sfx', 'quality', 'particles', 'shadows', 'daynight', 'events', 'uiScale', 'colorblind', 'autosave', 'showFps', 'grid', 'minimap', 'tutorial'],
  master: 0.7, music: 0.35, sfx: 0.8, quality: 'high', particles: true, shadows: true, daynight: true, events: true,
  uiScale: 1, colorblind: false, autosave: 30, showFps: false, grid: true, minimap: true, tutorial: true,
  load() {
    try { const o = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); for (const k of this.KEYS) if (o[k] !== undefined && typeof o[k] === typeof this[k]) this[k] = o[k]; } catch (_) { /* defaults */ }
    try { if (window.matchMedia && matchMedia('(pointer:coarse)').matches && !localStorage.getItem(SETTINGS_KEY)) this.quality = 'medium'; } catch (_) { /* ignore */ }
    this.apply();
  },
  save() { try { const o = {}; for (const k of this.KEYS) o[k] = this[k]; localStorage.setItem(SETTINGS_KEY, JSON.stringify(o)); } catch (_) { /* storage full or blocked */ } this.apply(); },
  apply() {
    document.documentElement.style.setProperty('--ui', this.uiScale);
    $('minimap').style.display = this.minimap ? '' : 'none';
    $('mm-toggle').textContent = this.minimap ? '▾' : '▸';
    $('fps').style.display = this.showFps ? '' : 'none';
    Sfx.setVolumes();
  },
};

  W() { return window.innerWidth; }, H() { return window.innerHeight; },
  onScreen(e) { const sx = Cam.sx((e.x + e.w / 2) * TILE), sy = Cam.sy((e.y + e.h / 2) * TILE); return sx > -80 && sy > -80 && sx < this.W() + 80 && sy < this.H() + 80; },
  icon(i, px = 40) { return `<canvas data-item="${i}" width="${px}" height="${px}"></canvas>`; },

  toast(html, type = '', ms = 2600) {
    const box = $('toasts');
    while (box.children.length > 4) box.firstChild.remove();
    const d = document.createElement('div'); d.className = 'toast ' + type; d.innerHTML = html; box.appendChild(d);
    setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 320); }, ms);
  },
  showTip(html) { const t = $('tooltip'); if (this.tipHtml !== html) { t.innerHTML = html; this.tipHtml = html; } t.classList.add('show'); this.posTip(); },
  hideTip() { $('tooltip').classList.remove('show'); this.tipHtml = ''; },
  posTip() {
    const t = $('tooltip'); if (!t.classList.contains('show')) return;
    const w = t.offsetWidth, h = t.offsetHeight;
    let x = (this.px || 0) + 16, y = (this.py || 0) + 18;
    if (x + w > this.W() - 8) x = (this.px || 0) - w - 12;
    if (y + h > this.H() - 8) y = (this.py || 0) - h - 12;
    t.style.transform = `translate(${Math.max(4, x) | 0}px,${Math.max(4, y) | 0}px)`;
  },
  togglePollution() {
    Render.pollView = !Render.pollView; $('st-poll').classList.toggle('on', Render.pollView);
    this.toast(Render.pollView ? '🌫️ Pollution map on — numbers show pollution per 16×16 area' : 'Pollution map off', 'info'); Sfx.play('click');
  },

  /* ---------- build bar (families with tier drop-downs) ---------- */
  setCat(id) {
    this.cat = id; this.closeFam();
    document.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b.dataset.cat === id && !this.search));
    this.renderBuild();
  },
  nextCat(d) { const i = BUILD_CATS.findIndex(c => c.id === this.cat); this.search = ''; $('build-search').value = ''; this.setCat(BUILD_CATS[(i + d + BUILD_CATS.length) % BUILD_CATS.length].id); },
  famCur(fid) { const f = FAM[fid], s = this.famSel[fid]; return s && f.m.includes(s) ? s : f.m[0]; },
  renderBuild() {
    const box = $('build-items'); box.innerHTML = '';
    document.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b.dataset.cat === this.cat && !this.search));
    const q = this.search;
    const fams = q ? FAMILIES.filter(f => f.m.some(k => BUILDINGS[k].name.toLowerCase().includes(q)) || f.cat.includes(q)) : FAMILIES.filter(f => f.cat === this.cat);
    this.buildBtns = fams.map((f, i) => {
      let k = this.famCur(f.id);
      if (q && !BUILDINGS[k].name.toLowerCase().includes(q)) k = f.m.find(m => BUILDINGS[m].name.toLowerCase().includes(q)) || k;
      const def = BUILDINGS[k], b = document.createElement('button');
      b.className = 'bitem'; b.id = 'bi-' + f.id; b.setAttribute('aria-label', def.name);
      const ic = Sprites.icon(k, 72); b.appendChild(ic);
      const c = document.createElement('span'); c.className = 'c'; b.appendChild(c);
      if (i < 9) { const h = document.createElement('span'); h.className = 'hk'; h.textContent = i + 1; b.appendChild(h); }
      const kit = document.createElement('span'); kit.className = 'kit hidden'; b.appendChild(kit);
      const lk = document.createElement('span'); lk.className = 'lk hidden'; lk.innerHTML = '<svg class="i"><use href="#i-lock"/></svg>'; b.appendChild(lk);
      if (f.m.length > 1) {
        const tn = document.createElement('span'); tn.className = 'tn'; tn.textContent = `${f.m.indexOf(k) + 1}/${f.m.length}`; b.appendChild(tn);
        const fa = document.createElement('span'); fa.className = 'fa'; fa.textContent = '▾'; fa.setAttribute('role', 'button'); fa.title = 'Show all tiers';
        fa.addEventListener('click', ev => { ev.stopPropagation(); Sfx.unlock(); if (this.famOpen === f.id) this.closeFam(); else this.openFam(f.id, b); });
        b.appendChild(fa);
      }
      b.addEventListener('click', () => { Sfx.unlock(); if (!Build.unlocked(k)) { this.toast(`🔒 Research <b>${esc(TECH[def.tech].name)}</b> to unlock ${esc(def.name)}`, 'bad'); Sfx.play('error'); return; } Tools.pick(k); });
      b.addEventListener('pointerenter', () => { this.tipOwner = b; this.showTip(this.buildTip(k)); });
      b.addEventListener('pointerleave', () => { if (this.tipOwner === b) { this.tipOwner = null; this.hideTip(); } });
      box.appendChild(b);
      return { k, b, c, kit, lk, fam: f.id };

  openFam(fid, anchor) {
    const f = FAM[fid], dd = $('famdrop');
    dd.innerHTML = '<div style="font-size:.7rem;color:var(--dim);padding:.1rem .3rem">Choose a tier</div>' + f.m.map(k => {
      const d = BUILDINGS[k], un = Build.unlocked(k), kit = Build.kit[k] | 0;
      return `<button data-k="${k}" class="${this.famCur(fid) === k ? 'on' : ''} ${un ? '' : 'locked'}"><canvas data-b="${k}" width="64" height="64"></canvas><span><b>${esc(d.name)}</b><br><span style="color:var(--dim);font-size:.72rem">${un ? esc(d.desc.split(/\.\s/)[0]) : '🔒 ' + esc(TECH[d.tech].name)}</span></span><span class="c">${kit > 0 ? 'FREE' : fmtMoney(d.cost)}</span></button>`;
    }).join('');
    dd.querySelectorAll('canvas[data-b]').forEach(cv => { const img = Sprites.bodyFor(cv.dataset.b, 0, 0); cv.getContext('2d').drawImage(img, 0, 0, 64, 64); });
    dd.querySelectorAll('button[data-k]').forEach(btn => btn.onclick = () => {
      const k = btn.dataset.k; this.famSel[fid] = k; this.closeFam(); this.renderBuild();
      if (Build.unlocked(k)) Tools.set('build', k); else { this.toast(`🔒 Research <b>${esc(TECH[BUILDINGS[k].tech].name)}</b> first`, 'bad'); Sfx.play('error'); }
      Sfx.play('click');
    });

  closeFam() { $('famdrop').classList.add('hidden'); this.famOpen = null; },
  refreshBuild() {
    for (const it of this.buildBtns) {
      const def = BUILDINGS[it.k], un = Build.unlocked(it.k), kit = Build.kit[it.k] | 0;
      it.b.classList.toggle('locked', !un); it.lk.classList.toggle('hidden', un);
      it.b.classList.toggle('on', Tools.mode === 'build' && Tools.type && BUILDINGS[Tools.type].fam === it.fam);
      const txt = kit > 0 ? 'FREE' : fmtMoney(def.cost);

  hotkey(n) { const it = this.buildBtns[n - 1]; if (it) it.b.click(); },
  buildTip(k) {
    const def = BUILDINGS[k], un = Build.unlocked(k), kit = Build.kit[k] | 0;
    const rows = [];
    rows.push(['Cost', kit > 0 ? `FREE (starter kit ×${kit})` : fmtMoney(def.cost)]);
    rows.push(['Size', `${def.size}×${def.size}`]);
    if (def.kind === 'belt') rows.push(['Throughput', fmtRate(def.speed / SP)], ['Speed', def.speed + ' tiles/s']);
    if (def.kind === 'tunnel') rows.push(['Reach', def.range + ' tiles']);
    if (def.kind === 'miner') rows.push(['Output', def.giga ? `${fmtRate(def.rate * 16 * Upg.mining)} random` : `${fmtRate(def.rate * (def.water ? 1 : Upg.mining))} per ${def.water ? 'water' : def.deep ? 'bedrock' : 'ore'} tile`]);
    if (def.kind === 'machine') rows.push(['Speed', `×${(def.speed * Upg.speed).toFixed(2)}`], ['Crafts', CRAFT_NAMES[def.craft]]);
    if (def.par > 1) rows.push(['Parallel', def.par + ' recipes at once']);
    if (def.kind === 'lab') rows.push(['Studies', `${def.labRate} items/s`], ['Bonus', `×${def.rpMul} RP`]);
    if (def.kind === 'sell') rows.push(['Truck size', fmt(def.cap) + (def.liquid ? ' liquids' : ' items')]);
    if (def.power) rows.push(['Power', fmtPower(def.power)]);
    if (def.out) rows.push(['Generates', fmtPower(def.out)]);
    if (def.fuels) rows.push(['Fuel', Object.keys(def.fuels).map(f => ITEMS[II[f]].name).join(', ')]);
    if (def.poll) rows.push(['Pollution', def.kind === 'gen' ? `${def.poll}/s` : `${def.poll} per ${def.kind === 'miner' ? 'item' : 'craft'}`]);
    if (def.cap && def.kind === 'battery') rows.push(['Capacity', fmt(def.cap / 1000) + ' MJ']);
    if (def.cap && def.kind === 'storage') rows.push(['Capacity', fmt(def.cap * Upg.storage) + ' items']);
    const kv = rows.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('');
    const i = this.buildBtns.findIndex(b => b.k === k);
    return `<h4>${esc(def.name)}${i >= 0 && i < 9 ? ` <kbd>${i + 1}</kbd>` : ''}</h4><div class="d">${esc(def.desc)}</div><div class="kv">${kv}</div>` +
      (FAM[def.fam].m.length > 1 ? `<div class="d" style="margin-top:.35rem">▾ ${FAM[def.fam].m.length} tiers — click the arrow to choose</div>` : '') +
      (un ? '' : `<div class="bad" style="margin-top:.35rem">🔒 Requires research: ${esc(TECH[def.tech].name)}</div>`);

  onToolChange() {
    const m = Tools.mode;
    const map = { select: 'tool-select', demolish: 'tool-demolish', copy: 'tool-copy', paste: 'tool-paste' };
    for (const k in map) $(map[k]).classList.toggle('on', m === k);

      select: '<b>Select</b> · click a building to inspect · click ore to hand-mine · drag to pan',

      demolish: '<b>Demolish</b> · click or drag a box · full refund',
