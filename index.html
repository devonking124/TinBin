  /* ---------- world hover tooltip ---------- */
  worldTip() {
    if (this.tipOwner || !Input.over || Input.mx < 0 || this.famOpen || Input.g && Input.g.mode === 'pan') { if (!this.tipOwner) this.hideTip(); return; }
    let html = '';
    const tx = Input.tx, ty = Input.ty;
    if (Tools.mode === 'build' || Tools.mode === 'paste') {
      if (Tools.ghostReason && !Input.touchUsed) html = `<span class="bad">✖ ${esc(Tools.ghostReason)}</span>`;
      if (Tools.ghostCost > 0) html += `${html ? '<br>' : ''}Total: <b style="color:var(--money)">${fmtMoney(Tools.ghostCost)}</b>`;
    } else if (Tools.mode === 'select' && World.inb(tx, ty)) {
      const e = World.entAt(tx, ty);
      if (e) {
        const k = e.def.kind;
        const st = ['machine', 'miner', 'lab', 'gen', 'farm', 'scrubber', 'sell'].includes(k) ? ` · <span style="color:${ST_INFO[e.status].color}">${ST_INFO[e.status].name}</span>` : '';
        let extra = '';
        if (k === 'machine' && e.recipe >= 0) extra = ` · ${esc(ITEMS[RECIPES[e.recipe].out[0][0]].name)}`;
        if (k === 'miner') extra = ` · ${e.def.giga ? 'Random' : e.ore >= 0 ? esc(ITEMS[e.ore].name) : '—'}`;
        if (k === 'farm') extra = ` · ${esc(ITEMS[e.crop].name)}`;
        if (k === 'belt') extra = ` · ${fmtRate(e.def.speed / SP)}`;
        if (k === 'sell') extra = ` · ${e.invN}/${sellCap(e)}`;
        html = `<b>${esc(e.def.name)}</b>${extra}${st}`;
      } else {
        const i = ty * MAP_W + tx, r = World.res[i], t = World.terr[i];
        if (r) { const it = RES_ITEM[r]; html = `<b>${esc(ITEMS[it].name)}</b> deposit · click to hand-mine (+${fmtMoney(VALUE[it] * Upg.sell * Upg.hand)})`; }
        else if (t === T_CLIFF && Render.ts >= 10) html = 'Cave wall — pass under it with an Underground Belt';
        else if (t === T_CAVE && Render.ts >= 10) html = 'Cave floor — rich ores, bedrock for Deep Drills';
        else if (t === T_WATER && Render.ts >= 12) html = 'Water — pump it with a Water Pump';
      }
    }
    if (html) this.showTip(html); else this.hideTip();

    } else if (k === 'gen') {

      if (def.spent) h += `<div class="d" style="color:var(--dim);font-size:.75rem">Spent rods leave through the front. The reactor stops if 3 pile up.</div>`;

    } else if (k === 'battery') {
      h += `<div class="kv"><span>Charge</span><span id="insp-charge"></span><span>Max rate</span><span>${fmtPower(def.rate)}</span></div>`;
    } else if (k === 'pole') {
      h += `<div class="kv" id="insp-net"></div>`;
    } else if (k === 'lab') {
      h += `<div class="kv"><span>Research rate</span><span id="insp-rprate"></span><span>Bonus</span><span>×${def.rpMul} RP</span>${def.power ? `<span>Power</span><span>${fmtPower(e.pw)}</span>` : ''}</div><div class="sect">Queued items</div><div class="bufs" id="insp-lab"></div><div class="d" style="color:var(--dim);font-size:.75rem">Every item gives RP ≈ 2×√value. Science packs give 6× more.</div>`;
    } else if (k === 'sell') {
      h += `<div class="d" style="color:var(--dim);font-size:.82rem;line-height:1.4">${def.liquid ? 'Buys liquids only.' : 'Buys everything except liquids.'} Loads a ${def.liquid ? 'tanker' : 'truck'} and ships when full or after ${BALANCE.hubAutoShip}s idle.</div>` +
        `<div class="kv"><span>Load</span><span id="insp-load2"></span><span>Truck value</span><span id="insp-val"></span><span>Last shipment</span><span id="insp-last"></span><span>Income</span><span id="insp-income"></span></div><div class="effbar"><i id="insp-fill"></i></div><div class="bufs" id="insp-inv"></div>` +
        `<div class="row"><button class="btn sm primary" id="insp-ship">🚚 Ship now</button><button class="btn sm" id="insp-market">Market & contracts</button></div>`;
    } else if (k === 'scrubber') {

    }
    if (isConsumer(def) && k !== 'pole') h += `<div class="kv"><span>Grid</span><span id="insp-grid"></span></div>`;
    // per-building upgrades

      for (const u of def.upg) {

        h += `<div class="upg-row" data-tip="${esc(U.desc)}"><span class="nm">${esc(U.name)}</span><span class="pips">${Array.from({ length: U.max }, (_, j) => `<i class="${j < lv ? 'on' : ''}"></i>`).join('')}</span><button class="btn sm ${!max && Econ.cash >= c ? 'primary' : ''}" data-upg="${u}" ${max ? 'disabled' : ''}>${max ? 'MAX' : fmtMoney(c)}</button></div>`;
      }
    }
    h += '<div class="row">';
    if (hasStatus || k === 'solar' || k === 'unloader') h += `<label class="toggle"><input type="checkbox" id="insp-on" ${e.off ? '' : 'checked'}> Enabled</label>`;
    h += '</div><div class="row">';
    if (DIRECTIONAL[k]) h += `<button class="btn sm" id="insp-rot"><svg class="i"><use href="#i-rotate"/></svg> Rotate</button>`;
    if (def.upgrade) {
      const up = BUILDINGS[def.upgrade], un = Build.unlocked(def.upgrade), cost = up.cost - (e.kit ? 0 : e.paid * BALANCE.refundRate);
      h += `<button class="btn sm ${un ? 'primary' : ''}" id="insp-up" ${un ? '' : 'disabled'} data-tip="${un ? 'Replace in place with ' + esc(up.name) : '🔒 ' + esc(TECH[up.tech].name)}">⬆ ${esc(up.name)} ${un ? fmtMoney(Math.max(0, cost)) : ''}</button>`;
    }
    h += `<button class="btn sm danger" id="insp-del"><svg class="i"><use href="#i-hammer"/></svg> Demolish</button></div></div>`;
    el.innerHTML = h;
    const ic = $('insp-icon').getContext('2d'), img = Sprites.bodyOf(e) || Sprites.bodyFor(e.type, e.rot, e.mode);
    ic.drawImage(img, 0, 0, 80, 80);

    $('insp-close').onclick = () => this.closeInspector();
    el.querySelectorAll('[data-recipe]').forEach(b => b.onclick = () => {
      const ri = +b.dataset.recipe, R = RECIPES[ri];
      if (!Research.has(R.tech)) { this.toast(`🔒 Research ${esc(TECH[R.tech].name)} first`, 'bad'); Sfx.play('error'); return; }
      setRecipe(e, ri); Sfx.play('click'); this.renderInspector();
    });
    el.querySelectorAll('[data-crop]').forEach(b => b.onclick = () => {
      const i = +b.dataset.crop, c = CROPS[CROP_IDX.indexOf(i)];
      if (!Research.has(c.tech)) { this.toast(`🔒 Research ${esc(TECH[c.tech].name)} first`, 'bad'); Sfx.play('error'); return; }
      if (e.crop !== i) { e.crop = i; e.prog = 0; e.outN = 0; } Sfx.play('click'); this.renderInspector();
    });
    el.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { e.filter = +b.dataset.filter; Sfx.play('click'); this.renderInspector(); });
    el.querySelectorAll('[data-upg]').forEach(b => b.onclick = () => {
      if (buyUpgrade(e, b.dataset.upg)) { Sfx.play('research'); Render.burst((e.x + e.w / 2) * TILE, (e.y + e.h / 2) * TILE, '#f0a53a', 14); this.renderInspector(); }
      else { this.toast('Not enough cash for that upgrade', 'bad'); Sfx.play('error'); }
    });

    const on = $('insp-on'); if (on) on.onchange = () => { e.off = !on.checked; Sfx.play('click'); };
    const rot = $('insp-rot'); if (rot) rot.onclick = () => { e.rot = (e.rot + 1) & 3; Sim.touch(e); e.born = Render.now - 120; Sfx.play('click'); this.renderInspector(); };
    const up = $('insp-up'); if (up) up.onclick = () => this.upgrade(e);
    const del = $('insp-del'); if (del) del.onclick = () => { Tools.commitDemolish({ sx: e.x, sy: e.y, cx: e.x, cy: e.y }); };
    const mk = $('insp-market'); if (mk) mk.onclick = () => this.openModal('m-market');
    const sh = $('insp-ship'); if (sh) sh.onclick = () => { if (!shipNow(e)) { this.toast(e.shipT > 0 ? 'Already shipping' : 'Nothing to ship yet', 'info'); } };
    this._sig = '';
    this.updateInspector();
  },
  upgrade(e) {
    const to = e.def.upgrade, up = BUILDINGS[to];
    if (!to || !Build.unlocked(to)) return;
    const refund = e.kit ? 0 : e.paid * BALANCE.refundRate, cost = ((Build.kit[to] | 0) > 0 ? 0 : up.cost) - refund;
    if (Econ.cash < cost) { this.toast(`Need ${fmtMoney(cost)} to upgrade`, 'bad'); Sfx.play('error'); return; }
    const snap = snapEnt(e);
    History.begin(); History.recDel(snap);
    Build.demolish(e, true);
    const n = Build.place(to, snap.x, snap.y, snap.r, { mode: snap.m });
    const cfg = Object.assign({}, snap); delete cfg.p; delete cfg.k; delete cfg.t; delete cfg.u;
    applySnap(n, cfg);
    if (History.cur) History.cur.add = [snapEnt(n)];
    History.end();
    Sfx.play('research'); Render.burst((n.x + n.w / 2) * TILE, (n.y + n.h / 2) * TILE, '#ffd54a', 18);
    this.inspect(n);
  },
  updateInspector() {
    const e = this.sel; if (!e) return;
    if (e.dead) { this.closeInspector(); return; }
    const set = (id, v) => { const el = $(id); if (el && el.innerHTML !== String(v)) el.innerHTML = v; };
    const chips = (id, list, f) => { const sig = id + list.map(i => i + ':' + f(i)).join(','); if (this['_s' + id] !== sig) { this['_s' + id] = sig; set(id, list.length ? list.map(i => this.itemChip(i, fmt(f(i)))).join('') : '<span style="color:var(--faint);font-size:.8rem">empty</span>'); const el = $(id); if (el) this.paintIcons(el); } };
    const k = e.def.kind;
    const lamp = $('insp-lamp');
    if (lamp) { const s = ST_INFO[e.status]; lamp.style.background = Settings.colorblind ? s.cb : s.color; set('insp-status', s.name); $('insp-eff').style.width = (clamp(e.eff, 0, 1) * 100).toFixed(0) + '%'; }
    if (k === 'miner') { set('insp-rate', `${fmt(e.def.rate * e.tiles * e.caveMul * (e.def.water ? 1 : Upg.mining) * bSpd(e) * 60)}/min`); set('insp-buf', e.outN); }
    if (k === 'farm') {
      const g = Pollution.growMul(e) * (1 + 0.2 * bLv(e, 'yld')) * (e.grassN / (e.w * e.h)) * (e.water > 0 ? 2 : 1) * (e.fert > 0 ? 2 : 1);
      set('insp-grow', `${fmt(60 / cropTime(e) * g)}/min`); set('insp-water', e.water); set('insp-fert', e.fert);
      set('insp-air', `${Math.round(Pollution.growMul(e) * 100)}% growth`);
    }
    if (k === 'machine') {
      const ins = [], outs = [];
      if (e.recipe >= 0 && !e.def.auto) RECIPES[e.recipe].inp.forEach(([i]) => ins.push(i));
      else for (let i = 0; i < NI; i++) if (e.inb[i] > 0) ins.push(i);
      if (e.def.fuel) for (const f of [COAL, CHARCOAL]) if (!ins.includes(f) && (e.inb[f] > 0 || f === COAL)) ins.push(f);
      for (let i = 0; i < NI; i++) if (e.outb[i] > 0) outs.push(i);
      chips('insp-in', ins, i => e.inb[i]); chips('insp-out', outs, i => e.outb[i]);
      const sl = $('insp-slots');
      if (sl) {
        const sig = Array.from(e.sr).join(',');
        if (this._slSig !== sig) { this._slSig = sig; sl.innerHTML = Array.from(e.sr).map((r, q) => `<span class="slotc" data-tip="Slot ${q + 1}${r >= 0 ? ': ' + esc(ITEMS[RECIPES[r].out[0][0]].name) : ' idle'}">${r >= 0 ? this.icon(RECIPES[r].out[0][0]) : ''}<i id="insp-sl${q}"></i></span>`).join(''); this.paintIcons(sl); }
        for (let q = 0; q < e.sp.length; q++) { const b = $('insp-sl' + q); if (b) b.style.width = (clamp(e.sp[q], 0, 1) * 100) + '%'; }
      }
      if (e.def.fuel) set('insp-fuel', `${e.fuel} crafts left`);
      set('insp-crafted', fmt(e.crafted));
    }
    if (k === 'belt') set('insp-bitems', e.n);
    if (k === 'router') set('insp-rbuf', e.bn);
    if (k === 'storage') {
      set('insp-store', `${fmt(e.total)} / ${fmt(storeCap(e))}`);
      const list = []; for (let i = 0; i < NI; i++) if (e.store[i] > 0) list.push(i);
      chips('insp-contents', list, i => e.store[i]);
    }
    if (k === 'gen') { set('insp-coal', `${e.fuelN} queued · ${Math.round(e.energy / Math.max(...Object.values(e.def.fuels)) * 100)}% burning`); set('insp-load', Math.round(e.load * 100) + '%'); if (e.def.spent) set('insp-spent', e.spentN); }
    if (k === 'solar') set('insp-solar', fmtPower(e.def.out * (e.def.wind ? Power.wind(e) : Sim.daylight)));
    if (k === 'battery') set('insp-charge', `${fmt(e.charge / 1000)} / ${fmt(e.def.cap / 1000)} MJ`);
    if (k === 'pole') {
      const n = e.net;
      set('insp-net', n ? `<span>Producers</span><span>${n.gens.length + n.solars.length}</span><span>Batteries</span><span>${n.bats.length}</span><span>Consumers</span><span>${n.cons.length}</span><span>Demand</span><span>${fmtPower(n.demand)}</span><span>Satisfaction</span><span>${Math.round(n.sat * 100)}%</span>` : '<span>Network</span><span>—</span>');
    }
    if (k === 'lab') {
      const list = []; for (let i = 0; i < NI; i++) if (e.inb[i] > 0) list.push(i);
      chips('insp-lab', list, i => e.inb[i]);
      let avg = 0; list.forEach(i => { avg += RPV[i] * e.inb[i]; }); avg = e.inN ? avg / e.inN : 0;
      set('insp-rprate', e.inN ? `≈ ${fmt(avg * e.def.labRate * e.def.rpMul * bSpd(e) * 60)} RP/min` : 'idle — feed it items');
    }
    if (k === 'sell') {
      const cap = sellCap(e); let val = 0; const list = [];
      for (let i = 0; i < NI; i++) if (e.inv[i] > 0) { list.push(i); val += Econ.price(i) * e.inv[i]; }
      set('insp-load2', e.shipT > 0 ? `shipping… ${e.shipT.toFixed(1)}s` : `${e.invN} / ${cap}`);
      set('insp-val', '≈ ' + fmtMoney(val * (1 + 0.06 * bLv(e, 'prc')))); set('insp-last', e.lastShip ? fmtMoney(e.lastShip) : '—'); set('insp-income', fmtMoney(Econ.perMin) + '/min');
      $('insp-fill').style.width = (e.shipT > 0 ? 100 : clamp(e.invN / cap, 0, 1) * 100) + '%';
      chips('insp-inv', list, i => e.inv[i]);
    }
    if (k === 'scrubber') { set('insp-air', fmt(Pollution.at(e))); set('insp-res', e.outN); }
    if (isConsumer(e.def) && k !== 'pole') set('insp-grid', e.net ? `${Math.round(e.net.sat * 100)}% satisfied` : '<span style="color:var(--bad)">not connected — add a pole/generator nearby</span>');
  },
};

/* ---------- modals ---------- */
Object.assign(UI, {
  modalOpen() { return !!this.modal; },
  openModal(id) {
    Sfx.unlock(); this.closeFam();
    if (this.modal === id) { this.closeModal(); return; }
    if (this.modal) $(this.modal).classList.remove('open');
    this.modal = id; $('modal-root').classList.add('open'); $(id).classList.add('open');
    this.hideTip();
    ({ 'm-research': () => this.renderResearch(), 'm-stats': () => this.renderStats(), 'm-market': () => this.renderMarket(), 'm-goals': () => this.renderGoals(), 'm-dex': () => this.renderDex(), 'm-settings': () => this.renderSettings() }[id] || (() => { }))();
    Sfx.play('click');
    const f = $(id).querySelector('.close'); if (f) f.focus({ preventScroll: true });
  },

  graph(cv, series, colors, fills, labelFn) {
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth || 300, H = cv.clientHeight || 100;
    if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
    let max = 1e-9; series.forEach(s => { for (const v of s) if (v > max) max = v; });
    max *= 1.15;
    c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 1;
    for (let k = 1; k < 4; k++) { c.beginPath(); c.moveTo(0, H * k / 4); c.lineTo(W, H * k / 4); c.stroke(); }
    series.forEach((s, j) => {
      const n = s.length; if (n < 2) return;
      c.beginPath();
      for (let i = 0; i < n; i++) { const x = i / (n - 1) * W, y = H - 4 - (s[i] / max) * (H - 10); i ? c.lineTo(x, y) : c.moveTo(x, y); }
      if (fills && fills[j]) { c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fillStyle = fills[j]; c.fill(); }
      else { c.strokeStyle = colors[j]; c.lineWidth = 1.8; c.stroke(); }
    });
    if (labelFn) { c.fillStyle = 'rgba(255,255,255,0.55)'; c.font = '11px system-ui,sans-serif'; c.textAlign = 'left'; c.fillText(labelFn(max / 1.15), 6, 13); }
  },
  ringSeries(arr, i, len, head, stride = 1, off = 0, smooth = 1) {
    const out = new Array(len);
    for (let k = 0; k < len; k++) out[k] = arr[(i * len + ((head + k) % len)) * stride + off];
    if (smooth > 1) { const o2 = new Array(len); for (let k = 0; k < len; k++) { let s = 0, n = 0; for (let q = Math.max(0, k - smooth + 1); q <= k; q++) { s += out[q]; n++; } o2[k] = s / n; } return o2; }
    return out;
  },

  /* item dex: every item, discovered count, recipes in & out */
  itemSource(i) {
    const out = [];
    const r = RES.findIndex(x => x && x.item === ITEMS[i].id);
    if (r > 0) {
      const R = RES[r];
      if (R.zone[0] >= 2) out.push('Found only inside caves');
      else out.push(R.zone[0] < 0.1 ? 'Found all over the map' : R.zone[0] < 0.4 ? 'Found away from spawn (frontier)' : 'Found in the far wilds');
      if (R.cave) out.push('Common inside caves');
      out.push(r === RES_OIL ? 'Extract with a Pumpjack' : 'Mine with any drill');
    }
    if (i === II.water) out.push('Water Pump over water');
    if (i === II.wood) out.push('Grown by Tree Farms');
    if (CROP_IDX.includes(i)) out.push('Grown in Planter Boxes');
    if (i === II.bismuth || i === II.iridium) out.push('Deep Core Drill on bedrock' + (i === II.iridium ? ' (far wilds)' : ''));
    if (i === II.residue) out.push('Produced by Air Scrubbers');
    if (i === II.spent_rod) out.push('Ejected by Nuclear Reactors');
    if (ITEMS[i].raw || i === II.iridium || i === II.bismuth) out.push('Giga Drill (random)');
    return out;

  drawPowerGraph() {

    c.clearRect(0, 0, W, H);
    let mx = 1; for (let k = 0; k < n; k++) { const j = ((Power.hhead - n + k + 120) % 120) * 3; mx = Math.max(mx, Power.hist[j], Power.hist[j + 1]); }
    const line = (off, col, fill) => {
      c.beginPath();
      for (let k = 0; k < n; k++) { const j = ((Power.hhead - n + k + 120) % 120) * 3; const v = off === 2 ? Power.hist[j + 2] * mx : Power.hist[j + off]; const x = k / (n - 1) * W, y = H - 2 - v / mx * (H - 5); k ? c.lineTo(x, y) : c.moveTo(x, y); }
      if (fill) { c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fillStyle = col; c.fill(); } else { c.strokeStyle = col; c.lineWidth = 1.5; c.stroke(); }

/* ---------- Tutorial ---------- */
const Tut = {
  step: 0, done: false, glowEl: null, catStep: -1,
  start() { this.step = 0; this.done = false; this.catStep = -1; $('tut').classList.remove('hidden'); this.render(); },
  finish(skipped) {
    this.done = true; $('tut').classList.add('hidden'); $('tut-arrow').classList.add('hidden'); this.unglow();
    if (skipped) UI.toast('Tutorial skipped — restart it any time from Settings', 'info');
  },
  next() {
    this.step++; Sfx.play('click');
    if (this.step >= TUTORIAL.length) { this.finish(); UI.toast('🎓 Tutorial complete! Follow the goals to grow your factory.', 'good'); Render.celebrate(UI.W() / 2, UI.H() / 2); Sfx.play('achieve'); return; }
    this.render();
  },
  render() {
    const s = TUTORIAL[this.step]; if (!s) return;
    $('tut-step').textContent = `Tutorial · step ${this.step + 1} of ${TUTORIAL.length}`;
    $('tut-text').innerHTML = s.text;
    $('tut-next').classList.toggle('hidden', !s.manual);
    $('tut-next').textContent = this.step === TUTORIAL.length - 1 ? 'Finish' : 'Next';
  },
  update() {
    if (this.done || !Settings.tutorial || Menu.open) { $('tut').classList.add('hidden'); $('tut-arrow').classList.add('hidden'); this.unglow(); return; }
    $('tut').classList.remove('hidden');
    const s = TUTORIAL[this.step];
    if (!s) { this.finish(); return; }
    if (s.cond && s.cond()) { this.next(); }
  },
  unglow() { if (this.glowEl) { this.glowEl.classList.remove('tut-glow'); this.glowEl = null; } },
  target() {
    const s = TUTORIAL[this.step]; if (!s) return null;
    let t = s.target;
    if (s.target2 && Tools.mode === 'build' && t === 'build:' + Tools.type) t = s.target2;
    return t;
  },
  frame() {
    const arrow = $('tut-arrow');
    if (this.done || !Settings.tutorial || UI.modal || Menu.open) { arrow.classList.add('hidden'); return; }
    const t = this.target(); if (!t) { arrow.classList.add('hidden'); return; }
    let x, y, up = false, el = null;
    if (t.startsWith('build:')) {
      const type = t.slice(6), fam = BUILDINGS[type].fam;
      el = $('bi-' + fam);
      if (el && UI.famCur(fam) !== type && this.catStep !== this.step + 100) { this.catStep = this.step + 100; UI.famSel[fam] = type; UI.renderBuild(); el = $('bi-' + fam); }
      if (!el && !UI.search && this.catStep !== this.step) { this.catStep = this.step; UI.famSel[fam] = type; UI.setCat(BUILDINGS[type].cat); el = $('bi-' + fam); }
    } else if (t.startsWith('dom:')) el = document.querySelector(t.slice(4));
    if (el) {
      if (this.glowEl !== el) { this.unglow(); el.classList.add('tut-glow'); this.glowEl = el; }
      const r = el.getBoundingClientRect();
      if (r.top < UI.H() / 2) { x = r.left + r.width / 2; y = r.bottom + 22; up = true; } else { x = r.left + r.width / 2; y = r.top - 22; }
    } else {
      this.unglow();
      let wx, wy;
      if (t === 'world:sell') { const s = Sim.lists.sell && Sim.lists.sell.find(e => e.type === 'sell'); if (!s) { arrow.classList.add('hidden'); return; } wx = (s.x + 1.5) * TILE; wy = (s.y + 0.2) * TILE; }
      else {
        const r = RES.findIndex(q => q && 'world:' + q.id === t);
        const p = this._patch && this._patch.r === r && World.res[this._patch.y * MAP_W + this._patch.x] === r ? this._patch : (this._patch = World.nearestPatch(r, World.cx, World.cy));
        if (!p) { arrow.classList.add('hidden'); return; }
        wx = (p.x + 0.5) * TILE; wy = (p.y + 0.5) * TILE;
      }
      x = Cam.sx(wx); y = Cam.sy(wy) - 26;
    }
    const m = 30, cx = clamp(x, m, UI.W() - m), cy = clamp(y, m + 50, UI.H() - m);
    let rot = up ? 180 : 0;
    if (cx !== x || cy !== y) rot = Math.atan2(y - cy, x - cx) * 180 / Math.PI - 90;
    arrow.classList.remove('hidden');
    arrow.style.left = cx + 'px'; arrow.style.top = cy + 'px'; arrow.style.transform = `rotate(${rot}deg)`;
  },
};

/* ---------- Persistent meta: achievements + Dex survive relocations, new worlds and slots ---------- */
const Meta = {

    try {
      const o = JSON.parse(localStorage.getItem(META_KEY) || '{}');

  },
};

/* =====================================================================

const MIGRATIONS = {
  1: o => { o.kit = o.kit || {}; o.v = 2; return o; },
  2: o => { o.rebirth = o.rebirth || { tokens: 0, runs: 0 }; o.v = 3; return o; },
  3: o => { // v3 → v4: keep the original 256² terrain, science packs become research points
    o.opts = Object.assign({}, WORLD_DEFAULTS, { legacy: true, size: 256, caves: 0 });
    let rp = 0; (o.sci || []).forEach((n, j) => { rp += (+n || 0) * RPV[II[SCIENCE[j]]]; });
    o.rp = Math.round(rp); o.rpLife = o.rp + 50 * Object.keys(o.research || {}).length;
    delete o.sci; o.v = 4; return o;
  },
};
const Save = {
  lastAt: 0,
  serialize() {

      if (e.def.kind === 'belt') { bl.push(e); if (e.n) { const a = [e.x, e.y]; for (let i = 0; i < e.n; i++) a.push(e.ty[i], +e.p[i].toFixed(3)); bitems.push(a); } }
      else ents.push(snapEnt(e));
    }

    const horiz = r => r === 0 || r === 2;
    bl.sort((a, b) => a.def.idx - b.def.idx || a.rot - b.rot || (horiz(a.rot) ? a.y - b.y || a.x - b.x : a.x - b.x || a.y - b.y));

      const a = bl[i]; let n = 1;
      while (i + n < bl.length) {
        const b = bl[i + n];
        if (b.type !== a.type || b.rot !== a.rot) break;
        if (horiz(a.rot) ? (b.y !== a.y || b.x !== a.x + n) : (b.x !== a.x || b.y !== a.y + n)) break;
        n++;

      belts.push([a.def.idx, a.rot, a.x, a.y, n]); i += n;
    }

    return {
      v: SAVE_VERSION, at: Date.now(), seed: World.seed, opts: World.opts, time: +Sim.time.toFixed(2),
      cash: Econ.cash, lifetime: Econ.lifetime, runEarned: Econ.runEarned, incomeEma: Econ.incomeEma,
      factor: Array.from(Econ.factor, f => Math.round(f * 1000) / 1000), sold: sp(Econ.soldItem), soldTotal: Econ.soldTotal,
      econ: { hr: Econ.hubReceived, sh: Econ.shipments, tk: Econ.tankers, ws: Econ.weaponsSold, fs: Econ.foodSold, cd: Econ.contractsDone, ct: Econ.contracts.map(c => [ITEMS[c.item].id, c.n, c.got, c.reward, Math.round(c.left)]) },
      produced: sp(Stats.producedLife), consumed: sp(Stats.consumedLife), playTime: Stats.playTime,
      stats: { crops: Stats.cropsLife, hand: Stats.handMined, upg: Stats.upgradesBought, cave: Stats.caveBuilt ? 1 : 0 },
      kit: Build.kit, research: Research.levels, rp: Math.round(Research.rp), rpLife: Math.round(Research.rpLife), goals: Goals.done,
      poll: { g: sparse(Array.from(Pollution.grid, v => Math.round(v))), s: Math.round(Pollution.scrubbed) },

      tut: { step: Tut.step, done: Tut.done }, rebirth: { tokens: Rebirth.tokens, runs: Rebirth.runs },
      events: { next: Math.round(Events.next), vein: Upg.veinT, boom: Econ.boomItem, boomT: Econ.boomT },

  },
  autosave() { if (!Game.ready) return; if (this.write(SAVE_KEY, this.serialize())) this.lastAt = Date.now(); Meta.save(); },

  slotMeta(n) {

  },

  },

  newGame(seed, announce, opts) {

        const bx = x + (rot === 0 || rot === 2 ? k : 0), by = y + (rot === 1 || rot === 3 ? k : 0);
        if (!this.fits(BUILDINGS[type], bx, by)) { bad++; continue; }
        Build.place(type, bx, by, rot, { free: true, paid: BUILDINGS[type].cost, quiet: true, noHistory: true });
      }
    }
    for (const a of o.bitems || []) {
      const e = World.entAt(a[0], a[1]); if (!e || e.def.kind !== 'belt') continue;
      e.n = 0; for (let i = 2; i + 1 < a.length && e.n < 4; i += 2) { if (a[i] >= NI) continue; e.ty[e.n] = a[i]; e.p[e.n] = e.pp[e.n] = a[i + 1]; e.n++; }
    }
    if (!Sim.countType('sell')) Build.place('sell', World.cx - 1, World.cy - 1, 0, { free: true, quiet: true, noHistory: true });
    Sim.relink();
    while (Econ.contracts.length < 3) Econ.contracts.push(Econ.newContract());
    if (o.cam) { Cam.jump(o.cam.x, o.cam.y); Cam.zoom = Cam.tz = clamp(o.cam.z || 1, Cam.minZ, Cam.maxZ); }
    if (o.tut) { Tut.step = o.tut.step | 0; Tut.done = !!o.tut.done; if (!Tut.done && Settings.tutorial) { $('tut').classList.remove('hidden'); Tut.render(); } }
    UI.renderBuild();
    if (bad) UI.toast(`${bad} building(s) couldn’t be restored`, 'bad');
    this.ready = true;
    Meta.save();
    if (offline && o.at) this.offline((Date.now() - o.at) / 1000, Econ.incomeEma);
  },
  fits(def, x, y) {
    for (let yy = y; yy < y + def.size; yy++) for (let xx = x; xx < x + def.size; xx++) {
      if (!World.inb(xx, yy) || World.occ[yy * MAP_W + xx]) return false;
      const t = World.terr[yy * MAP_W + xx];
      if (t === T_CLIFF || (t === T_WATER && !def.water)) return false;
    }
    return true;
  },
  offline(away, ratePerMin) {
    if (away < 60 || ratePerMin <= 0) return;
    const cap = BALANCE.offlineCapHours * 3600, t = Math.min(away, cap);
    const earned = ratePerMin / 60 * t * BALANCE.offlineEff;
    if (earned < 1) return;
    Econ.earn(earned);
    UI.welcome(`<p>You were away for <b>${fmtTime(away)}</b>${away > cap ? ` (capped at ${BALANCE.offlineCapHours} h)` : ''}.</p>` +
      `<p>Your factory kept humming at ${Math.round(BALANCE.offlineEff * 100)}% efficiency, based on your recent income of <b>${fmtMoney(ratePerMin)}/min</b>.</p>` +
      `<p style="font-size:1.3rem">Earned <b style="color:var(--money)">+${fmtMoney(earned)}</b></p><div class="row" style="justify-content:flex-end"><button class="btn primary" data-close>Collect</button></div>`);
    $('welcome-body').querySelector('[data-close]').onclick = () => { UI.closeModal(); Sfx.play('sell'); };
  },
  rebirth() {
    const pend = Rebirth.pending(); if (!pend) return;
    Rebirth.tokens += pend; Rebirth.runs++;
    const lifetime = Econ.lifetime;
    this.newGame((Math.random() * 1e9) >>> 0, false, World.opts.legacy ? WORLD_DEFAULTS : World.opts);
    Econ.lifetime = lifetime;
    Research.refresh();
    UI.toast(`🚀 Relocated! You now hold ${Rebirth.tokens} Relocation Tokens (×${Upg.sell.toFixed(2)} prices, ×${Upg.speed.toFixed(2)} speed).`, 'good', 6000);
    Render.celebrate(UI.W() / 2, UI.H() / 2); Sfx.play('achieve');
    Ach.check(); Save.autosave();
  },
};

let lastT = 0, acc = 0, crashed = false, autoT = 0;
function loop(now) {
  if (crashed) return;
  try {
    let dt = lastT ? (now - lastT) / 1000 : 0; lastT = now;
    if (dt > 0.25) dt = 0.25; if (dt < 0) dt = 0;
    if (!Menu.open) {
      acc += dt;
      let steps = 0;
      while (acc >= DT && steps < 8) { Sim.step(); acc -= DT; steps++; }
      if (steps >= 8) acc = 0;
    } else { Cam.x += dt * 12; }
    Cam.update(dt);
    if (Input.over) Input.updateHover();
    if (Input.g && Input.g.mode === 'tool') Tools.move();
    Render.frame(Math.min(1, acc / DT), dt);
    UI.frame(dt);
    Sfx.frame();
    if (!Menu.open) { autoT += dt; if (autoT >= Settings.autosave) { autoT = 0; Save.autosave(); } }
  } catch (e) { crashed = true; showError(e); return; }
  requestAnimationFrame(loop);
}
function showError(e) {
  try { console.error(e); } catch (_) { /* ignore */ }
  $('error-text').textContent = (e && (e.stack || e.message)) || String(e);
  $('error-overlay').classList.add('open');
}
function boot() {
  $('err-continue').onclick = () => { $('error-overlay').classList.remove('open'); if (crashed) { crashed = false; lastT = 0; requestAnimationFrame(loop); } };
  $('err-reload').onclick = () => location.reload();
  $('err-reset').onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (_) { /* ignore */ } location.reload(); };
  window.addEventListener('error', ev => { if (Game.ready && ev.error) { crashed = true; showError(ev.error); } });
  setMapSize(WORLD_DEFAULTS.size);
  Settings.load();
  Meta.load();
  Sprites.build();
  Render.init();
  UI.init();
  Input.init(Render.cv);
  Research.refresh();
  let loaded = false;
  let raw = null; try { raw = localStorage.getItem(SAVE_KEY); } catch (_) { /* storage blocked */ }
  if (raw) {
    try { Game.load(Save.migrate(JSON.parse(raw)), true); loaded = true; }
    catch (e) {
      console.warn('Save failed to load', e);
      try { localStorage.setItem('forgeline.corrupt', raw); } catch (_) { /* ignore */ }
      UI.toast('Your save couldn’t be loaded, so a new world was started. (A backup was kept.)', 'bad', 6000);
    }
  }
  if (!loaded) Game.newGame((Math.random() * 1e9) >>> 0, false);
  Menu.show('main');
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Save.autosave(); Game.hiddenAt = Date.now(); }
    else if (Game.hiddenAt) { const away = (Date.now() - Game.hiddenAt) / 1000; Game.hiddenAt = 0; lastT = 0; if (!Menu.open) Game.offline(away, Econ.incomeEma); }
  });
  window.addEventListener('pagehide', () => Save.autosave());
  window.addEventListener('beforeunload', () => Save.autosave());
  requestAnimationFrame(loop);
}
try { boot(); } catch (e) { crashed = true; showError(e); }
</script>
</body>
</html>
