<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<title>Forgeline — Factory Automation</title>
<style>
:root{
  --ui:1;
  --bg:#0f1318; --panel:rgba(19,24,31,.94); --panel-solid:#161c24; --panel2:#1f2731; --panel3:#28323e;
  --line:#2c3743; --line2:#3a4757; --text:#e8eef4; --dim:#95a3b4; --faint:#5e6c7d;
  --accent:#f0a53a; --accent-d:#b8741c; --blue:#4fb0d8; --good:#57cf79; --warn:#f1c84b; --bad:#ee5d5d;
  --money:#8ee38a; --sci0:#e0524f; --sci1:#4fc46a; --sci2:#4f8fe0;
  --shadow:0 8px 28px rgba(0,0,0,.45); --ease:cubic-bezier(.2,.8,.2,1);
}
html{font-size:calc(14px * var(--ui))}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
  -webkit-font-smoothing:antialiased}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
canvas#game:focus-visible{outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

/* ---------- top bar ---------- */
#topbar{position:fixed;left:.6rem;right:.6rem;top:.6rem;display:flex;gap:.45rem;align-items:stretch;pointer-events:none;z-index:10}
#topbar>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.35rem .7rem;display:flex;align-items:center;gap:.55rem;box-shadow:var(--shadow);backdrop-filter:blur(6px);min-height:2.7rem}
.chip .lbl{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;line-height:1}
.chip b{font-variant-numeric:tabular-nums}
#cash{font-size:1.25rem;color:var(--money);line-height:1.1}
#income{font-size:.78rem;color:var(--dim);font-variant-numeric:tabular-nums}
.col{display:flex;flex-direction:column;justify-content:center}
.pbar{height:.35rem;border-radius:.2rem;background:#0b0e12;overflow:hidden;margin-top:.2rem;width:6.5rem}
.pbar i{display:block;height:100%;width:0;background:var(--good);transition:width .25s var(--ease),background .25s}
#power-text{font-size:.85rem}
#power-graph{width:5.5rem;height:1.9rem;border-radius:.3rem;background:#0b0e12}
.sci{display:flex;align-items:center;gap:.2rem;font-size:.85rem;font-variant-numeric:tabular-nums}
.sci .dot{width:.6rem;height:.8rem;border-radius:.15rem .15rem .35rem .35rem}
#objective{flex:1;min-width:0;cursor:pointer}
#objective .col{min-width:0;flex:1}
#obj-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
#obj-bar{height:.3rem;background:#0b0e12;border-radius:.2rem;overflow:hidden;margin-top:.25rem}
#obj-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s var(--ease)}
.tbtns{display:flex;gap:.3rem}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;min-width:2.7rem;height:2.7rem;display:flex;align-items:center;justify-content:center;gap:.35rem;padding:0 .6rem;box-shadow:var(--shadow);transition:background .15s,border-color .15s,transform .15s var(--ease);position:relative}
.ibtn:hover{background:var(--panel3);border-color:var(--line2)}
.ibtn:active{transform:scale(.95)}
.ibtn.on{border-color:var(--accent);color:var(--accent)}
.ibtn .badge{position:absolute;top:-.3rem;right:-.3rem;background:var(--accent);color:#1a1206;font-size:.65rem;font-weight:700;border-radius:1rem;padding:.05rem .35rem}
.ibtn span.t{font-size:.82rem}

/* ---------- right side ---------- */
#side{position:fixed;right:.6rem;top:3.9rem;width:18.5rem;display:flex;flex-direction:column;gap:.45rem;z-index:9;pointer-events:none;bottom:9.5rem}
#side>*{pointer-events:auto}
#minimap-wrap{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.3rem;box-shadow:var(--shadow);position:relative}
#minimap{width:11rem;height:11rem;display:block;border-radius:.4rem;cursor:pointer;image-rendering:pixelated}
#mm-toggle{position:absolute;left:.4rem;top:.4rem;width:1.5rem;height:1.5rem;border-radius:.4rem;border:0;background:rgba(0,0,0,.45);font-size:.8rem;line-height:1}
#inspector{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;box-shadow:var(--shadow);overflow:auto;min-height:0;flex:0 1 auto;animation:slidein .2s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.insp-h{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-solid);z-index:1}
.insp-h canvas{width:2.4rem;height:2.4rem}
.insp-h .ttl{font-weight:700;flex:1}
.insp-h .sub{font-size:.75rem;color:var(--dim)}
.insp-b{padding:.6rem .7rem;display:flex;flex-direction:column;gap:.6rem}
.status{display:flex;align-items:center;gap:.45rem;font-size:.85rem}
.status .lamp{width:.8rem;height:.8rem;border-radius:50%}
.effbar{height:.45rem;background:#0b0e12;border-radius:.25rem;overflow:hidden}
.effbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent));width:0;transition:width .3s var(--ease)}
.sect{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:-.25rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;font-size:.85rem}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:.4rem;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:.5rem;padding:.4rem .7rem;font-size:.85rem;transition:background .15s,transform .12s var(--ease),border-color .15s}
.btn:hover{background:var(--panel3)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1305;font-weight:700}
.btn.primary:hover{background:#ffb84f}
.btn.danger{border-color:#6b2c2c;color:#ffb3b3}
.btn.danger:hover{background:#3a1c1c}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.25rem .5rem;font-size:.78rem}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:.3rem}
.rbtn{background:var(--panel2);border:1px solid var(--line);border-radius:.45rem;padding:.2rem;height:2.6rem;display:flex;align-items:center;justify-content:center;position:relative}
.rbtn:hover{border-color:var(--line2);background:var(--panel3)}
.rbtn.sel{border-color:var(--accent);background:#3a2d15}
.rbtn.locked{opacity:.35}
.rbtn canvas{width:1.8rem;height:1.8rem}
.rgraph{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;background:#10151b;border:1px solid var(--line);border-radius:.5rem;padding:.4rem .5rem;font-size:.82rem}
.rgraph .it{display:inline-flex;align-items:center;gap:.15rem;font-variant-numeric:tabular-nums}
.rgraph canvas{width:1.4rem;height:1.4rem}
.rgraph .arrow{color:var(--dim);padding:0 .15rem}
.rgraph .meta{width:100%;color:var(--dim);font-size:.75rem;margin-top:.1rem}
.bufs{display:flex;gap:.35rem;flex-wrap:wrap}
.buf{display:flex;align-items:center;gap:.2rem;background:#10151b;border:1px solid var(--line);border-radius:.4rem;padding:.15rem .4rem .15rem .2rem;font-size:.8rem;font-variant-numeric:tabular-nums}
.buf canvas{width:1.3rem;height:1.3rem}
.toggle{display:flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.85rem}
.toggle input{width:2.2rem;height:1.2rem;appearance:none;-webkit-appearance:none;background:#0b0e12;border:1px solid var(--line2);border-radius:1rem;position:relative;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;left:.12rem;top:.1rem;width:.85rem;height:.85rem;border-radius:50%;background:var(--dim);transition:left .2s var(--ease),background .2s}
.toggle input:checked{background:#3a2d15;border-color:var(--accent)}
.toggle input:checked::after{left:1.15rem;background:var(--accent)}

/* ---------- bottom build bar ---------- */
#bottom{position:fixed;left:50%;bottom:.6rem;transform:translateX(-50%);max-width:calc(100% - 1.2rem);z-index:10;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
#bottom>*{pointer-events:auto}
#tools{display:flex;gap:.3rem;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.3rem;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
#tools .ibtn{box-shadow:none;height:2.4rem;min-width:2.4rem;background:transparent;border-color:transparent}
#tools .ibtn:hover{background:var(--panel3)}
#tools .ibtn.on{background:#3a2d15;border-color:var(--accent)}
#tools .sep{width:1px;background:var(--line);margin:.2rem .15rem}
#buildbar{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;box-shadow:var(--shadow);padding:.4rem;display:flex;flex-direction:column;gap:.35rem;max-width:100%}
#cats{display:flex;gap:.25rem;align-items:center}
.cat{border:0;background:transparent;padding:.3rem .65rem;border-radius:.45rem;color:var(--dim);font-size:.82rem;transition:background .15s,color .15s}
.cat:hover{background:var(--panel2);color:var(--text)}
.cat.on{background:var(--panel3);color:var(--accent)}
#build-search{margin-left:auto;background:#0d1116;border:1px solid var(--line);border-radius:.45rem;padding:.25rem .5rem;width:8.5rem;font-size:.82rem;outline:none;-webkit-user-select:text;user-select:text}
#build-search:focus{border-color:var(--accent)}
#build-items{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:thin;padding-bottom:.1rem;max-width:100%}
.bitem{position:relative;flex:none;width:4.1rem;height:4.4rem;background:var(--panel2);border:1px solid var(--line);border-radius:.55rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;padding:.2rem;transition:background .15s,border-color .15s,transform .15s var(--ease)}
.bitem:hover{background:var(--panel3);border-color:var(--line2);transform:translateY(-2px)}
.bitem.on{border-color:var(--accent);background:#3a2d15}
.bitem canvas{width:2.3rem;height:2.3rem}
.bitem .c{font-size:.7rem;color:var(--money);font-variant-numeric:tabular-nums}
.bitem .c.no{color:var(--bad)}
.bitem .hk{position:absolute;left:.25rem;top:.15rem;font-size:.62rem;color:var(--faint)}
.bitem .kit{position:absolute;right:.2rem;top:.15rem;font-size:.6rem;background:var(--blue);color:#06141b;border-radius:.6rem;padding:0 .3rem;font-weight:700}
.bitem.locked{opacity:.5}
.bitem.locked::after{content:"";position:absolute;inset:0;border-radius:.55rem;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.25) 6px 12px)}
.bitem .lk{position:absolute;right:.25rem;bottom:.25rem;z-index:1}

/* ---------- tooltip / toasts / hints ---------- */
#tooltip{position:fixed;z-index:50;pointer-events:none;background:rgba(12,15,20,.97);border:1px solid var(--line2);border-radius:.55rem;padding:.5rem .65rem;font-size:.82rem;max-width:18rem;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;left:0;top:0}
#tooltip.show{opacity:1}
#tooltip h4{margin:0 0 .25rem;font-size:.92rem}
#tooltip .d{color:var(--dim);margin-bottom:.3rem}
#tooltip .bad{color:var(--bad)}
#tooltip .good{color:var(--good)}
#tooltip .kv{font-size:.8rem}
#toasts{position:fixed;top:4.2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.35rem;align-items:center;z-index:40;pointer-events:none}
.toast{background:rgba(14,18,24,.96);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:.5rem;padding:.45rem .8rem;font-size:.85rem;box-shadow:var(--shadow);animation:toastin .22s var(--ease);transition:opacity .3s,transform .3s var(--ease)}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}.toast.info{border-left-color:var(--blue)}
.toast.out{opacity:0;transform:translateY(-6px)}
@keyframes toastin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#mode-hint{position:fixed;left:.6rem;bottom:.6rem;z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:.55rem;padding:.35rem .6rem;font-size:.78rem;color:var(--dim);max-width:16rem;pointer-events:none}
#mode-hint b{color:var(--text)}
#fps{position:fixed;left:.6rem;bottom:3rem;font-size:.7rem;color:var(--faint);z-index:9;pointer-events:none;font-variant-numeric:tabular-nums}

/* ---------- tutorial ---------- */
#tut{position:fixed;left:.6rem;top:4rem;z-index:30;max-width:21rem;background:linear-gradient(180deg,#221a0e,#18140d);border:1px solid var(--accent-d);border-radius:.8rem;padding:.7rem .8rem;box-shadow:var(--shadow);animation:slidein .25s var(--ease)}
#tut .step{font-size:.7rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
#tut p{margin:.3rem 0 .55rem;font-size:.9rem;line-height:1.4}
#tut-arrow{position:fixed;z-index:31;pointer-events:none;width:2.2rem;height:2.2rem;margin:-1.1rem 0 0 -1.1rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
#tut-arrow svg{width:100%;height:100%;animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
.tut-glow{box-shadow:0 0 0 2px var(--accent),0 0 18px 4px rgba(240,165,58,.55)!important;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--accent),0 0 6px 1px rgba(240,165,58,.3)}}

/* ---------- modals ---------- */
#modal-root{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,7,10,.55);backdrop-filter:blur(3px);padding:1rem}
#modal-root.open{display:flex;animation:fadein .18s var(--ease)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel-solid);border:1px solid var(--line2);border-radius:1rem;box-shadow:0 20px 60px rgba(0,0,0,.6);width:min(58rem,100%);max-height:min(46rem,100%);display:none;flex-direction:column;overflow:hidden;animation:pop .22s var(--ease)}
.modal.open{display:flex}
.modal.sm{width:min(28rem,100%)}
.modal.md{width:min(40rem,100%)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:1.1rem;flex:1}
.mb{padding:1rem;overflow:auto;-webkit-user-select:text;user-select:text}
.mb p{line-height:1.5;color:#cfd8e2}
.close{background:transparent;border:0;color:var(--dim);width:2rem;height:2rem;border-radius:.5rem}
.close:hover{background:var(--panel3);color:var(--text)}
.tabs{display:flex;gap:.25rem;margin-bottom:.8rem;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th{text-align:left;color:var(--dim);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:.35rem .4rem;border-bottom:1px solid var(--line);position:sticky;top:-1rem;background:var(--panel-solid)}
table.t td{padding:.3rem .4rem;border-bottom:1px solid #1d252f;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#1c242e}
table.t tr.sel td{background:#2b2415}
table.t td canvas.ic{width:1.5rem;height:1.5rem;vertical-align:middle}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--dim)}
.big-graph{width:100%;height:12rem;background:#0b0e12;border-radius:.5rem;border:1px solid var(--line);display:block;margin-bottom:.8rem}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.6rem}
.settings-grid h3{grid-column:1/-1;margin:.4rem 0 -.4rem;font-size:.78rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.field{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem}
.field label{color:var(--dim)}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field select,.field input[type=text],textarea{background:#0d1116;border:1px solid var(--line2);border-radius:.45rem;padding:.35rem .5rem;outline:none}
textarea{width:100%;height:5.5rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;resize:vertical;-webkit-user-select:text;user-select:text}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;grid-column:1/-1}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.55rem;font-size:.8rem;display:flex;flex-direction:column;gap:.35rem}
.slot .meta{color:var(--dim);min-height:2.2em}
.keys{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.25rem .9rem;font-size:.82rem}
kbd{display:inline-block;min-width:1.5em;text-align:center;background:#0c1015;border:1px solid var(--line2);border-bottom-width:2px;border-radius:.3rem;padding:0 .35rem;font-family:inherit;font-size:.78rem;color:var(--text)}

/* research tree */
#tree{position:relative;min-width:62rem;min-height:30rem}
#tree svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tnode{position:absolute;width:11rem;background:var(--panel2);border:1px solid var(--line2);border-radius:.65rem;padding:.5rem .6rem;font-size:.8rem;cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--ease)}
.tnode:hover{transform:translateY(-2px);border-color:var(--dim)}
.tnode .n{font-weight:700;font-size:.88rem;margin-bottom:.15rem}
.tnode .d{color:var(--dim);font-size:.74rem;line-height:1.3;margin-bottom:.3rem}
.tnode .cost{display:flex;gap:.35rem;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tnode .cost span.no{color:var(--bad)}
.tnode.done{border-color:#2f6b40;background:#16261b}
.tnode.done .n::after{content:" ✓";color:var(--good)}
.tnode.avail{border-color:var(--accent-d)}
.tnode.afford{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px rgba(240,165,58,.25)}
.tnode.locked{opacity:.5}
.tnode .lv{float:right;color:var(--accent);font-size:.72rem}
.goal{background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.55rem .7rem;margin-bottom:.45rem}
.goal .top{display:flex;justify-content:space-between;gap:.5rem;font-size:.88rem}
.goal .rw{color:var(--money);font-size:.8rem;white-space:nowrap}
.goal .effbar{margin-top:.35rem}
.goal.done{opacity:.6}
.rebirth{background:linear-gradient(135deg,#1f1830,#191d2a);border:1px solid #4d3f7a;border-radius:.8rem;padding:.8rem;margin-top:1rem}
.rebirth h3{margin:.1rem 0 .4rem;color:#c7b4ff}
.codex-m{margin-bottom:1rem}
.codex-m h3{font-size:.85rem;color:var(--accent);margin:.2rem 0 .4rem}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.4rem}

/* error overlay */
#error-overlay{position:fixed;inset:0;z-index:100;background:rgba(8,10,14,.92);display:none;align-items:center;justify-content:center;padding:1rem}
#error-overlay.open{display:flex}
#error-overlay .box{max-width:34rem;background:var(--panel-solid);border:1px solid #6b2c2c;border-radius:1rem;padding:1.2rem}
#error-overlay pre{white-space:pre-wrap;font-size:.72rem;color:#ffb3b3;background:#0b0e12;border-radius:.5rem;padding:.6rem;max-height:12rem;overflow:auto;-webkit-user-select:text;user-select:text}

/* burst particles (screen space UI juice) */
#fx{position:fixed;inset:0;pointer-events:none;z-index:45}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .ibtn span.t{display:none}
  #objective{display:none}
  #st-sci{display:none}
}
@media (max-width:640px){
  html{font-size:calc(12.5px * var(--ui))}
  #topbar{flex-wrap:wrap}
  #power-graph{display:none}
  .pbar{width:4.5rem}
  .tbtns{flex:1;justify-content:flex-end;flex-wrap:wrap}
  .tbtns .ibtn{min-width:2.4rem;height:2.4rem;padding:0 .4rem}
  #side{top:auto;bottom:12.6rem;left:.6rem;right:.6rem;width:auto}
  #minimap{width:7rem;height:7rem}
  #minimap-wrap{position:fixed;right:.6rem;top:6.6rem}
  #inspector{max-height:40vh}
  .bitem{width:3.6rem;height:4rem}
  #build-search{width:6rem}
  #mode-hint{display:none}
  .settings-grid{grid-template-columns:1fr}
  .slots{grid-template-columns:1fr}
  #tut{top:auto;bottom:12.6rem;right:.6rem;max-width:none}
}
@media (pointer:coarse){ #tool-draw{display:flex!important} }
</style>
</head>

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

}

  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
function hash2(x, y, s) { // cheap integer hash → [0,1)
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
class ValueNoise {
  constructor(seed) {
    const r = mulberry32(seed);
    this.perm = new Uint16Array(512); this.val = new Float32Array(256);
    const p = new Uint16Array(256);
    for (let i = 0; i < 256; i++) { p[i] = i; this.val[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
    for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
  }
  n(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const P = this.perm, V = this.val, X = xi & 255, Y = yi & 255;
    const a = V[P[P[X] + Y]], b = V[P[P[X + 1] + Y]], c = V[P[P[X] + Y + 1]], d = V[P[P[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  fbm(x, y, oct) {
    let s = 0, amp = 0.5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { s += this.n(x * f, y * f) * amp; norm += amp; amp *= 0.5; f *= 2.03; }
    return s / norm;
  }
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

  else {
    let k = 0; while (n >= 1000 && k < SUFFIX.length - 1) { n /= 1000; k++; }
    s = (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString()) + SUFFIX[k];
  }
  return neg ? '-' + s : s;
}
const fmtMoney = n => (n < 0 ? '-$' : '$') + fmt(Math.abs(n));
